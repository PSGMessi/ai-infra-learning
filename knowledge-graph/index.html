" font-weight=\"500\" fill=\"#26215C\">同一张计算图：上半部分前向算值，下半部分反向算梯度</text><text x=\"40\" y=\"72\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Forward</text><g font-family=\"sans-serif\"><rect x=\"110\" y=\"52\" width=\"88\" height=\"52\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"154\" y=\"72\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">X</text><text x=\"154\" y=\"91\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">[B,D]</text><rect x=\"236\" y=\"52\" width=\"110\" height=\"52\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"291\" y=\"72\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">Linear+ReLU</text><text x=\"291\" y=\"91\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">A1 [B,H]</text><rect x=\"384\" y=\"52\" width=\"104\" height=\"52\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"436\" y=\"72\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">Linear</text><text x=\"436\" y=\"91\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">Y_hat [B,O]</text><rect x=\"526\" y=\"52\" width=\"104\" height=\"52\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"578\" y=\"72\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">Loss</text><text x=\"578\" y=\"91\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">scalar</text></g><path d=\"M198 78 L232 78\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M346 78 L380 78\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M488 78 L522 78\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"40\" y=\"172\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#3C3489\">Backward</text><g font-family=\"sans-serif\"><rect x=\"526\" y=\"148\" width=\"104\" height=\"52\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"578\" y=\"168\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dL/dL</text><text x=\"578\" y=\"187\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">1</text><rect x=\"384\" y=\"148\" width=\"104\" height=\"52\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"436\" y=\"168\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dY_hat</text><text x=\"436\" y=\"187\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[B,O]</text><rect x=\"236\" y=\"148\" width=\"110\" height=\"52\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"291\" y=\"168\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dA1 / dZ1</text><text x=\"291\" y=\"187\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[B,H]</text><rect x=\"110\" y=\"148\" width=\"88\" height=\"52\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"154\" y=\"168\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dX</text><text x=\"154\" y=\"187\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[B,D]</text></g><path d=\"M526 174 L492 174\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M384 174 L350 174\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M236 174 L202 174\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"70\" y=\"250\" width=\"540\" height=\"104\" rx=\"14\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"90\" y=\"278\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">参数梯度在各层 backward 中产生</text><text x=\"90\" y=\"304\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Linear 2 → dW2、db2；Linear 1 → dW1、db1；输入需要梯度时还产生 dX</text><text x=\"90\" y=\"330\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">Optimizer 读取 parameter.grad；它不负责计算这些梯度。</text><rect x=\"210\" y=\"380\" width=\"260\" height=\"38\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"399\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\" dominant-baseline=\"central\">Optimizer step：θ ← θ − η × grad</text></svg>"}, {"title": "统一两层MLP Shape", "type": "svg", "body": "<svg viewBox=\"0 0 680 520\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>两层 MLP 的张量 Shape 和反向梯度流</title><desc>展示B等于2的两层MLP中X、W1、Z1、A1、W2、预测和Loss的前向shape，以及相反方向的梯度shape。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">统一例子：B=2，D=2，H=2，O=1</text><text x=\"40\" y=\"66\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Forward values</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"84\" width=\"94\" height=\"58\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"87\" y=\"105\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">X</text><text x=\"87\" y=\"126\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">[2,2]</text><rect x=\"170\" y=\"84\" width=\"112\" height=\"58\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"226\" y=\"105\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">XW1+b1</text><text x=\"226\" y=\"126\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">Z1 [2,2]</text><rect x=\"318\" y=\"84\" width=\"94\" height=\"58\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"365\" y=\"105\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">ReLU</text><text x=\"365\" y=\"126\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">A1 [2,2]</text><rect x=\"448\" y=\"84\" width=\"112\" height=\"58\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"504\" y=\"105\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">A1W2+b2</text><text x=\"504\" y=\"126\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">Y_hat [2,1]</text><rect x=\"596\" y=\"84\" width=\"44\" height=\"58\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"618\" y=\"105\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">L</text><text x=\"618\" y=\"126\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[]</text></g><path d=\"M134 113 L166 113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M282 113 L314 113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M412 113 L444 113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M560 113 L592 113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"168\" y=\"168\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"226\" y=\"187\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#2C2C2A\" text-anchor=\"middle\">W1 [2,2]</text><text x=\"226\" y=\"205\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\" text-anchor=\"middle\">b1 [2]</text><path d=\"M226 168 L226 146\" fill=\"none\" stroke=\"#5F5E5A\" stroke-width=\"1.2\" marker-end=\"url(#arrow)\"/><rect x=\"446\" y=\"168\" width=\"116\" height=\"50\" rx=\"9\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"504\" y=\"187\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#2C2C2A\" text-anchor=\"middle\">W2 [2,1]</text><text x=\"504\" y=\"205\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\" text-anchor=\"middle\">b2 [1]</text><path d=\"M504 168 L504 146\" fill=\"none\" stroke=\"#5F5E5A\" stroke-width=\"1.2\" marker-end=\"url(#arrow)\"/><text x=\"40\" y=\"270\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#3C3489\">Backward gradients</text><g font-family=\"sans-serif\"><rect x=\"548\" y=\"288\" width=\"92\" height=\"54\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"594\" y=\"309\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dY_hat</text><text x=\"594\" y=\"329\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[2,1]</text><rect x=\"406\" y=\"288\" width=\"104\" height=\"54\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"458\" y=\"309\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dA1</text><text x=\"458\" y=\"329\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[2,2]</text><rect x=\"264\" y=\"288\" width=\"104\" height=\"54\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"316\" y=\"309\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dZ1</text><text x=\"316\" y=\"329\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[2,2]</text><rect x=\"122\" y=\"288\" width=\"104\" height=\"54\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"174\" y=\"309\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dX</text><text x=\"174\" y=\"329\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[2,2]</text></g><path d=\"M548 315 L514 315\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M406 315 L372 315\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M264 315 L230 315\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"386\" y=\"380\" width=\"144\" height=\"52\" rx=\"9\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"458\" y=\"400\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">dW2 [2,1]</text><text x=\"458\" y=\"419\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">db2 [1]</text><path d=\"M458 342 L458 376\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"1.2\" marker-end=\"url(#arrow)\"/><rect x=\"244\" y=\"380\" width=\"144\" height=\"52\" rx=\"9\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"316\" y=\"400\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">dW1 [2,2]</text><text x=\"316\" y=\"419\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">db1 [2]</text><path d=\"M316 342 L316 376\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"1.2\" marker-end=\"url(#arrow)\"/><rect x=\"90\" y=\"464\" width=\"500\" height=\"36\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"482\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#791F1F\" text-anchor=\"middle\" dominant-baseline=\"central\">每个梯度与被求导变量 Shape 相同；矩阵转置来自维度对齐。</text></svg>"}, {"title": "完整数值链路", "type": "formula", "body": "B=2,D=2,H=2,O=1。Forward得到Z1=[[2.5,-0.5],[0.5,1.0]]，A1=[[2.5,0],[0.5,1]]，Y_hat=[[1.1],[-0.3]]，L=0.025。Backward依次得到dY_hat=[[0.05],[-0.15]]；dW2=[[0.05],[-0.15]]；db2=[-0.1]；dZ1=[[0.02,0],[-0.06,0.09]]；dW1=[[0.08,-0.09],[-0.02,0.09]]；db1=[-0.04,0.09]。"}, {"title": "Linear Backward", "type": "formula", "body": "对Y=XW+b，收到dY[B,H]：dW=X^T dY，db=sum_batch(dY)，dX=dY W^T。矩阵转置来自Shape对齐和Batch收缩，不是需要死记的符号。"}, {"title": "ReLU 与梯度门控", "type": "formula", "body": "dZ=dA⊙1[Z>0]。本例Z1[0,1]=-0.5，因此即使dA1[0,1]=-0.03，dZ1[0,1]仍为0。"}, {"title": "分叉处梯度累加", "type": "svg", "body": "<svg viewBox=\"0 0 680 350\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>计算图分叉处的梯度累加</title><desc>变量x通过平方和乘3两条路径影响y，反向时两条路径对x的梯度贡献在x节点相加。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">同一个 Tensor 经过多条路径影响 Loss：反向贡献必须求和</text><rect x=\"54\" y=\"130\" width=\"88\" height=\"54\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"98\" y=\"151\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">x</text><text x=\"98\" y=\"171\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">shared input</text><rect x=\"226\" y=\"72\" width=\"108\" height=\"54\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"280\" y=\"93\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">a = x²</text><text x=\"280\" y=\"113\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">local: 2x</text><rect x=\"226\" y=\"190\" width=\"108\" height=\"54\" rx=\"9\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"280\" y=\"211\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">b = 3x</text><text x=\"280\" y=\"231\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">local: 3</text><rect x=\"430\" y=\"130\" width=\"104\" height=\"54\" rx=\"9\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"482\" y=\"151\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">y = a+b</text><text x=\"482\" y=\"171\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">scalar</text><path d=\"M142 148 C174 120 192 101 222 99\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M142 168 C174 196 192 215 222 217\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M334 99 C374 105 392 130 426 148\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M334 217 C374 211 392 184 426 166\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"86\" y=\"270\" width=\"508\" height=\"52\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"290\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">Backward 到 x：dx = dy×2x + dy×3</text><text x=\"340\" y=\"310\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">Residual、参数共享、RNN 展开、同一参数多次使用都遵循这条规则</text><path d=\"M430 157 C360 280 190 280 142 174\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" marker-end=\"url(#arrow)\"/></svg>"}, {"title": "VJP 与 Reverse Mode", "type": "text", "body": "反向传播不构造完整Jacobian，而计算上游向量与局部Jacobian的乘积v^T J。神经网络参数很多、Loss通常是标量，因此Reverse-Mode AD一次反向即可得到所有参数梯度。"}, {"title": "PyTorch 验证代码", "type": "code", "body": "Z1=X@W1+b1\nA1=torch.relu(Z1)\nY_hat=A1@W2+b2\nloss=((Y_hat-Y)**2).sum()/(2*X.shape[0])\nloss.backward()\n# 叶子参数的 .grad 保存dW1/db1/dW2/db2"}, {"title": "工程扩展", "type": "text", "body": "Mixed Precision在链式法则外增加Loss Scaling/Unscale；DDP在梯度Bucket就绪后AllReduce；FSDP用ReduceScatter聚合分片梯度；Pipeline Parallel把Activation Gradient通过P2P传给前一Stage；Activation Checkpoint用重算换激活显存。"}, {"title": "常见误区", "type": "text", "body": "Backward传回的是Loss对中间变量的梯度而非Loss数值；loss.backward不会自动清空旧grad；广播的反向是沿广播轴求和；一个Tensor有多条下游路径时梯度必须累加。"}]}}, {"id": "Chain Rule", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["链式法则"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "复合函数的总导数等于沿依赖路径的局部导数乘积；多条路径的贡献相加。"}, {"title": "机制", "type": "formula", "body": "若a=f(x), L=g(a)，则dL/dx=(dL/da)(da/dx)。若x经多条路径影响L，则dL/dx=Σ_path contribution。"}, {"title": "与反向传播的关系", "type": "text", "body": "链式法则决定反向数据依赖；Shape与局部Jacobian决定每个VJP。"}, {"title": "最小示例", "type": "code", "body": "# 通用局部backward模式\nupstream = dL_doutput\ndinput = vjp(upstream, saved_context)\n# 多路径时：input.grad += dinput"}, {"title": "常见误区", "type": "text", "body": "局部backward只需上游梯度和本算子上下文，不需要知道完整下游网络；梯度Shape应与被求导变量一致。"}]}}, {"id": "Computational Graph", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["计算图", "Dynamic Graph"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "计算图记录Tensor和算子之间的依赖，反向传播按反向拓扑序执行每个算子的backward。"}, {"title": "机制", "type": "formula", "body": "节点是Tensor/算子，边是数据依赖。前向记录grad_fn和Saved Tensor；反向从Loss种子1出发。"}, {"title": "与反向传播的关系", "type": "text", "body": "分叉必须等待并累加全部下游梯度；执行后默认释放大部分Saved Tensor。"}, {"title": "最小示例", "type": "code", "body": "# 通用局部backward模式\nupstream = dL_doutput\ndinput = vjp(upstream, saved_context)\n# 多路径时：input.grad += dinput"}, {"title": "常见误区", "type": "text", "body": "局部backward只需上游梯度和本算子上下文，不需要知道完整下游网络；梯度Shape应与被求导变量一致。"}]}}, {"id": "Reverse-Mode Automatic Differentiation", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["Reverse-Mode AD", "VJP"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Reverse-Mode AD通过Vector-Jacobian Product避免显式构造巨大Jacobian，特别适合参数很多而输出Loss为标量的训练。"}, {"title": "机制", "type": "formula", "body": "对f:R^n→R^m，上游v执行v^T J_f；从标量Loss反向一次即可得到对全部输入/参数的梯度。"}, {"title": "与反向传播的关系", "type": "text", "body": "它的内存代价是前向需要保存或重算backward上下文。"}, {"title": "最小示例", "type": "code", "body": "# 通用局部backward模式\nupstream = dL_doutput\ndinput = vjp(upstream, saved_context)\n# 多路径时：input.grad += dinput"}, {"title": "常见误区", "type": "text", "body": "局部backward只需上游梯度和本算子上下文，不需要知道完整下游网络；梯度Shape应与被求导变量一致。"}]}}, {"id": "PyTorch Autograd", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["Autograd", "grad_fn", "自动微分"], "group": "framework", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "PyTorch eager执行时动态构图，叶子参数grad默认累加，中间Tensor梯度临时流过；retain_grad可用于调试。"}, {"title": "机制", "type": "formula", "body": "loss.backward以dL/dL=1为种子；每个grad_fn读取Saved Tensor执行VJP；默认Backward后释放计算图。"}, {"title": "与反向传播的关系", "type": "text", "body": "no_grad不建图；retain_graph延长激活生命周期；in-place操作和detach会改变梯度图。"}, {"title": "最小示例", "type": "code", "body": "# 通用局部backward模式\nupstream = dL_doutput\ndinput = vjp(upstream, saved_context)\n# 多路径时：input.grad += dinput"}, {"title": "常见误区", "type": "text", "body": "局部backward只需上游梯度和本算子上下文，不需要知道完整下游网络；梯度Shape应与被求导变量一致。"}]}}, {"id": "Gradient Accumulation", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["梯度累加", "Micro-batch Accumulation"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "梯度累加既指计算图多路径贡献相加，也指多个Micro-batch的parameter.grad跨Backward累加。"}, {"title": "机制", "type": "formula", "body": "若累加K个Micro-batches并想保持平均Loss语义，常令每个loss除以K再backward；Optimizer Step后zero_grad(set_to_none=True)。"}, {"title": "与反向传播的关系", "type": "text", "body": "忘记除K会放大梯度，忘记zero_grad会把上一个Optimizer Step的梯度继续累加。"}, {"title": "最小示例", "type": "code", "body": "# 通用局部backward模式\nupstream = dL_doutput\ndinput = vjp(upstream, saved_context)\n# 多路径时：input.grad += dinput"}, {"title": "常见误区", "type": "text", "body": "局部backward只需上游梯度和本算子上下文，不需要知道完整下游网络；梯度Shape应与被求导变量一致。"}]}}, {"id": "Activation Checkpointing", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["Gradient Checkpointing", "激活重计算"], "group": "memory", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Activation Checkpointing只保存区间边界，在Backward时重算Forward中间值，以额外FLOP换更少Saved Activation显存。"}, {"title": "机制", "type": "formula", "body": "理论梯度不变；需要恢复Dropout/RNG状态并避免有副作用算子。"}, {"title": "与反向传播的关系", "type": "text", "body": "Checkpoint粒度决定显存收益、重算开销和流水线性能。"}, {"title": "最小示例", "type": "code", "body": "# 通用局部backward模式\nupstream = dL_doutput\ndinput = vjp(upstream, saved_context)\n# 多路径时：input.grad += dinput"}, {"title": "常见误区", "type": "text", "body": "局部backward只需上游梯度和本算子上下文，不需要知道完整下游网络；梯度Shape应与被求导变量一致。"}]}}, {"id": "LM Head", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Language Modeling Head", "Vocabulary Projection", "输出词表投影"], "group": "architecture", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "LM Head是W_vocab[V,H]对最终隐藏状态X[N,H]的Vocabulary Projection：Z=XW^T得到[N,V] Logits，再接Stable Cross Entropy。它常是大词表、长序列训练的显存热点。"}, {"title": "完整前反向数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 440\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>LM Head 从隐藏状态到交叉熵的完整路径</title><desc>展示最终隐藏状态经过词表投影生成Logits，再通过稳定Softmax交叉熵产生Loss，反向产生dLogits、dHidden和dWeight。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">LM Head = Vocabulary projection + Cross Entropy</text><text x=\"40\" y=\"68\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Forward</text><rect x=\"40\" y=\"86\" width=\"120\" height=\"58\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"100\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">H_final</text><text x=\"100\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">[B,S,H] → [N,H]</text><rect x=\"200\" y=\"86\" width=\"120\" height=\"58\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"260\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\" text-anchor=\"middle\">W_vocab</text><text x=\"260\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\" text-anchor=\"middle\">[V,H]</text><rect x=\"360\" y=\"86\" width=\"120\" height=\"58\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"420\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">Logits Z</text><text x=\"420\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[N,V]</text><rect x=\"520\" y=\"86\" width=\"120\" height=\"58\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"580\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">Cross Entropy</text><text x=\"580\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">Loss scalar</text><path d=\"M160 115 L356 115\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M320 115 L356 115\" fill=\"none\" stroke=\"#5F5E5A\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M480 115 L516 115\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"40\" y=\"212\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#3C3489\">Backward</text><rect x=\"520\" y=\"230\" width=\"120\" height=\"58\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"580\" y=\"251\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">dZ</text><text x=\"580\" y=\"272\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">[N,V]</text><rect x=\"326\" y=\"230\" width=\"144\" height=\"58\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"398\" y=\"251\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">dX = dZ × W</text><text x=\"398\" y=\"272\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">[N,H]</text><rect x=\"132\" y=\"230\" width=\"144\" height=\"58\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"204\" y=\"251\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">dW = dZᵀ × X</text><text x=\"204\" y=\"272\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">[V,H]</text><path d=\"M520 259 L474 259\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M520 271 C450 338 314 330 276 278\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"338\" width=\"600\" height=\"70\" rx=\"12\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"60\" y=\"362\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\">显存热点</text><text x=\"60\" y=\"386\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">Z 和 dZ 都是 [N,V]；V 常为 32K–256K，N 随 Batch×Sequence 增长。</text></svg>"}, {"title": "Shape与主公式", "type": "formula", "body": "Forward: Z=XW^T，[N,H]×[H,V]→[N,V]。CE: loss_n=logsumexp(Z_n)−Z[n,y_n]。Backward: dZ=(P−OneHot)/N；dX=dZW；dW=dZ^TX。"}, {"title": "FLOPs", "type": "formula", "body": "Forward Projection≈2NHV；dX≈2NHV；dW≈2NHV；标准训练主GEMM≈6NHV。若Forward不保存Logits、Backward重算Projection，保守上界≈8NHV，LM Head子模块主GEMM增加约33.3%。"}, {"title": "显存量级", "type": "formula", "body": "完整Logits bytes=N×V×dtype_bytes。B=2,S=8192,N=16384,H=4096,V=128256,BF16时，一份Logits≈3.914GiB，H_final仅128MiB，W_vocab≈0.979GiB。显式Logits与dLogits同时活跃的上界约7.828GiB。"}, {"title": "标准生命周期", "type": "svg", "body": "<svg viewBox=\"0 0 680 470\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>标准 LM Head 前反向的显存生命周期</title><desc>展示隐藏状态、LM Head权重、Logits、Softmax统计、dLogits、dHidden和dWeight在各阶段的存活关系，峰值通常出现在Cross Entropy backward附近。</desc><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">标准 Linear + Cross Entropy：大 Tensor 生命周期</text><g font-family=\"sans-serif\" font-size=\"11\"><text x=\"40\" y=\"76\" fill=\"#5F5E5A\">H_final</text><text x=\"40\" y=\"116\" fill=\"#5F5E5A\">W_vocab</text><text x=\"40\" y=\"156\" fill=\"#5F5E5A\">Logits</text><text x=\"40\" y=\"196\" fill=\"#5F5E5A\">CE stats</text><text x=\"40\" y=\"236\" fill=\"#5F5E5A\">dLogits</text><text x=\"40\" y=\"276\" fill=\"#5F5E5A\">dHidden</text><text x=\"40\" y=\"316\" fill=\"#5F5E5A\">dWeight</text></g><g fill=\"#F1EFE8\" stroke=\"#D3D1C7\" stroke-width=\"0.5\"><rect x=\"124\" y=\"48\" width=\"82\" height=\"290\" rx=\"8\"/><rect x=\"210\" y=\"48\" width=\"82\" height=\"290\" rx=\"8\"/><rect x=\"296\" y=\"48\" width=\"82\" height=\"290\" rx=\"8\"/><rect x=\"382\" y=\"48\" width=\"82\" height=\"290\" rx=\"8\"/><rect x=\"468\" y=\"48\" width=\"82\" height=\"290\" rx=\"8\"/><rect x=\"554\" y=\"48\" width=\"82\" height=\"290\" rx=\"8\"/></g><g font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\" text-anchor=\"middle\"><text x=\"165\" y=\"360\">输入</text><text x=\"251\" y=\"360\">投影</text><text x=\"337\" y=\"360\">CE Fwd</text><text x=\"423\" y=\"360\">CE Bwd</text><text x=\"509\" y=\"360\">Linear Bwd</text><text x=\"595\" y=\"360\">结束</text></g><rect x=\"124\" y=\"60\" width=\"426\" height=\"24\" rx=\"5\" fill=\"#B5D4F4\"/><rect x=\"124\" y=\"100\" width=\"512\" height=\"24\" rx=\"5\" fill=\"#D3D1C7\"/><rect x=\"210\" y=\"140\" width=\"340\" height=\"24\" rx=\"5\" fill=\"#AFA9EC\"/><rect x=\"296\" y=\"180\" width=\"168\" height=\"24\" rx=\"5\" fill=\"#9FE1CB\"/><rect x=\"382\" y=\"220\" width=\"168\" height=\"24\" rx=\"5\" fill=\"#F09595\"/><rect x=\"468\" y=\"260\" width=\"82\" height=\"24\" rx=\"5\" fill=\"#85B7EB\"/><rect x=\"468\" y=\"300\" width=\"168\" height=\"24\" rx=\"5\" fill=\"#FAC775\"/><rect x=\"374\" y=\"390\" width=\"178\" height=\"44\" rx=\"9\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"463\" y=\"407\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#791F1F\" text-anchor=\"middle\">常见峰值区</text><text x=\"463\" y=\"425\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\" text-anchor=\"middle\">Logits 与 dLogits/CE 临时量重叠</text></svg>"}, {"title": "Weight Tying", "type": "text", "body": "输入Embedding与LM Head可共享[V,H]参数，从而减少一份参数、梯度和优化器状态；共享参数总梯度=dW_lm_head+dW_embedding，但Weight Tying不消除[N,V]动态Logits。"}, {"title": "融合与分块", "type": "svg", "body": "<svg viewBox=\"0 0 680 480\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>标准 LM Head 与 Fused Chunked Linear Cross Entropy 对比</title><desc>标准路径完整物化Logits和dLogits；融合路径按Token或Vocabulary块计算，保存每Token的max和sum-exp，Backward重算Chunk并累计dHidden和dWeight。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">完整物化 vs Fused Chunked LM Head</text><text x=\"40\" y=\"68\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\">标准路径</text><rect x=\"40\" y=\"86\" width=\"126\" height=\"58\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"103\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">H [N,H]</text><text x=\"103\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">× Wᵀ</text><rect x=\"208\" y=\"86\" width=\"150\" height=\"58\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"283\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\" text-anchor=\"middle\">完整 Logits</text><text x=\"283\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\" text-anchor=\"middle\">[N,V]</text><rect x=\"400\" y=\"86\" width=\"112\" height=\"58\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"456\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">CE</text><text x=\"456\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">保存大中间量</text><rect x=\"554\" y=\"86\" width=\"86\" height=\"58\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"597\" y=\"107\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\" text-anchor=\"middle\">dLogits</text><text x=\"597\" y=\"128\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\" text-anchor=\"middle\">[N,V]</text><path d=\"M166 115 L204 115\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M358 115 L396 115\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M512 115 L550 115\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"40\" y=\"214\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">Fused Chunked 路径</text><rect x=\"40\" y=\"232\" width=\"126\" height=\"58\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"103\" y=\"253\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">H [N,H]</text><text x=\"103\" y=\"274\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">× W_chunkᵀ</text><rect x=\"208\" y=\"232\" width=\"150\" height=\"58\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"283\" y=\"253\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">Logits Tile</text><text x=\"283\" y=\"274\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">[C_t,C_v]</text><rect x=\"400\" y=\"232\" width=\"112\" height=\"58\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"456\" y=\"253\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">Online LSE</text><text x=\"456\" y=\"274\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">max/sum [N]</text><rect x=\"554\" y=\"232\" width=\"86\" height=\"58\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"597\" y=\"253\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">覆盖 Tile</text><text x=\"597\" y=\"274\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">无 [N,V]</text><path d=\"M166 261 L204 261\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M358 261 L396 261\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M512 261 L550 261\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"92\" y=\"346\" width=\"496\" height=\"92\" rx=\"13\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"112\" y=\"371\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">Backward</text><text x=\"112\" y=\"396\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">重算当前 Tile → 恢复 Softmax → 形成 dZ Tile → 累计 dH、dW → 释放</text><text x=\"112\" y=\"420\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">代价：额外 Projection FLOPs、Chunk Launch、实现复杂度和可能的 GEMM 利用率下降。</text></svg>"}, {"title": "优化路线", "type": "text", "body": "优先诊断大Tensor身份；低风险顺序通常是BF16 Logits+FP32 reduction、避免全词表AllGather、Vocab Parallel CE、自定义Fused Linear CE、Token/Vocab双维Chunk、CCE-like片上Tile。普通Python循环可能累积Autograd子图，不能保证只保留一个Chunk。"}, {"title": "动态分析器", "type": "text", "body": "在线交互地址：https://psgmessi.github.io/ai-infra-learning/lm-head-memory-explorer.html 。可调整B/S/H/V/dtype/TP/Chunk并观察逐阶段FLOPs、显存和通信解析估算。"}, {"title": "正确性与性能验收", "type": "text", "body": "固定Hidden、Weight、Labels、Reduction、Ignore Index、Label Smoothing和并行配置；比较Loss、per-token loss、dHidden、dWeight、Tied Embedding总梯度和Optimizer Step。性能同时看peak allocated/reserved、memory snapshot、Nsight、GEMM TFLOP/s、HBM和Collective暴露时间。"}, {"title": "Stable CE 四个公式逐项推导", "type": "formula", "body": "对Token n：m_n=max_v Z[n,v]；s_n=Σ_v exp(Z[n,v]−m_n)；logsumexp_n=m_n+log(s_n)；loss_n=logsumexp_n−Z[n,y_n]。代数来源：Σexp(Z)=exp(m)Σexp(Z−m)，所以log(Σexp(Z))=m+log(s)。减最大值使所有指数输入≤0，exp值≤1，而Softmax概率不变。"}, {"title": "Token 0 八步数值图", "type": "svg", "body": "<svg viewBox=\"0 0 680 520\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Token 0 Stable Softmax Cross Entropy 完整数值流程</title><desc>从四个Logits开始，依次计算最大值、平移Logits、指数、SumExp、LogSumExp、目标Logit和最终Loss。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Token 0：Stable Cross Entropy 的 8 个数值步骤</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"56\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"60\" y=\"77\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">1. Logits</text><text x=\"200\" y=\"77\" font-size=\"12\" fill=\"#185FA5\">z0 = [1, 0, −1, 0.5]，target id = 0</text><text x=\"200\" y=\"96\" font-size=\"12\" fill=\"#185FA5\">target logit = z0[0] = 1</text><rect x=\"40\" y=\"126\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"60\" y=\"148\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">2. Max</text><text x=\"200\" y=\"148\" font-size=\"12\" fill=\"#534AB7\">m0 = max(1,0,−1,0.5) = 1</text><rect x=\"40\" y=\"188\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"60\" y=\"210\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">3. Shift</text><text x=\"200\" y=\"210\" font-size=\"12\" fill=\"#534AB7\">z0−m0 = [0,−1,−2,−0.5]</text><rect x=\"40\" y=\"250\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"60\" y=\"271\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">4. Exp</text><text x=\"200\" y=\"271\" font-size=\"12\" fill=\"#0F6E56\">[1, 0.367879, 0.135335, 0.606531]</text><text x=\"200\" y=\"290\" font-size=\"12\" fill=\"#0F6E56\">所有值都 ≤ 1，不会因大正 Logit 上溢</text><rect x=\"40\" y=\"320\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"60\" y=\"342\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">5. Sum</text><text x=\"200\" y=\"342\" font-size=\"12\" fill=\"#0F6E56\">s0 = 1+0.367879+0.135335+0.606531 = 2.109745</text><rect x=\"40\" y=\"382\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"60\" y=\"404\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">6. LogSumExp</text><text x=\"200\" y=\"404\" font-size=\"12\" fill=\"#5F5E5A\">1 + log(2.109745) = 1 + 0.746567 = 1.746567</text><rect x=\"40\" y=\"444\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"60\" y=\"465\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\">7–8. Loss</text><text x=\"200\" y=\"465\" font-size=\"12\" fill=\"#A32D2D\">loss0 = 1.746567 − target_logit 1 = 0.746567</text><text x=\"200\" y=\"484\" font-size=\"12\" fill=\"#A32D2D\">等价：P(target)=1/2.109745=0.473991，−log(P)=0.746567</text></g></svg>"}, {"title": "Token 0 完整数值链路", "type": "formula", "body": "Token0: z0=[1,0,−1,0.5], y0=0。m0=1；shift=[0,−1,−2,−0.5]；exp=[1,0.367879441171,0.135335283237,0.606530659713]；s0=2.109745384121；log(s0)=0.746567269174；LSE=1.746567269174；target_logit=1；loss0=0.746567269174。等价目标概率P0[0]=1/s0=0.473990846254，−log(P0[0])同样为0.746567269174。"}, {"title": "Shape 与显存含义", "type": "text", "body": "Z[N,V]沿V轴reduce得到m[N]、s[N]、logsumexp[N]；gather目标Logit得到target_logit[N]；per-token loss为[N]，再执行mean/sum reduction。Forward长期核心统计只需m、s、target_logit各[N]，这是Fused/Chunked CE避免完整[N,V] Logits驻留的基础。"}, {"title": "常见误区", "type": "text", "body": "s_n不是原始Softmax分母，原始分母=exp(m_n)×s_n；logsumexp不是log(s_n)，必须加回m_n；loss0恰好等于log(s0)只因为本例目标Logit等于最大Logit，一般loss_n=log(s_n)−(target_logit−m_n)。"}]}}, {"id": "Cross Entropy", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Softmax Cross Entropy", "交叉熵"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "对每个Token，loss=logsumexp(logits)−target_logit；稳定实现先减全局最大值。"}, {"title": "机制与公式", "type": "formula", "body": "dZ=(softmax(Z)−OneHot(target))/N；每行dZ和为0。"}, {"title": "工程边界", "type": "text", "body": "所有词表类别都参与分母，但无需把全部Logits长期写入全局显存。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "Stable CE 四个公式逐项推导", "type": "formula", "body": "对Token n：m_n=max_v Z[n,v]；s_n=Σ_v exp(Z[n,v]−m_n)；logsumexp_n=m_n+log(s_n)；loss_n=logsumexp_n−Z[n,y_n]。代数来源：Σexp(Z)=exp(m)Σexp(Z−m)，所以log(Σexp(Z))=m+log(s)。减最大值使所有指数输入≤0，exp值≤1，而Softmax概率不变。"}, {"title": "Token 0 八步数值图", "type": "svg", "body": "<svg viewBox=\"0 0 680 520\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Token 0 Stable Softmax Cross Entropy 完整数值流程</title><desc>从四个Logits开始，依次计算最大值、平移Logits、指数、SumExp、LogSumExp、目标Logit和最终Loss。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Token 0：Stable Cross Entropy 的 8 个数值步骤</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"56\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"60\" y=\"77\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">1. Logits</text><text x=\"200\" y=\"77\" font-size=\"12\" fill=\"#185FA5\">z0 = [1, 0, −1, 0.5]，target id = 0</text><text x=\"200\" y=\"96\" font-size=\"12\" fill=\"#185FA5\">target logit = z0[0] = 1</text><rect x=\"40\" y=\"126\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"60\" y=\"148\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">2. Max</text><text x=\"200\" y=\"148\" font-size=\"12\" fill=\"#534AB7\">m0 = max(1,0,−1,0.5) = 1</text><rect x=\"40\" y=\"188\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"60\" y=\"210\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">3. Shift</text><text x=\"200\" y=\"210\" font-size=\"12\" fill=\"#534AB7\">z0−m0 = [0,−1,−2,−0.5]</text><rect x=\"40\" y=\"250\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"60\" y=\"271\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">4. Exp</text><text x=\"200\" y=\"271\" font-size=\"12\" fill=\"#0F6E56\">[1, 0.367879, 0.135335, 0.606531]</text><text x=\"200\" y=\"290\" font-size=\"12\" fill=\"#0F6E56\">所有值都 ≤ 1，不会因大正 Logit 上溢</text><rect x=\"40\" y=\"320\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"60\" y=\"342\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">5. Sum</text><text x=\"200\" y=\"342\" font-size=\"12\" fill=\"#0F6E56\">s0 = 1+0.367879+0.135335+0.606531 = 2.109745</text><rect x=\"40\" y=\"382\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"60\" y=\"404\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">6. LogSumExp</text><text x=\"200\" y=\"404\" font-size=\"12\" fill=\"#5F5E5A\">1 + log(2.109745) = 1 + 0.746567 = 1.746567</text><rect x=\"40\" y=\"444\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"60\" y=\"465\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\">7–8. Loss</text><text x=\"200\" y=\"465\" font-size=\"12\" fill=\"#A32D2D\">loss0 = 1.746567 − target_logit 1 = 0.746567</text><text x=\"200\" y=\"484\" font-size=\"12\" fill=\"#A32D2D\">等价：P(target)=1/2.109745=0.473991，−log(P)=0.746567</text></g></svg>"}, {"title": "Token 0 完整数值链路", "type": "formula", "body": "Token0: z0=[1,0,−1,0.5], y0=0。m0=1；shift=[0,−1,−2,−0.5]；exp=[1,0.367879441171,0.135335283237,0.606530659713]；s0=2.109745384121；log(s0)=0.746567269174；LSE=1.746567269174；target_logit=1；loss0=0.746567269174。等价目标概率P0[0]=1/s0=0.473990846254，−log(P0[0])同样为0.746567269174。"}, {"title": "Shape 与显存含义", "type": "text", "body": "Z[N,V]沿V轴reduce得到m[N]、s[N]、logsumexp[N]；gather目标Logit得到target_logit[N]；per-token loss为[N]，再执行mean/sum reduction。Forward长期核心统计只需m、s、target_logit各[N]，这是Fused/Chunked CE避免完整[N,V] Logits驻留的基础。"}, {"title": "常见误区", "type": "text", "body": "s_n不是原始Softmax分母，原始分母=exp(m_n)×s_n；logsumexp不是log(s_n)，必须加回m_n；loss0恰好等于log(s0)只因为本例目标Logit等于最大Logit，一般loss_n=log(s_n)−(target_logit−m_n)。"}]}}, {"id": "Weight Tying", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Tied Embedding", "Embedding-LM Head Weight Sharing"], "group": "architecture", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "输入Embedding与LM Head共享同一个[V,H]参数，减少参数、梯度和优化器状态副本。"}, {"title": "机制与公式", "type": "formula", "body": "dW_total=dW_lm_head+dW_embedding；LM Head梯度通常Dense，Embedding Lookup直接梯度通常只命中出现的Token行。"}, {"title": "工程边界", "type": "text", "body": "不减少[N,V] Logits动态显存；分布式分片必须保持输入/输出两条路径的一致布局。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "常见误区", "type": "text", "body": "不能只看Python变量生命周期或算子名称判断峰值；需要检查Autograd Saved Tensor、Buffer复用、分布式Gather和Kernel Workspace。"}]}}, {"id": "Vocab Parallel Cross Entropy", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Vocabulary Parallel CE", "Vocab Parallel LM Head"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "沿Vocabulary维将W和Logits切到TP Ranks，每Rank处理[V/P,H]权重和[N,V/P]本地Logits。"}, {"title": "机制与公式", "type": "formula", "body": "Forward依次AllReduce global max、target logit和sum-exp；Backward本地dZ/dW，dX局部贡献需SUM AllReduce或ReduceScatter。"}, {"title": "工程边界", "type": "text", "body": "避免AllGather完整词表Logits是显存收益的关键；通信和最慢Rank同步可能成为瓶颈。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "常见误区", "type": "text", "body": "不能只看Python变量生命周期或算子名称判断峰值；需要检查Autograd Saved Tensor、Buffer复用、分布式Gather和Kernel Workspace。"}]}}, {"id": "Fused Linear Cross Entropy", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Fused Linear CE", "Chunked Linear Cross Entropy"], "group": "kernel", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "融合Vocabulary Projection与Cross Entropy，按Token/Vocab Tile计算并即时消费Logits，不在Autograd图中长期保存完整[N,V]。"}, {"title": "机制与公式", "type": "formula", "body": "Forward保存per-token max/sum-exp/target；Backward重算Logits Tile，恢复softmax，生成dZ Tile并累计dH和dW。"}, {"title": "工程边界", "type": "text", "body": "典型主GEMM上界从6NHV增加到8NHV；Chunk太小会增加Launch并降低Tensor Core利用率。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "常见误区", "type": "text", "body": "不能只看Python变量生命周期或算子名称判断峰值；需要检查Autograd Saved Tensor、Buffer复用、分布式Gather和Kernel Workspace。"}]}}, {"id": "Cut Cross Entropy", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["CCE", "Cut Your Losses"], "group": "kernel", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "CCE用定制Kernel在Tile/片上存储中完成dot-product与logsumexp，只显式关注target logit，避免全局物化Logit矩阵。"}, {"title": "机制与公式", "type": "formula", "body": "Loss保持标准Cross Entropy语义；实现可利用低于数值精度的Softmax梯度项进行过滤以提高Backward吞吐。"}, {"title": "工程边界", "type": "text", "body": "公开显存收益是特定模型与实现结果；迁移时需验证dtype、词表、并行、mask和梯度一致性。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "常见误区", "type": "text", "body": "不能只看Python变量生命周期或算子名称判断峰值；需要检查Autograd Saved Tensor、Buffer复用、分布式Gather和Kernel Workspace。"}]}}, {"id": "Online Softmax", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Online LogSumExp", "在线Softmax"], "group": "kernel", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Online Softmax以running max和running sum-exp合并Vocabulary Chunks，精确得到全词表logsumexp。"}, {"title": "机制与公式", "type": "formula", "body": "m_new=max(m_old,m_chunk)；l_new=l_old×exp(m_old−m_new)+l_chunk×exp(m_chunk−m_new)。"}, {"title": "工程边界", "type": "text", "body": "是Vocab Chunk与分布式稳定Softmax的数学基础；Reduction应使用足够精度。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "Stable CE 四个公式逐项推导", "type": "formula", "body": "对Token n：m_n=max_v Z[n,v]；s_n=Σ_v exp(Z[n,v]−m_n)；logsumexp_n=m_n+log(s_n)；loss_n=logsumexp_n−Z[n,y_n]。代数来源：Σexp(Z)=exp(m)Σexp(Z−m)，所以log(Σexp(Z))=m+log(s)。减最大值使所有指数输入≤0，exp值≤1，而Softmax概率不变。"}, {"title": "Token 0 八步数值图", "type": "svg", "body": "<svg viewBox=\"0 0 680 520\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Token 0 Stable Softmax Cross Entropy 完整数值流程</title><desc>从四个Logits开始，依次计算最大值、平移Logits、指数、SumExp、LogSumExp、目标Logit和最终Loss。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Token 0：Stable Cross Entropy 的 8 个数值步骤</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"56\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"60\" y=\"77\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">1. Logits</text><text x=\"200\" y=\"77\" font-size=\"12\" fill=\"#185FA5\">z0 = [1, 0, −1, 0.5]，target id = 0</text><text x=\"200\" y=\"96\" font-size=\"12\" fill=\"#185FA5\">target logit = z0[0] = 1</text><rect x=\"40\" y=\"126\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"60\" y=\"148\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">2. Max</text><text x=\"200\" y=\"148\" font-size=\"12\" fill=\"#534AB7\">m0 = max(1,0,−1,0.5) = 1</text><rect x=\"40\" y=\"188\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"60\" y=\"210\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">3. Shift</text><text x=\"200\" y=\"210\" font-size=\"12\" fill=\"#534AB7\">z0−m0 = [0,−1,−2,−0.5]</text><rect x=\"40\" y=\"250\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"60\" y=\"271\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">4. Exp</text><text x=\"200\" y=\"271\" font-size=\"12\" fill=\"#0F6E56\">[1, 0.367879, 0.135335, 0.606531]</text><text x=\"200\" y=\"290\" font-size=\"12\" fill=\"#0F6E56\">所有值都 ≤ 1，不会因大正 Logit 上溢</text><rect x=\"40\" y=\"320\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"60\" y=\"342\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">5. Sum</text><text x=\"200\" y=\"342\" font-size=\"12\" fill=\"#0F6E56\">s0 = 1+0.367879+0.135335+0.606531 = 2.109745</text><rect x=\"40\" y=\"382\" width=\"600\" height=\"44\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"60\" y=\"404\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">6. LogSumExp</text><text x=\"200\" y=\"404\" font-size=\"12\" fill=\"#5F5E5A\">1 + log(2.109745) = 1 + 0.746567 = 1.746567</text><rect x=\"40\" y=\"444\" width=\"600\" height=\"52\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"60\" y=\"465\" font-size=\"13\" font-weight=\"500\" fill=\"#791F1F\">7–8. Loss</text><text x=\"200\" y=\"465\" font-size=\"12\" fill=\"#A32D2D\">loss0 = 1.746567 − target_logit 1 = 0.746567</text><text x=\"200\" y=\"484\" font-size=\"12\" fill=\"#A32D2D\">等价：P(target)=1/2.109745=0.473991，−log(P)=0.746567</text></g></svg>"}, {"title": "Token 0 完整数值链路", "type": "formula", "body": "Token0: z0=[1,0,−1,0.5], y0=0。m0=1；shift=[0,−1,−2,−0.5]；exp=[1,0.367879441171,0.135335283237,0.606530659713]；s0=2.109745384121；log(s0)=0.746567269174；LSE=1.746567269174；target_logit=1；loss0=0.746567269174。等价目标概率P0[0]=1/s0=0.473990846254，−log(P0[0])同样为0.746567269174。"}, {"title": "Shape 与显存含义", "type": "text", "body": "Z[N,V]沿V轴reduce得到m[N]、s[N]、logsumexp[N]；gather目标Logit得到target_logit[N]；per-token loss为[N]，再执行mean/sum reduction。Forward长期核心统计只需m、s、target_logit各[N]，这是Fused/Chunked CE避免完整[N,V] Logits驻留的基础。"}, {"title": "常见误区", "type": "text", "body": "s_n不是原始Softmax分母，原始分母=exp(m_n)×s_n；logsumexp不是log(s_n)，必须加回m_n；loss0恰好等于log(s0)只因为本例目标Logit等于最大Logit，一般loss_n=log(s_n)−(target_logit−m_n)。"}]}}, {"id": "LM Head Memory", "mastery": 1, "needs_review": false, "next_review": "2026-08-28", "aliases": ["Logits Memory", "LM Head显存"], "group": "memory", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "LM Head动态显存核心按N×V增长，而最后层Hidden按N×H增长；当V≫H时Logits可远大于Hidden。"}, {"title": "机制与公式", "type": "formula", "body": "Logits bytes=N×V×dtype；W bytes=V×H×param_dtype；标准显式Backward还可能出现同Shape dLogits和CE保存量。"}, {"title": "工程边界", "type": "text", "body": "必须区分allocated、reserved、workspace和fragmentation，并通过Memory Snapshot确认真实生命周期。"}, {"title": "统一量级", "type": "formula", "body": "默认分析符号：N为有效投影Token数，H为Hidden Size，V为Vocabulary，P为TP。Projection=2NHV FLOPs；完整Logits=N×V×dtype_bytes。"}, {"title": "常见误区", "type": "text", "body": "不能只看Python变量生命周期或算子名称判断峰值；需要检查Autograd Saved Tensor、Buffer复用、分布式Gather和Kernel Workspace。"}]}}, {"id": "DeepSeek Sparse Attention", "mastery": 1, "needs_review": false, "next_review": "2026-11-04", "aliases": ["DSA"], "group": "architecture", "content": {"sections": [{"title": "1. 先给结论与版本边界", "type": "text", "body": "这里的 DSA 指 **DeepSeek Sparse Attention**，以 DeepSeek-V3.2-Exp 原始技术报告和官方参考实现为依据，不把所有 Dynamic Sparse Attention 都视为同一算法，也不把 NSA 当成 DSA。\n\n一句话：**每个 Query 先让一个低成本的 Lightning Indexer 为历史 Token 打分，选出 Top-k 个位置；昂贵的主 Attention 只在这些位置上计算，并在选中的集合内重新做 Softmax。Indexer 用注意力分布蒸馏来训练，主模型用语言建模 Loss 训练。**\n\n关键不是“算完完整主注意力再把小值清零”，而是把“挑选位置”和“精算注意力”分开。主 Attention 交互量约为 O(Sk)，但原始 Indexer 仍有 O(S²) 扫描，不能声称整个 DSA 严格线性。\n\n本课讲清算法、训练和系统代价；小例子用标准 Q/K/V 展示链式法则，不冒充完整 MLA 或 FP8 生产内核。原始报告的配方是从稠密检查点继续训练，不是已经证明任意模型从零稀疏训练都可直接套用。"}, {"title": "2. 为什么要稀疏：昂贵的是什么", "type": "text", "body": "标准 Causal Attention 对第 t 个 Query 访问所有允许的 Key，下面采用从 0 开始的位置编号："}, {"title": "2. 为什么要稀疏：昂贵的是什么", "type": "formula", "body": "可见集合 C_t = {0,1,...,t}\nz[t,s,h] = dot(Q[t,h], K[s,h]) / sqrt(d_qk)\nA[t,:,h] = softmax(z[t,:,h])\nO[t,h] = Σ_s A[t,s,h] V[s,h]"}, {"title": "2. 为什么要稀疏：昂贵的是什么", "type": "text", "body": "B 为 Batch、S 为序列长度、H_a 为主 Query 头数、d_qk/d_v 为主 QK/Value 维度。普通多头逻辑 shape 为 Q/K:[B,S,H_a,d_qk]、V/O:[B,S,H_a,d_v]。\n\n整段因果序列有 S(S+1)/2 个 Query-Key 对。FlashAttention 通过分块和在线 Softmax 避免保存整个注意力矩阵，但仍计算所有允许的对；DSA 则改变允许参与主注意力的集合，减少实际交互。\n\n这两者解决不同问题：FlashAttention 主要优化 IO 和中间存储；DSA 同时引入选择算法和模型训练适配。可以用 Flash 风格内核执行稀疏注意力。"}, {"title": "3. DSA 的两条计算路径", "type": "formula", "body": "Hidden States\n  ├─ Indexer：小 Query/Key → 索引分数 I[t,s] → Top-k 位置 S_t\n  └─ 主 Attention：主 Q/K/V 或 MLA latent → 只访问 S_t → 输出 O"}, {"title": "3. DSA 的两条计算路径", "type": "text", "body": "同一个 Query 的索引集合通常供该层多个主 Attention Heads 共享；各主头仍然计算自己的注意力权重。**共享选中的位置，不等于共享最终概率，也不等于 Indexer 只有一个头。**"}, {"title": "3. DSA 的两条计算路径", "type": "svg", "body": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 360\" width=\"100%\" role=\"img\"><title>DSA 双路径：Indexer 选择位置，主注意力精算</title><desc>索引器产生共享Top-k位置，主注意力使用自己的QK分数；Indexer由KL训练，主模型由LM Loss训练。</desc><defs><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs><g font-family=\"sans-serif\" font-size=\"13\" fill=\"#0C447C\"><rect x=\"40\" y=\"40\" width=\"130\" height=\"64\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\".5\"/><text x=\"105\" y=\"67\" text-anchor=\"middle\">Hidden states</text><text x=\"105\" y=\"88\" text-anchor=\"middle\">[B,S,D]</text><rect x=\"240\" y=\"40\" width=\"160\" height=\"64\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\".5\"/><text x=\"320\" y=\"66\" text-anchor=\"middle\">Lightning Indexer</text><text x=\"320\" y=\"88\" text-anchor=\"middle\">小维度、FP8 路径</text><rect x=\"470\" y=\"40\" width=\"170\" height=\"64\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\".5\"/><text x=\"555\" y=\"66\" text-anchor=\"middle\">Top-k 位置 S_t</text><text x=\"555\" y=\"88\" text-anchor=\"middle\">多个主头共享</text><rect x=\"240\" y=\"175\" width=\"160\" height=\"64\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\".5\"/><text x=\"320\" y=\"201\" text-anchor=\"middle\" fill=\"#085041\">主 Q/K/V 或 MLA</text><text x=\"320\" y=\"223\" text-anchor=\"middle\" fill=\"#085041\">不是 Indexer Q/K</text><rect x=\"470\" y=\"175\" width=\"170\" height=\"64\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\".5\"/><text x=\"555\" y=\"201\" text-anchor=\"middle\" fill=\"#085041\">Sparse attention</text><text x=\"555\" y=\"223\" text-anchor=\"middle\" fill=\"#085041\">只在 S_t 内归一化</text></g><g stroke=\"#185FA5\" stroke-width=\"1.2\" fill=\"none\" marker-end=\"url(#arr)\"><path d=\"M170 72H235\"/><path d=\"M400 72H465\"/><path d=\"M105 104V207H235\"/><path d=\"M555 104V170\"/><path d=\"M400 207H465\"/></g><text x=\"40\" y=\"285\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#0C447C\">训练 Indexer：KL 蒸馏；离散 Top-k 的索引不提供普通可导梯度</text><text x=\"40\" y=\"315\" font-family=\"sans-serif\" font-size=\"13\" fill=\"#085041\">训练主模型：LM Loss → 稀疏 Attention → 被选 Q/K/V 的梯度</text></svg>"}, {"title": "4. Lightning Indexer 公式逐项解释", "type": "text", "body": "原始报告的核心公式："}, {"title": "4. Lightning Indexer 公式逐项解释", "type": "formula", "body": "I[t,s] = Σ_{j=1..H_i} wI[t,j] × ReLU(dot(qI[t,j], kI[s]))"}, {"title": "4. Lightning Indexer 公式逐项解释", "type": "text", "body": "变量与逻辑 shape："}, {"title": "4. Lightning Indexer 公式逐项解释", "type": "formula", "body": "| 张量 | Shape | 职责 |\n|---|---|---|\n| Hidden x | [B,S,D] | 主模型输入表示 |\n| Indexer Query qI | [B,S,H_i,d_i] | 每 Query 多个检索方向 |\n| Indexer Key kI | [B,S,d_i] | 每历史 Token 一份共享索引表示 |\n| Query-dependent weights wI | [B,S,H_i] | 合并多个索引头的分数 |\n| 索引分数 I | [B,S,S]，逻辑 shape | 每对 Query-Key 一个选择分数 |\n| 索引列表 indices | [B,S,k]，尾部可 Padding | 被选位置，不带主头维度 |"}, {"title": "4. Lightning Indexer 公式逐项解释", "type": "text", "body": "qI/kI 不是主 Attention 的 Q/K。报告用 Hidden 派生描述其来源；官方实现中 qI 复用 MLA 的低秩 Query 中间表示作为投影输入，kI 从 Hidden 投影并归一化，再做部分 RoPE 等处理。\n\n一次索引打分包含三步：\n\n1. 各索引头做 dot(qI,kI)，看候选 Key 是否与该检索方向相关。\n2. 每个头的点积先经过 ReLU，再跨头加权求和。**ReLU 必须在跨头聚合之前**。\n3. 得到一个标量 I[t,s]，用于候选位置的排序，而不是直接当主 Attention 概率。\n\nwI 是学习出来的线性权重，不能默认它是 Softmax 概率，也不能默认所有权重非负。原始公式中的分数不需要加和为 1。Index head scaling、量化 scale 等需以实际实现为准，教学公式省略这些可吸收缩放，不省略 ReLU。\n\n官方 V3.2-Exp 配置示例：H_i=64、d_i=128、k=2048；主 Query 头数为128，MLA KV latent rank为512。这些是一个模型配方，不是 DSA 定义要求的常数。“轻量”是相对昂贵的主 MLA 计算及低精度实现而言，不代表 Indexer FLOPs 为零。"}, {"title": "5. Top-k：先满足语义，再挑重要位置", "type": "formula", "body": "C_t = 同一个样本/segment 内、满足 causal 和自定义 mask 的可见位置\nS_t = TopK(I[t,s], s∈C_t), 取 min(k, |C_t|) 个有效位置"}, {"title": "5. Top-k：先满足语义，再挑重要位置", "type": "text", "body": "未来 Token、Padding、跨 Packed Sequence 的位置必须在选择时屏蔽；主稀疏内核也要验证有效位置。不能先 Top-k 再只看“索引看起来在范围内”。\n\n有一个很容易忽略的边界：早期 Query 的有效历史少于 k。若矩形 topk 固定返回 k 个索引，它可能把分数为负无穷的未来位置也作为占位补足数量。因此“Top-k 前 Mask”不意味着返回数组里永远没有无效占位，消费者必须使用有效长度或再次 Mask，不能给占位项分配概率。\n\n相同分数的 tie-breaking 也需要考虑多 Rank 一致性。Top-k 可能保留自身，但“必须保留自身”“必须保留滑窗”不是原始 DSA 核心公式天然保证的规则，若要强制加入必须明确这是额外策略。"}, {"title": "6. 选好以后：重新算主 Attention，不使用 Indexer 概率", "type": "text", "body": "对主头 h："}, {"title": "6. 选好以后：重新算主 Attention，不使用 Indexer 概率", "type": "formula", "body": "z[t,h,s] = dot(Q[t,h], K[s,h]) / sqrt(d_qk), s∈S_t\nA[t,h,s] = exp(z[t,h,s]) / Σ_{r∈S_t} exp(z[t,h,r])\nO[t,h]   = Σ_{s∈S_t} A[t,h,s] × V[s,h]"}, {"title": "6. 选好以后：重新算主 Attention，不使用 Indexer 概率", "type": "text", "body": "非选中位置在这次主 Attention 中为0。分母也只在 S_t 内计算。\n\n所以稀疏结果一般不等于 Dense 结果：不只是把 Dense 概率中的小项清零，而是删掉一批项后重新归一化。即使保存大部分 Dense 概率质量，输出也有误差，尤其当被漏掉的 Value 很大或携带关键事实时。训练用于适应这种改变，不是证明两种 Attention 数学等价。"}, {"title": "7. 与 MLA 的关系：压缩存储和选择访问是两件事", "type": "text", "body": "MLA 用压缩 KV latent 表示历史 Token；DSA 决定当前 Query 读哪些 Token 的 latent。前者主要改变 KV 表示/缓存成本，后者改变访问集合。\n\nDSA 原始报告在 MLA 的 MQA 计算模式下实现：被选 KV latent 能在同一 Query 的多个 Query Heads 间复用。MLA 的权重吸收把部分投影移到 Query/输出侧，使稀疏核心可以操作共享 latent；这并不意味着主头输出完全相同。\n\n注意两层区别：\n\n- 数学教学用普通 Q/K/V 表示 sparse attention，便于推导。\n- 生产 MLA 的 absorbed/unabsorbed 路径维度和 FLOPs 不同，不能直接把普通 MHA 的 d_qk/d_v 代入宣称是精确 MLA FLOPs。\n\n同样，**只读 k 个 KV，不等于只需要缓存 k 个历史 Token**。下一 Query 可能选择不同历史位置，通常仍需保留整个历史的 KV latent 和额外 Indexer Key。DSA 减少本次读算集合，不自动构成全局 KV 淘汰算法。"}, {"title": "8. 一个可手算的完整例子", "type": "text", "body": "只展示最后一个 Query：B=1，S=4，t=3，允许看位置0、1、2、3；k=2。Indexer 有2个头，每头维度2。以下向量视为已完成各自投影/位置处理后的值，省略量化。"}, {"title": "8.1 Indexer 如何选出两个位置", "type": "formula", "body": "qI[3,0] = [1,0]\nqI[3,1] = [0,1]\nwI[3,:] = [1,0.5]"}, {"title": "8.1 Indexer 如何选出两个位置", "type": "formula", "body": "| Key位置 s | kI[s] | 头0 dot 后 ReLU | 头1 dot 后 ReLU | I[3,s] |\n|---|---|---|---|---|\n| 0 | [2,0] | 2 | 0 | 1×2+0.5×0=2 |\n| 1 | [0,2] | 0 | 2 | 1×0+0.5×2=1 |\n| 2 | [−1,−1] | 0 | 0 | 0 |\n| 3 | [1,1] | 1 | 1 | 1×1+0.5×1=1.5 |"}, {"title": "8.1 Indexer 如何选出两个位置", "type": "formula", "body": "I[3,:] = [2,1,0,1.5]\nTop-2 位置 S_3 = {0,3}"}, {"title": "8.1 Indexer 如何选出两个位置", "type": "text", "body": "注意位置1也有一定相关性，但预算k=2，只保留排名前两项。主 Attention 尚未计算。"}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "text", "body": "为便于手算，主 Attention 只有1个头，d_qk=d_v=2："}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "formula", "body": "Q[3] = [1,0]\nK = [[1,0], [0,1], [−1,0], [0.5,0.5]]   shape [4,2]\nV = [[1,0], [0,1], [ 2,2], [1,1]]        shape [4,2]"}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "text", "body": "选中 K/V："}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "formula", "body": "K_selected = [[1,0], [0.5,0.5]]  shape [2,2]\nV_selected = [[1,0], [1,1]]      shape [2,2]"}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "text", "body": "主分数为："}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "formula", "body": "z[3,0] = dot([1,0],[1,0]) / sqrt(2) = 0.707106781\nz[3,3] = dot([1,0],[0.5,0.5]) / sqrt(2) = 0.353553391"}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "text", "body": "稳定 Softmax：减去最大值0.707106781，得到[0,−0.353553391]，指数约[1,0.702188501]，和约1.702188501。"}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "formula", "body": "A_selected = [0.587479001, 0.412520999]   shape [2]\nO[3] = 0.587479001×[1,0] + 0.412520999×[1,1]\n     = [1,0.412520999]                    shape [2]"}, {"title": "8.2 主 Attention 自己的 Q/K/V", "type": "text", "body": "这里用了两套分数：Indexer 的[2,1.5]只管选人，主分数[0.707107,0.353553]负责如何加权。"}, {"title": "8.3 与 Dense 对比", "type": "text", "body": "若主 Attention 访问全部4个位置："}, {"title": "8.3 与 Dense 对比", "type": "formula", "body": "z_dense = [0.707107,0,−0.707107,0.353553]\nA_dense ≈ [0.410109372,0.202212091,0.099704451,0.287974085]\nO_dense ≈ [0.897492360,0.689595079]"}, {"title": "8.3 与 Dense 对比", "type": "text", "body": "稀疏输出[1,0.412521]不同于稠密输出。选择器留下的 Dense 注意力质量约为0.410109372+0.287974085=0.698083457；归一化这两项就得到本例的稀疏权重。**选得准是质量目标，不是恒等变换。**"}, {"title": "8.3 与 Dense 对比", "type": "svg", "body": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 680 270\" width=\"100%\" role=\"img\"><title>四个候选中选位置0和3</title><desc>索引得分排序选择位置，主Attention重新计算概率，两套分数不能混用。</desc><g font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\"><text x=\"340\" y=\"32\" fill=\"#0C447C\">t=3，k=2：选位置 ≠ 算最终权重</text><g fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\".5\"><rect x=\"40\" y=\"60\" width=\"132\" height=\"92\" rx=\"8\"/><rect x=\"196\" y=\"60\" width=\"132\" height=\"92\" rx=\"8\"/><rect x=\"352\" y=\"60\" width=\"132\" height=\"92\" rx=\"8\"/><rect x=\"508\" y=\"60\" width=\"132\" height=\"92\" rx=\"8\"/></g><g fill=\"#0C447C\"><text x=\"106\" y=\"85\">位置0：I=2</text><text x=\"262\" y=\"85\">位置1：I=1</text><text x=\"418\" y=\"85\">位置2：I=0</text><text x=\"574\" y=\"85\">位置3：I=1.5</text><text x=\"106\" y=\"116\">选中</text><text x=\"262\" y=\"116\">未选</text><text x=\"418\" y=\"116\">未选</text><text x=\"574\" y=\"116\">选中</text></g><rect x=\"40\" y=\"180\" width=\"600\" height=\"65\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\".5\"/><text x=\"340\" y=\"205\" fill=\"#085041\">主 Softmax：位置0权重0.587479，位置3权重0.412521</text><text x=\"340\" y=\"228\" fill=\"#085041\">输出 = 0.587479×[1,0] + 0.412521×[1,1] = [1,0.412521]</text></g></svg>"}, {"title": "9. 训练的难点：Top-k 不可导怎么办", "type": "text", "body": "Top-k 返回整数位置。对固定排序的一小段连续参数变化，索引不变；越过排序边界时索引跳变。它不提供让 LM Loss 平滑告诉 Indexer“换成哪个 Token”的普通梯度。\n\n不要把 Top-k 的浮点 values 与 indices 混为一谈：values 可以对选中的元素传播梯度，但用 indices 去 Gather 主 KV，不会自动把语言建模梯度传回产生这些索引的 Indexer 分数。\n\n原始 DSA 不依赖“穿过整数索引反传”，而是采用独立蒸馏目标。"}, {"title": "9.1 Dense warm-up：先训练选择器，再真正删边", "type": "text", "body": "从已训练好的 Dense 模型开始：主模型冻结、Attention 保持 Dense，只训练新 Indexer。\n\n以主 Attention 的非负归一化权重作为教师信号，跨主头相加后沿可见位置 L1 归一化："}, {"title": "9.1 Dense warm-up：先训练选择器，再真正删边", "type": "formula", "body": "p[t,s] = Σ_h A_main[t,h,s] / Σ_r Σ_h A_main[t,h,r]\nrho[t,:] = softmax(I[t,:])\nL_index = Σ_t KL(stop_gradient(p[t,:]) || rho[t,:])\nKL(p||rho) = Σ_s p_s × (log p_s − log rho_s)"}, {"title": "9.1 Dense warm-up：先训练选择器，再真正删边", "type": "text", "body": "没有 dropout 干扰且各头行和均为1时，p就是各头 Attention Probability 的平均；不是把可正可负的原始 QK Logits 当成概率相加。\n\n目的：让 Indexer 在不破坏主模型的条件下学会模仿“主 Attention 平时看哪里”。如果直接让随机 Indexer 挑k个位置，主模型可能突然看不到关键上下文。"}, {"title": "9.2 Sparse training：打开选择，继续训练主模型", "type": "text", "body": "启用 S_t 后，主 Attention 只访问被选集合。Index Loss 也在被选集合上计算："}, {"title": "9.2 Sparse training：打开选择，继续训练主模型", "type": "formula", "body": "p_selected = 主稀疏 Attention 在 S_t 上跨头聚合后的归一化分布\nrho_selected = softmax(I[t,S_t])\nL_index = Σ_t KL(stop_gradient(p_selected) || rho_selected)"}, {"title": "9.2 Sparse training：打开选择，继续训练主模型", "type": "text", "body": "这里教师来自当前主稀疏 Attention，不需要每步额外算一次完整 Dense Teacher。若用截取 Dense 分布做其他实验，必须重新归一化后才是合法概率分布，不能把和小于1的截断向量直接冒充此目标。\n\n梯度路径严格分离："}, {"title": "9.2 Sparse training：打开选择，继续训练主模型", "type": "formula", "body": "Indexer 输入使用 detach：L_index 不回传到主干 Hidden / 主 Query latent\n教师分布使用 stop_gradient：L_index 不通过教师回传主 Attention\nL_LM 训练主干及主 Attention\nL_index 训练 Indexer 参数"}, {"title": "9.2 Sparse training：打开选择，继续训练主模型", "type": "text", "body": "“所有参数都训练”表示两个子系统都在更新，不表示两个 Loss 任意流向所有参数，也不表示使用 Straight-Through 或可导 Top-k。"}, {"title": "9.3 原始报告的具体训练配方", "type": "formula", "body": "| 阶段 | 主 Attention | 更新哪些参数 | 原始报告配置 |\n|---|---|---|---|\n| Dense warm-up | Dense | 仅 Indexer | 1000 steps，16×128K tokens/step，LR 1e−3，约2.1B tokens |\n| Sparse continued training | Top-2048 | 主模型与Indexer，各自Loss | 15000 steps，480×128K tokens/step，LR 7.3e−6，约943.7B tokens |"}, {"title": "9.3 原始报告的具体训练配方", "type": "text", "body": "这些数字说明稀疏化需要训练投入，不是插入一个Mask就结束；不要把这张表照抄为你当前模型的默认超参数。"}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "text", "body": "继续使用 S_3={0,3}、I_selected=[2,1.5]。"}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "formula", "body": "rho_selected = softmax([2,1.5]) = [0.622459331,0.377540669]\np_selected   = [0.587479001,0.412520999]\nL_index      = KL(p_selected || rho_selected) ≈ 0.002574509"}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "text", "body": "对 Indexer logits 的局部梯度："}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "formula", "body": "dL_index/dI_selected = rho_selected − p_selected\n                    = [+0.034980330,−0.034980330]"}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "text", "body": "梯度下降会降低位置0索引分数、提高位置3索引分数，让两者比例接近教师。\n\n进一步，令 r_j=dot(qI_j,kI_s)，则局部反向是："}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "formula", "body": "dwI_j += dI_s × ReLU(r_j)\ndqI_j += dI_s × wI_j × 1[r_j>0] × kI_s\ndkI_s += Σ_j dI_s × wI_j × 1[r_j>0] × qI_j"}, {"title": "10. 用小例子算 Indexer 的学习信号", "type": "text", "body": "ReLU 在0点按实现选择次梯度，本课取0。仅KL选中集合时，未选分数没有这一次直接KL梯度；共享投影参数仍因其他 Query/位置的梯度而变化。由此也能理解 Dense warm-up 的重要性和后续可能出现的选择盲区。"}, {"title": "11. 主稀疏 Attention 怎样反向", "type": "text", "body": "把本次 Top-k 索引视为固定结构，对选中边执行正常 Attention Backward。"}, {"title": "11. 主稀疏 Attention 怎样反向", "type": "formula", "body": "dV_s += A_s × dO\ndA_s = dot(dO, V_s)\ndz_s = A_s × (dA_s − Σ_r A_r dA_r)\ndQ += Σ_s dz_s K_s / sqrt(d_qk)\ndK_s += dz_s Q / sqrt(d_qk)"}, {"title": "11. 主稀疏 Attention 怎样反向", "type": "text", "body": "每个 Query 的局部未选边梯度为0，但未选 Token 并不是整个模型梯度为0：它可能被其他 Query 选中，也可能经残差、MLP 等路径贡献梯度。\n\n数值检验：为本例设一个局部测试目标 L_probe=O[0]+2O[1]，所以dO=[1,2]。这是用于检查链式法则的标量，不是实际语言建模 Loss。"}, {"title": "11. 主稀疏 Attention 怎样反向", "type": "formula", "body": "a = 0.587479001, b = 0.412520999\ndA_selected = [1,3]\ndz_selected = [−0.484694849,+0.484694849]\ndV0 = [0.587479001,1.174958002]\ndV3 = [0.412520999,0.825041998]\ndQ  = [−0.171365507,+0.171365507]\ndK0 = [−0.342731014,0]\ndK3 = [+0.342731014,0]"}, {"title": "11. 主稀疏 Attention 怎样反向", "type": "text", "body": "多个 Query 可能同时选择同一个 Key，dK/dV 必须累加：生产 Kernel 的 Scatter、Atomic、归约顺序会影响速度、确定性和低精度误差。固定索引的有限差分可以检查主反向，但不能据此证明索引选择本身可导。"}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "text", "body": "以下是普通多头逻辑 Attention 的主点积/加权求和模型，FMA计2 FLOPs。忽略投影、RoPE、归约、Top-k、量化开销；生产MLA要按实际kernel维度重新核算。"}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "formula", "body": "E_dense = S(S+1)/2\nE_sparse = Σ_{t=0..S−1} min(k,t+1)\n         = k(k+1)/2 + (S−k)k，假设 S≥k\n\nF_main_dense ≈ 2 B H_a (d_qk+d_v) E_dense\nF_main_sparse ≈ 2 B H_a (d_qk+d_v) E_sparse\nF_index_dot ≈ 2 B H_i d_i E_dense"}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "text", "body": "因此总的核心前向预算："}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "formula", "body": "F_DSA ≈ F_main_sparse + F_index_dot + 投影/Top-k/归约/搬运"}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "text", "body": "当S不断增大而k固定，主注意力项近线性增长，Indexer点积仍二次增长。实现也可能计算矩形tile再mask，实际执行FLOPs高于有效因果边口径。\n\n对 S=131072、k=2048："}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "formula", "body": "最后一个 Query：131072/2048 = 64 倍交互缩减\n整个因果序列：\nE_dense = 8,590,000,128\nE_sparse = 266,339,328\nE_dense/E_sparse ≈ 32.2521"}, {"title": "12. FLOPs：不能把 Indexer 从账本里删掉", "type": "text", "body": "所以“64倍”只对应最后一行或非因果满矩形的简化比值，不是整段因果训练的主交互比，更不是端到端加速比。Indexer、投影、MLP/MoE、通信、选择和低效访存都需要时间。短上下文S≤k时主注意力没有删边，还多了Indexer开销。\n\n训练还增加主稀疏反向和Indexer反向；Warm-up仍跑Dense。不能直接拿推理成本曲线来宣称训练Step加速相同比例。"}, {"title": "13. 显存：稀疏也不能随意物化中间张量", "type": "text", "body": "关键张量口径："}, {"title": "13. 显存：稀疏也不能随意物化中间张量", "type": "formula", "body": "| 数据 | 逻辑 Shape | 注意事项 |\n|---|---|---|\n| Indexer Query | [B,S,H_i,d_i] | 可分块；训练保存量看实现 |\n| Indexer Key | [B,S,d_i] | 额外表示/推理缓存，FP8还含scale |\n| 全索引分数 | [B,S,S] | 只是逻辑shape，不应默认整块常驻 |\n| Top-k indices | [B,S,k] | int32/int64差2倍；可用变长格式 |\n| 主概率 | [B,H_a,S,k] | 不应默认完整物化，可Flash式分块 |\n| 主 KV | MLA latent 或实际 K/V | 未选不等于可全局删除 |"}, {"title": "13. 显存：稀疏也不能随意物化中间张量", "type": "text", "body": "B=1、S=131072时：完整FP32索引矩阵为S²×4=64GiB；按矩形[B,S,k]保存int32索引为1GiB，int64为2GiB。主稀疏概率若有128头且用BF16完整保存，也达到64GiB！\n\n因此性能内核需要分块生成分数、选择、Softmax和输出，控制临时张量的生命周期。仅把S²改成Sk并不能保证峰值小。对比FlashAttention时也不能把本来已经没有S²激活的Dense基线，误算为节省了一整个Dense概率矩阵。"}, {"title": "14. 为什么省 FLOPs 不一定提速", "type": "text", "body": "- **Indexer与Top-k**：比较选择未必能像大GEMM一样高效使用Tensor Core。\n- **非连续KV访问**：不同Query选择分散位置，Gather导致HBM/L2复用变差。\n- **共享与Tile大小**：多个Query heads复用同一KV有助于摊薄加载成本，但跨Query未必选中相同位置。\n- **反向热点**：热门Key被大量Query选中，dK/dV归约产生冲突与长尾。\n- **Context Parallel通信**：Key在别的Rank上时还要取分数/候选/数据；若沿用全量KV环传，算少了不代表通信少了。\n- **示例代码不等于高性能内核**：官方可读推理示例存在先计算Dense主scores再加选择Mask的路径，适合说明语义，不应当作O(Sk)训练kernel证据。\n\n对CP的一种可能设计是各Rank先在本地候选里选top-k，再合并得到全局top-k，随后访问对应KV；前提是跨Rank索引分数完整可比。若分数的索引头也被切分，必须先正确聚合头贡献。原始算法公式本身不替你完成这些分布式设计。"}, {"title": "15. 和常见方法的异同", "type": "formula", "body": "| 方法 | 如何决定访问位置 | 是否改变Dense Attention数学结果 | 主要特征 |\n|---|---|---|---|\n| FlashAttention | 所有mask允许位置 | 浮点容差内保持 | IO优化，不负责内容选择 |\n| Sliding Window | 固定邻近窗口 | 是 | 连续访存，可能漏远程信息 |\n| 固定Block Sparse | 预设或分块布局 | 通常是 | 硬件友好但选择粒度粗 |\n| DSA | 学习Indexer、逐Query Top-k | 是 | 内容感知、token级、需要训练 |\n| NSA | 压缩、选择、滑窗分支组合 | 是 | 不是DSA的别名，结构与训练方式不同 |\n| MLA | 压缩KV表示及投影重参数化 | 与所用模型定义有关 | 不等于稀疏，可作为DSA底座 |"}, {"title": "15. 和常见方法的异同", "type": "text", "body": "MoE路由选择的是“哪个Expert参数”；DSA选择的是“哪些历史Token”。二者都存在离散选择和负载问题，但DSA的KL教师是主Attention分布，不是MoE的负载均衡目标。"}, {"title": "16. 最小语义代码：观察选择、输出与两条Loss", "type": "text", "body": "下面仅处理一个Query、一个主头，与前面的数值一致。需要PyTorch；不包含MLA投影、RoPE、FP8、多Rank或高性能稀疏Kernel，不能拿它benchmark DSA性能。"}, {"title": "16. 最小语义代码：观察选择、输出与两条Loss", "type": "code", "body": "import torch\n\ndtype = torch.float64\nqI = torch.tensor([[1., 0.], [0., 1.]], dtype=dtype, requires_grad=True)\nkI = torch.tensor([[2., 0.], [0., 2.], [-1., -1.], [1., 1.]],\n                  dtype=dtype, requires_grad=True)\nwI = torch.tensor([1., 0.5], dtype=dtype, requires_grad=True)\nQ = torch.tensor([1., 0.], dtype=dtype, requires_grad=True)\nK = torch.tensor([[1., 0.], [0., 1.], [-1., 0.], [0.5, 0.5]],\n                 dtype=dtype, requires_grad=True)\nV = torch.tensor([[1., 0.], [0., 1.], [2., 2.], [1., 1.]],\n                 dtype=dtype, requires_grad=True)\n\nI = (torch.relu(qI @ kI.T) * wI[:, None]).sum(dim=0)  # [4]\nids = I.detach().topk(2).indices                    # [2] -> [0,3]\nz = (K[ids] @ Q) / (2.0 ** 0.5)                  # [2]\np_main = z.softmax(dim=0)\nout = p_main @ V[ids]                              # [2]\n\n# 稀疏训练阶段，教师仅在选中集合上，且停止教师梯度\nteacher = p_main.detach()\nlog_rho = I[ids].log_softmax(dim=0)\nloss_index = (teacher * (teacher.log() - log_rho)).sum()\nloss_probe = out[0] + 2 * out[1]  # 仅供测试主分支反向\nloss_probe.backward()\nassert qI.grad is None  # 没有穿过整数索引的主Loss梯度\nloss_index.backward()\nprint(ids.tolist(), out.detach().tolist())\nprint(\"index KL:\", loss_index.item())\nprint(\"main dQ:\", Q.grad.tolist())"}, {"title": "16. 最小语义代码：观察选择、输出与两条Loss", "type": "text", "body": "在真实模型中，还必须在生成qI/kI/wI前对传入Indexer的主模型特征detach；本例三组Indexer张量本来就是独立叶子，因此天然隔离。不能因为这段示例没写x.detach就省掉真实网络的隔离。"}, {"title": "正确性", "type": "text", "body": "1. 固定选中索引，以Dense+相同Mask作为参考，比较O、dQ、dK、dV；此时是在比较同一稀疏函数的两种实现。\n2. 再单独比较Indexer打分、ReLU顺序、RoPE布局、量化scale、Top-k与tie-breaking。\n3. 验证L_index不会更新主模型、L_LM不会通过索引更新Indexer。\n4. 覆盖t<k、S<k、padding、packed segment、空可见行、极端分数和CP边界。\n5. 测试真正稀疏模型质量时，再与Dense完整模型对比，不能要求输出逐元素完全一致。"}, {"title": "性能与质量", "type": "text", "body": "- 单独计时 Indexer Projection、Indexer Dot、Top-k、Sparse Fwd/Bwd、KL、KV Gather、通信。\n- 记录allocated/reserved峰值和每层临时张量，而不是只看缓存总容量。\n- 监控被选集合覆盖的Dense教师概率质量、长距离召回、不同层/长度的KL与LM验证Loss。\n- 收集每个Key被选择次数的分布，以定位反向归约热点。\n- 长序列和短序列分开比较吞吐，保持dtype、batch、长度分布和并行布局一致。\n\n对MagiAttention/Flex类工作尤其要记住：**一个实现能表达DSA的Mask，只说明语义可表达；只有执行内核真正跳过未选QK/V交互，才有稀疏计算收益。** 任意token索引、连续range和block mask的转换可能让稀疏集合膨胀，应测实际执行边数/Tile数，而不是仅看理论非零率。"}, {"title": "18. 最后串起来", "type": "formula", "body": "Dense模型 → 保持Dense并冻结主干 → KL训练Lightning Indexer\n→ 开启每Query Top-k → 主模型用LM Loss适应稀疏上下文\n→ Indexer继续从选中集合的主Attention分布学习\n→ 高性能稀疏内核真正跳过未选KV"}, {"title": "18. 最后串起来", "type": "text", "body": "核心结论：DSA是“学习检索 + 稀疏主注意力 + 分离训练信号 + 专门内核”的组合，不是简单Mask技巧；主注意力省了交互，但Indexer、索引存储、KV缓存、反向归约与分布式通信仍需入账。"}, {"title": "可选自测", "type": "text", "body": "1. 为什么主LM Loss不能仅凭Gather的整数索引训练Indexer？\n2. S=131072、k=2048时，为什么最后一个Query是64倍交互缩减，而整段因果序列只有约32.25倍？\n3. 同一个Key未被当前Query选中，为什么仍可能产生非零总梯度？"}, {"title": "继续学习", "type": "text", "body": "1. 前置：MLA的MHA/MQA计算模式与权重吸收——准确核算DSA核心维度与缓存。\n2. 同层对比：NSA与DSA——块级选择、压缩分支和token级索引的取舍。\n3. 下游应用：DSA稀疏Backward与Context Parallel——把选择语义变成真正省算、可扩展的训练实现。"}]}}], "edges": [{"source": "FSDP", "target": "Compute-Communication Overlap", "type": "prerequisite"}, {"source": "FSDP", "target": "DDP", "type": "contrasts"}, {"source": "FSDP", "target": "Tensor Parallel", "type": "contrasts"}, {"source": "FSDP", "target": "Pipeline Parallel", "type": "contrasts"}, {"source": "FSDP", "target": "AllGather", "type": "implements"}, {"source": "FSDP", "target": "ReduceScatter", "type": "implements"}, {"source": "Distributed Training Communication", "target": "Compute-Communication Overlap", "type": "prerequisite"}, {"source": "Distributed Training Communication", "target": "FSDP", "type": "related"}, {"source": "Distributed Training Communication", "target": "AllReduce", "type": "component"}, {"source": "Distributed Training Communication", "target": "AllGather", "type": "component"}, {"source": "Distribute rce": "Expert Parallel", "target": "All-to-All", "type": "implements"}, {"source": "Expert Parallel", "target": "FSDP", "type": "related"}, {"source": "Expert Parallel", "target": "Distributed Training Communication", "type": "related"}, {"source": "Virtual Pipeline Parallelism", "target": "Pipeline Parallel", "type": "implements"}, {"source": "Virtual Pipeline Parallelism", "target": "Compute-Communication Overlap", "type": "related"}, {"source": "CUDA", "target": "PyTorch", "type": "enables"}, {"source": "CUDA", "target": "OpenAI Triton", "type": "enables"}, {"source": "CUDA", "target": "NCCL", "type": "component"}, {"source": "PyTorch", "target": "CUDA", "type": "implements"}, {"source": "PyTorch", "target": "OpenAI Triton", "type": "enables"}, {"source": "PyTorch", "target": "Megatron", "type": "related"}, {"source": "OpenAI Triton", "target": "CUDA", "type": "implements"}, {"source": "OpenAI Triton", "target": "PyTorch", "type": "related"}, {"source": "OpenAI Triton", "target": "torch.compile", "type": "component"}, {"source": "Megatron", "target": "PyTorch", "type": "related"}, {"source": "Megatron", "target": "Pipeline Parallel", "type": "related"}, {"source": "Megatron", "target": "Virtual Pipeline Parallelism", "type": "related"}, {"source": "Megatron", "target": "Tensor Parallel", "type": "related"}, {"source": "CUDA", "target": "Compute-Communication Overlap", "type": "enables"}, {"source": "Virtual Pipeline Parallelism", "target": "Pipeline Parallel", "type": "prerequisite"}, {"source": "Virtual Pipeline Parallelism", "target": "Megatron", "type": "implements"}, {"source": "Mixture of Experts", "target": "Expert Parallel", "type": "enables"}, {"source": "Mixture of Experts", "target": "All-to-All", "type": "implements"}, {"source": "Mixture of Experts", "target": "Megatron", "type": "related"}, {"source": "Mixture of Experts", "target": "PyTorch", "type": "related"}, {"source": "Context Parallelism", "target": "Tensor Parallel", "type": "contrasts"}, {"s
