<script type="module">
const DATA = {"nodes": [{"id": "Compute-Communication Overlap", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["计算通信重叠", "overlap", "隐藏延迟"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Overlap 的本质是：让 GPU 在等待某件慢事情（通信、数据搬运、CPU 下发指令）完成时不要闲着，而是同时去做另一件不依赖该结果的事情，从而用并行把等待时间“藏”起来。\n\n它的实现依赖三个底层能力：异步执行 + 多条独立的执行流(stream/engine) + 依赖关系管理。理想情况下总时间 ≈ max(计算, 通信)，而不是二者相加。"}, {"title": "直觉：餐厅上菜模型", "type": "text", "body": "把 GPU 想象成厨师，把通信/拷贝想象成“跑堂端菜到隔壁桌”。\n\n• 没有 overlap（串行）：厨师炒完一道菜 → 亲自端出去 → 回来再炒下一道。端菜时厨师完全空闲。\n• 有 overlap：厨师炒完一道菜交给跑堂去端（异步），自己立刻开始炒下一道。端菜和炒菜同时进行。\n\n关键前提：炒下一道菜不依赖“上一道菜已经端到桌上”。如果有依赖就无法重叠。类比失效点：现实中跑堂(通信引擎)和厨师(计算SM)可能抢同一资源(如显存带宽、SM)，所以 overlap 不是完全免费的并行。"}, {"title": "底层逻辑：为什么 GPU 能 overlap", "type": "text", "body": "1) GPU 执行是异步的：CPU 调用 kernel 后不等它执行完，把任务提交到队列就立即返回，GPU 在后台执行。下发与执行解耦，CPU 才有机会提交别的任务。\n\n2) GPU 有多个独立执行引擎：Compute Engine(SM) 执行计算 kernel；Copy Engine(DMA) 专门做显存拷贝(H2D/D2H)，独立于 SM；NCCL 通信通常也是 kernel，占用 SM 或专用路径。Copy Engine 与 Compute Engine 物理独立，所以“拷贝”和“计算”天然可真并行。\n\n3) CUDA Stream：表达“哪些任务可以并行”。同一条 stream 内 FIFO 串行；不同 stream 之间默认无顺序约束，可自由并行。所以 overlap 的实现套路就是：把两件想并行的事放进两条不同 stream，用 event 管理跨流依赖。"}, {"title": "关键图：串行 vs 重叠的时间线", "type": "svg", "body": "<svg viewBox=\"0 0 680 300\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>串行与重叠时间线对比</title><desc>对比无 overlap 的串行执行与计算通信重叠后的时间线。</desc>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">串行执行 vs 计算通信重叠</text>\n<text x=\"20\" y=\"56\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#A32D2D\">无 overlap（串行）：总时间 = 计算 + 通信 = 140ms</text>\n<rect x=\"20\" y=\"66\" width=\"200\" height=\"30\" rx=\"5\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/>\n<text x=\"120\" y=\"85\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">计算 100ms</text>\n<rect x=\"220\" y=\"66\" width=\"80\" height=\"30\" rx=\"5\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/>\n<text x=\"260\" y=\"85\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0C447C\" text-anchor=\"middle\">通信 40ms</text>\n<line x1=\"20\" y1=\"108\" x2=\"300\" y2=\"108\" stroke=\"#888780\" stroke-width=\"1\"/>\n<text x=\"300\" y=\"112\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">140ms</text>\n<text x=\"20\" y=\"152\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0F6E56\">有 overlap：总时间 ≈ max(计算, 通信) = 100ms</text>\n<rect x=\"20\" y=\"162\" width=\"200\" height=\"30\" rx=\"5\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/>\n<text x=\"120\" y=\"181\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">计算 100ms（流0）</text>\n<rect x=\"20\" y=\"196\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/>\n<text x=\"60\" y=\"213\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0C447C\" text-anchor=\"middle\">通信 40ms（流1）</text>\n<line x1=\"20\" y1=\"234\" x2=\"220\" y2=\"234\" stroke=\"#888780\" stroke-width=\"1\"/>\n<text x=\"222\" y=\"238\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">100ms（省 40ms）</text>\n<rect x=\"20\" y=\"256\" width=\"620\" height=\"34\" rx=\"8\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"34\" y=\"277\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">要点：重叠后总时间是 max 而非 sum；通信 ≤ 计算时通信几乎完全免费；物理下界 = max(计算,通信)</text>\n</svg>\n"}, {"title": "公式与量级", "type": "formula", "body": "无 overlap（串行）:  T_total = T_comp + T_comm\n理想 overlap:        T_total ≈ max(T_comp, T_comm)\n\n例：T_comp = 100 ms, T_comm = 40 ms\n  串行  = 100 + 40 = 140 ms\n  重叠  = max(100, 40) = 100 ms   → 加速 1.4×，省约 28.6%\n\n例：T_comm = 120 ms（通信占比更大）\n  串行  = 100 + 120 = 220 ms\n  重叠  = max(100, 120) = 120 ms  → 加速 1.83×\n\n物理下界：T_total ≥ max(T_comp, T_comm)，永远不可能更低。"}, {"title": "最小 Sample：拷贝-计算 overlap", "type": "code", "body": "import torch\nN_CHUNKS = 4\ncopy_stream = torch.cuda.Stream()   # 一条流负责拷贝\ncomp_stream = torch.cuda.Stream()   # 一条流负责计算\n\n# pinned 内存是 overlap 成立的隐藏前提，否则拷贝退化成同步\nhost = [torch.randn(1024,1024).pin_memory() for _ in range(N_CHUNKS)]\ndev  = [torch.empty(1024,1024, device='cuda') for _ in range(N_CHUNKS)]\nout  = [None]*N_CHUNKS\n\nfor i in range(N_CHUNKS):\n    with torch.cuda.stream(copy_stream):\n        dev[i].copy_(host[i], non_blocking=True)   # 异步拷贝第 i 块\n    comp_stream.wait_stream(copy_stream)           # 跨流依赖\n    with torch.cuda.stream(comp_stream):\n        out[i] = dev[i] @ dev[i]                   # 计算第 i 块\ntorch.cuda.synchronize()\n\n# 效果：算第 i 块时，第 i+1 块的拷贝同时进行\n# 要点：overlap = 拆分 + 多流 + 依赖管理"}, {"title": "常见误区与失败模式", "type": "text", "body": "1) 误以为多流一定并行：若两条流都要用 SM 而 SM 已被占满，通信 kernel 抢不到资源，overlap 名存实亡（NCCL 占 SM 是典型）。\n2) 忘记 pinned memory：拷贝退化成同步，overlap 失效，而且不报错只是变慢，极难发现。\n3) 依赖没管好：跨流没用 event 同步，计算读到没传完的数据，导致数值错误或 NaN。\n4) bucket 太小：每次通信太小，启动开销占比过高反而变慢；太大又减少重叠机会。\n5) 只看平均不看时间线：必须用 Nsight Systems / torch.profiler 确认计算块和通信块真的在时间上重叠。"}]}}, {"id": "FSDP", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["Fully Sharded Data Parallel", "完全分片数据并行", "ZeRO-3"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "FSDP（Fully Sharded Data Parallel，完全分片数据并行）的本质是：在数据并行的语义下，把每张卡上“完整复制一份模型训练状态”改成“每张卡只存 1/N 份参数、梯度和优化器状态”；在真正要用到某一层时，才临时用一次 AllGather 通信把这一层的完整参数拼回来，算完立刻丢掉。\n\n它用通信换显存：把 DDP 里冗余复制的内存开销摊薄到 N 张卡上，从而能训练远超单卡显存的大模型。它是 ZeRO（Zero Redundancy Optimizer）思想在 PyTorch 中的原生实现。"}, {"title": "系统位置：它解决/不解决什么", "type": "text", "body": "解决的核心问题：单卡装不下完整训练状态。一个 7.5B 模型混合精度+Adam 需 16×7.5e9 = 120GB，单张 80GB H100 都装不下，而 DDP 每张卡都存这 120GB，纯属冗余。\n\n不解决：单层本身太大装不下（需 TP 切算子）；层数太多单卡放不下计算图（需 PP）。它减少的是显存不是计算量——每卡 FLOP 一点没少。\n\n上下游：属于数据并行维度的增强版，可与 TP/PP/EP 正交组合成 3D/4D 并行，替代的是 DDP。"}, {"title": "直觉：共享工具间的工厂", "type": "text", "body": "DDP：N 个工人每人一整套完整工具（全部参数/梯度/优化器状态），N 套占 N 倍仓库空间，极度浪费。\n\nFSDP：N 个工人共用中央工具库，每人只保管 1/N 工具。轮到用某把扳手（某一层）时，保管它的工人广播复印给所有人（AllGather），大家一起用，用完立刻销毁复印件，只有原保管人留正本。\n\n关键代价：每次用工具都要现场“复印+销毁”（通信+临时显存峰值）。类比失效点：现实中复印(AllGather)和干活(计算)可重叠——用当前扳手时提前复印下一把(prefetch)。"}, {"title": "关键图：单层参数生命周期时序", "type": "svg", "body": "<svg viewBox=\"0 0 680 470\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>FSDP 单层参数生命周期</title><desc>FSDP 前向反向中通过 AllGather 拼回、用完释放、ReduceScatter 分片梯度。</desc>\n<defs><marker id=\"arrowf\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs>\n<text x=\"20\" y=\"26\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">FSDP 一层生命周期：AllGather 拼回 → 计算 → 立即释放</text>\n<text x=\"20\" y=\"56\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#185FA5\">前向传播</text>\n<rect x=\"20\" y=\"66\" width=\"120\" height=\"52\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"80\" y=\"87\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#0C447C\" text-anchor=\"middle\">本地 1/N 分片</text><text x=\"80\" y=\"105\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">sharded</text>\n<line x1=\"140\" y1=\"92\" x2=\"185\" y2=\"92\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowf)\"/><text x=\"162\" y=\"84\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">AllGather</text>\n<rect x=\"187\" y=\"66\" width=\"120\" height=\"52\" rx=\"8\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"247\" y=\"87\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#26215C\" text-anchor=\"middle\">拼回完整参数</text><text x=\"247\" y=\"105\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">临时</text>\n<line x1=\"307\" y1=\"92\" x2=\"352\" y2=\"92\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowf)\"/>\n<rect x=\"354\" y=\"66\" width=\"110\" height=\"52\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"409\" y=\"87\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#04342C\" text-anchor=\"middle\">前向计算</text><text x=\"409\" y=\"105\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">output</text>\n<line x1=\"464\" y1=\"92\" x2=\"509\" y2=\"92\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowf)\"/>\n<rect x=\"511\" y=\"66\" width=\"120\" height=\"52\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"571\" y=\"87\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#501313\" text-anchor=\"middle\">释放完整参数</text><text x=\"571\" y=\"105\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\" text-anchor=\"middle\">回到 1/N</text>\n<text x=\"20\" y=\"156\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#185FA5\">反向传播</text>\n<rect x=\"20\" y=\"166\" width=\"120\" height=\"52\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"80\" y=\"187\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#0C447C\" text-anchor=\"middle\">再次 AllGather</text><text x=\"80\" y=\"205\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">重新拼回</text>\n<line x1=\"140\" y1=\"192\" x2=\"185\" y2=\"192\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowf)\"/>\n<rect x=\"187\" y=\"166\" width=\"120\" height=\"52\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"247\" y=\"187\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#04342C\" text-anchor=\"middle\">反向计算</text><text x=\"247\" y=\"205\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">完整梯度</text>\n<line x1=\"307\" y1=\"192\" x2=\"352\" y2=\"192\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowf)\"/><text x=\"330\" y=\"184\" font-family=\"sans-serif\" font-size=\"9\" fill=\"#5F5E5A\" text-anchor=\"middle\">RedScat</text>\n<rect x=\"354\" y=\"166\" width=\"110\" height=\"52\" rx=\"8\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"409\" y=\"187\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#412402\" text-anchor=\"middle\">梯度分片</text><text x=\"409\" y=\"205\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#854F0B\" text-anchor=\"middle\">每卡 1/N</text>\n<line x1=\"464\" y1=\"192\" x2=\"509\" y2=\"192\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowf)\"/>\n<rect x=\"511\" y=\"166\" width=\"120\" height=\"52\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"571\" y=\"192\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#501313\" text-anchor=\"middle\">释放</text>\n<rect x=\"20\" y=\"248\" width=\"611\" height=\"200\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"274\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">三个关键通信原语</text>\n<text x=\"36\" y=\"300\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• AllGather：把散在 N 卡上的参数分片拼成完整层参数（前向、反向各一次）</text>\n<text x=\"36\" y=\"326\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• ReduceScatter：对完整梯度求和规约，同时按分片切回，每卡只留 1/N 梯度</text>\n<text x=\"36\" y=\"352\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 对比 DDP：DDP 只在反向做一次 AllReduce = AllGather + ReduceScatter 的合体</text>\n<text x=\"36\" y=\"386\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">核心权衡：FSDP 通信量约为 DDP 的 1.5 倍，换来每卡显存降到约 1/N</text>\n<text x=\"36\" y=\"412\" font-family=\"sans-serif\" font-size=\"11.5\" fill=\"#5F5E5A\">前向多出的那次 AllGather 是 FSDP 比 DDP 多的主要通信开销来源</text>\n<text x=\"36\" y=\"434\" font-family=\"sans-serif\" font-size=\"11.5\" fill=\"#5F5E5A\">优化器状态全程分片、永不拼回，是省显存最狠的一块</text>\n</svg>\n"}, {"title": "机制：一个训练 step 里做什么", "type": "text", "body": "调度单位是 FSDP unit（通常一层）。\n\n前向：1) 本地只存 1/N 参数分片；2) AllGather 拼回完整参数（临时）；3) 前向计算；4) 立即释放完整参数。\n\n反向：5) 再次 AllGather（因为完整参数已被释放）；6) 反向计算得完整梯度；7) ReduceScatter 对梯度求和并按分片切回，每卡只留 1/N；8) 释放完整参数。\n\n优化器更新：每卡用自己的 1/N 梯度+1/N fp32 参数副本+1/N 优化器状态，独立更新 1/N 参数。优化器状态全程分片、永不拼回，这是省显存最狠的一块。\n\n与 DDP 通信对比：DDP 反向做 1 次 AllReduce；FSDP 做 前向AllGather + 反向AllGather + 反向ReduceScatter，通信量约 DDP 的 1.5 倍。"}, {"title": "公式与量级", "type": "formula", "body": "每参数训练状态 ≈ 16 Byte\n  = fp16参数(2) + fp16梯度(2) + fp32副本(4) + 动量m(4) + 方差v(4)\n\n每卡常驻训练状态（不含激活）：\n  DDP        : M = 16 × Ψ            （完整复制，与 N 无关）\n  FSDP ZeRO-3: M ≈ 16 × Ψ / N        （全部摊薄到 N 卡）\n\n数值算例（Ψ=7.5B, N=64）：\n  DDP  : 16 × 7.5e9        = 120 GB / 卡  → 放不下\n  FSDP : (16 × 7.5e9) / 64 ≈ 1.875 GB / 卡 → 轻松放下\n\n通信量：FSDP / DDP ≈ 3P / 2P = 1.5（多了前向 AllGather）\n\n重要：以上只算参数相关状态，未含激活。FSDP 默认不分片激活，大 batch/长序列时激活可能才是 OOM 主因。"}, {"title": "最小 Sample：PyTorch FSDP", "type": "code", "body": "from torch.distributed.fsdp import FullyShardedDataParallel as FSDP\nfrom torch.distributed.fsdp import ShardingStrategy, BackwardPrefetch\nfrom torch.distributed.fsdp.wrap import transformer_auto_wrap_policy\nimport functools, torch.nn as nn\n\n# 关键点1：按 transformer block 切分 FSDP unit\npolicy = functools.partial(transformer_auto_wrap_policy,\n            transformer_layer_cls={nn.TransformerEncoderLayer})\n\nmodel = FSDP(\n    model,\n    auto_wrap_policy=policy,\n    # 关键点2：FULL_SHARD=ZeRO-3（全分片）；SHARD_GRAD_OP=ZeRO-2\n    sharding_strategy=ShardingStrategy.FULL_SHARD,\n    # 关键点3：反向预取，让 AllGather 与反向计算重叠\n    backward_prefetch=BackwardPrefetch.BACKWARD_PRE,\n)\n# 训练循环与 DDP 几乎一样，分片/拼回/释放由 FSDP 内部完成\nfor batch in loader:\n    loss = model(batch).loss\n    loss.backward()     # 内部自动 AllGather + ReduceScatter\n    optimizer.step()    # 每卡只更新自己的 1/N 参数"}, {"title": "应用场景（何时用 FSDP）", "type": "text", "body": "• 模型能装进单卡只想加速 → 用 DDP（FSDP 额外通信不划算）\n• 训练状态超单卡但单层能装下 → 首选 FSDP\n• 单层太大装不下 → FSDP + TP\n• 层数极多想提利用率 → FSDP + PP\n• MoE 大模型 → FSDP + EP\n• 显存极紧 → FSDP + CPU offload"}, {"title": "常见误区", "type": "text", "body": "1) 误以为 FSDP 减少计算量：错，只减显存，每卡 FLOP 与 DDP 一样。\n2) 误以为用了 FSDP 显存就一定够：错，默认不分片激活，大 batch/长序列仍可能 OOM。\n3) 把 FSDP 和 TP 混为一谈：FSDP 计算某层时拼回完整参数再算（层计算完整）；TP 是这一层计算本身被切开多卡协同。切分维度不同，可叠加。\n4) 以为 ZeRO 和 FSDP 是两个东西：ZeRO 是 DeepSpeed 的算法思想，FSDP 是 PyTorch 原生实现，FULL_SHARD≈ZeRO-3。\n5) 切分粒度随意设：太细通信次数暴涨，太粗临时参数撑爆显存峰值，需按 block 粒度并 profiler 调。"}]}}, {"id": "DDP", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["DistributedDataParallel", "分布式数据并行"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "DDP（Distributed Data Parallel，分布式数据并行）：每张卡保存一份完整的模型副本，各自吃不同的数据分片，反向后用 AllReduce 同步梯度，使各卡参数保持一致。"}, {"title": "关键图：机制", "type": "svg", "body": "<svg viewBox=\"0 0 680 240\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>DDP 数据并行</title><desc>DDP：每卡完整模型副本，各吃不同数据，反向 AllReduce 同步梯度。</desc>\n<defs><marker id=\"dd1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">DDP：切数据，每卡一份完整模型</text>\n<rect x=\"20\" y=\"50\" width=\"180\" height=\"56\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"110\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#0C447C\" text-anchor=\"middle\">卡0：完整模型</text><text x=\"110\" y=\"92\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">吃数据分片 D0</text>\n<rect x=\"220\" y=\"50\" width=\"180\" height=\"56\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"310\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#0C447C\" text-anchor=\"middle\">卡1：完整模型</text><text x=\"310\" y=\"92\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">吃数据分片 D1</text>\n<rect x=\"420\" y=\"50\" width=\"180\" height=\"56\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"510\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#0C447C\" text-anchor=\"middle\">卡N：完整模型</text><text x=\"510\" y=\"92\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">吃数据分片 DN</text>\n<line x1=\"310\" y1=\"112\" x2=\"310\" y2=\"140\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#dd1)\"/>\n<rect x=\"180\" y=\"142\" width=\"260\" height=\"30\" rx=\"6\" fill=\"#185FA5\" stroke=\"#0C447C\" stroke-width=\"0.5\"/><text x=\"310\" y=\"161\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">反向后 AllReduce 同步梯度</text>\n<rect x=\"20\" y=\"186\" width=\"580\" height=\"40\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"204\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">要点：最费显存(每卡完整复制 16×Ψ)，实现最简；适合模型能装进单卡、只想扩数据吞吐。</text>\n<text x=\"36\" y=\"220\" font-family=\"sans-serif\" font-size=\"11.5\" fill=\"#5F5E5A\">对应 ZeRO-0；FSDP 是它的分片增强版。</text>\n</svg>\n"}, {"title": "机制", "type": "text", "body": "每 step：各卡在自己的数据分片上前向+反向算出本地梯度 → AllReduce 求全局平均梯度 → 各卡用相同梯度独立更新，参数天然保持一致。PyTorch DDP 用 gradient bucketing 让 AllReduce 与反向计算重叠。"}, {"title": "公式与量级", "type": "formula", "body": "每卡训练状态显存 = 16 × Ψ（与卡数 N 无关，完整复制）\n  例：7.5B 模型 → 120 GB/卡，单卡放不下\n每卡梯度通信量 ≈ 2M（Ring AllReduce）\n对应 ZeRO-0（无任何分片）。"}, {"title": "与 FSDP 的区别", "type": "text", "body": "DDP 每卡存完整训练状态（冗余）；FSDP 把参数/梯度/优化器状态分片到 N 卡，用时 AllGather 临时拼回。DDP 通信少(1次AllReduce)但费显存；FSDP 通信多约 1.5 倍但每卡显存降到 1/N。模型能装进单卡→DDP；装不下→FSDP。"}, {"title": "常见误区", "type": "text", "body": "以为 DDP 能训练超大模型：不能，它每卡都要装完整模型，模型超单卡就必须换 FSDP/TP/PP。"}]}}, {"id": "Tensor Parallel", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["TP", "张量并行"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Tensor Parallel（TP，张量并行）：把单个算子内部的大张量（如一个大矩阵乘的权重）按列或行切到多张卡上，多卡协同完成这一层的一次前向/反向。切的是“算子内的张量”，不是数据也不是层。"}, {"title": "关键图：机制", "type": "svg", "body": "<svg viewBox=\"0 0 680 240\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Tensor Parallel</title><desc>TP：把单个算子内的大矩阵按列/行切到多卡，协同完成一层计算。</desc>\n<defs><marker id=\"tp1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Tensor Parallel：切单个算子内的张量</text>\n<rect x=\"20\" y=\"52\" width=\"150\" height=\"30\" rx=\"5\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"95\" y=\"71\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">输入激活 X</text>\n<line x1=\"170\" y1=\"67\" x2=\"210\" y2=\"67\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#tp1)\"/>\n<rect x=\"216\" y=\"44\" width=\"150\" height=\"26\" rx=\"5\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"291\" y=\"61\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#26215C\" text-anchor=\"middle\">卡0：W 的左半列</text>\n<rect x=\"216\" y=\"76\" width=\"150\" height=\"26\" rx=\"5\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"291\" y=\"93\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#26215C\" text-anchor=\"middle\">卡1：W 的右半列</text>\n<line x1=\"366\" y1=\"67\" x2=\"406\" y2=\"67\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#tp1)\"/><text x=\"440\" y=\"60\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">AllReduce</text><text x=\"440\" y=\"74\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">/AllGather</text>\n<rect x=\"490\" y=\"52\" width=\"150\" height=\"30\" rx=\"5\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"565\" y=\"71\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#412402\" text-anchor=\"middle\">完整输出 Y</text>\n<rect x=\"20\" y=\"120\" width=\"620\" height=\"104\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"144\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"168\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 一层的计算本身被切开，多卡协同完成一次前向（与 FSDP“拼回完整再算”本质不同）</text>\n<text x=\"36\" y=\"192\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 每层前后向都要通信、依赖紧、难 overlap → 必须锁在机内 NVLink 域(通常≤8卡)</text>\n<text x=\"36\" y=\"216\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 适合单层/单算子太大装不进单卡的场景</text>\n</svg>\n"}, {"title": "机制", "type": "text", "body": "以 MLP 为例（Megatron 风格）：第一个线性层按列切权重（column-parallel），各卡算出输出的一部分；第二个线性层按行切（row-parallel），最后用一次 AllReduce 把部分和合并成完整输出。一层内通常有多次通信。"}, {"title": "公式与量级", "type": "formula", "body": "每层每次前向的通信量与激活大小同阶：\n  ≈ O(B × S × H) 的 AllReduce/AllGather\n通信频率极高（每层前后向各若干次），因此对带宽和延迟极敏感。"}, {"title": "为什么必须 NVLink", "type": "text", "body": "TP 的通信在关键路径上：一层输出规约完，下一步立刻要用这个完整激活，依赖极紧，几乎无独立计算可 overlap。所以必须放在机内 NVLink 域（~450GB/s，通常≤8卡），跨机 IB(~50GB/s)会让它慢到不可用。"}, {"title": "与 FSDP 的区别", "type": "text", "body": "FSDP 计算某层时把该层参数拼回完整再算（层的计算是完整的、在一张卡上）；TP 是这一层的计算本身被切开、多卡协同完成一次前向。切分维度不同，二者可叠加（TP 切算子 + FSDP 切数据）。"}, {"title": "常见误区", "type": "text", "body": "1) 把 TP 跨机部署：严重错误，通信会成为绝对瓶颈。\n2) 把 TP 和 FSDP 混为一谈：切分维度根本不同（算子内张量 vs 数据+状态分片）。"}]}}, {"id": "Pipeline Parallel", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["PP", "流水线并行"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Pipeline Parallel（PP，流水线并行）：把模型按层（深度方向）切成若干连续的 stage，分别放在不同卡上，激活像流水线一样在 stage 间用 P2P Send/Recv 逐级传递。切的是“层”。"}, {"title": "关键图：机制", "type": "svg", "body": "<svg viewBox=\"0 0 680 240\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Pipeline Parallel</title><desc>PP：按层把模型切成 stage 放不同卡，激活沿流水线 P2P 传递。</desc>\n<defs><marker id=\"pp1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Pipeline Parallel：按层切 stage，P2P 传激活</text>\n<rect x=\"20\" y=\"54\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"85\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#0C447C\" text-anchor=\"middle\">卡0: Stage0</text><text x=\"85\" y=\"89\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">层 1-10</text>\n<line x1=\"150\" y1=\"76\" x2=\"185\" y2=\"76\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#pp1)\"/><text x=\"167\" y=\"68\" font-family=\"sans-serif\" font-size=\"9\" fill=\"#5F5E5A\" text-anchor=\"middle\">Send</text>\n<rect x=\"187\" y=\"54\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"252\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#04342C\" text-anchor=\"middle\">卡1: Stage1</text><text x=\"252\" y=\"89\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\" text-anchor=\"middle\">层 11-20</text>\n<line x1=\"317\" y1=\"76\" x2=\"352\" y2=\"76\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#pp1)\"/>\n<rect x=\"354\" y=\"54\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"419\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#412402\" text-anchor=\"middle\">卡2: Stage2</text><text x=\"419\" y=\"89\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#854F0B\" text-anchor=\"middle\">层 21-30</text>\n<line x1=\"484\" y1=\"76\" x2=\"519\" y2=\"76\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#pp1)\"/>\n<rect x=\"521\" y=\"54\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#FBEAF0\" stroke=\"#993556\" stroke-width=\"0.5\"/><text x=\"586\" y=\"72\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#4B1528\" text-anchor=\"middle\">卡3: Stage3</text><text x=\"586\" y=\"89\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#993556\" text-anchor=\"middle\">层 31-40</text>\n<rect x=\"20\" y=\"120\" width=\"631\" height=\"104\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"144\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"168\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 通信用 P2P Send/Recv 传激活，量小；但存在流水线气泡(bubble)——启动收尾阶段部分卡闲置</text>\n<text x=\"36\" y=\"192\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 用 micro-batch + 1F1B 调度让前后向交错，压缩气泡（这就是它的 overlap 方式）</text>\n<text x=\"36\" y=\"216\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 适合层数极多、想提升集群利用率；常跨机部署</text>\n</svg>\n"}, {"title": "机制", "type": "text", "body": "前向时 stage k 算完把激活 Send 给 stage k+1；反向时把梯度 Send 回 stage k。把一个 batch 拆成多个 micro-batch 送入流水线，让各 stage 尽量同时有活干。"}, {"title": "流水线气泡与 1F1B", "type": "formula", "body": "气泡占比（朴素调度）≈ (P-1)/(M+P-1)\n  P = stage 数（流水线深度）\n  M = micro-batch 数\n→ M 越大，气泡占比越小。\n\n1F1B(one-forward-one-backward)调度：让不同 micro-batch 的前向、反向在不同 stage 交错进行，用一个 micro-batch 的计算掩盖另一个的 P2P 传输，压缩气泡。"}, {"title": "能否 overlap", "type": "text", "body": "能，这正是流水线调度的核心。P2P 通信量小，1F1B 让计算与相邻 stage 的通信、以及不同 micro-batch 的前后向充分交错。"}, {"title": "常见误区", "type": "text", "body": "1) micro-batch 太少：气泡占比大，流水线利用率低。\n2) 把 PP 当成能省单层显存：PP 按 stage 分层，单层仍完整放在一张卡上，单层太大要靠 TP。"}]}}, {"id": "AllGather", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["全收集"], "group": "communication", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "AllGather（全收集）：每张卡持有一个分片，通信后每张卡都拿到拼接起来的完整数据。只搬运不做规约，是 ReduceScatter 的逆操作。"}, {"title": "关键图：数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 220\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>AllGather 数据流</title><desc>4 卡 AllGather：各卡分片拼成完整数据，每卡都拿到全部。</desc>\n<defs><marker id=\"ag1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#854F0B\">AllGather：各卡分片 → 每卡拼成完整</text>\n<rect x=\"20\" y=\"52\" width=\"34\" height=\"26\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"37\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">a</text>\n<rect x=\"58\" y=\"52\" width=\"34\" height=\"26\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"75\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">b</text>\n<rect x=\"96\" y=\"52\" width=\"34\" height=\"26\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"113\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">c</text>\n<rect x=\"134\" y=\"52\" width=\"34\" height=\"26\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"151\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">d</text>\n<text x=\"94\" y=\"96\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\" text-anchor=\"middle\">卡0/1/2/3 各持一片</text>\n<line x1=\"180\" y1=\"65\" x2=\"230\" y2=\"65\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ag1)\"/>\n<rect x=\"240\" y=\"52\" width=\"410\" height=\"26\" rx=\"4\" fill=\"#BA7517\" stroke=\"#633806\" stroke-width=\"0.5\"/><text x=\"445\" y=\"69\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">每卡都有 [a b c d]（完整）</text>\n<rect x=\"20\" y=\"110\" width=\"630\" height=\"94\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"134\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"158\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• FSDP 用它把分片参数临时拼回完整层参数；TP 用它收集分片的激活/输出</text>\n<text x=\"36\" y=\"182\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 只搬运不做规约（不求和）；是 ReduceScatter 的逆操作</text>\n</svg>\n"}, {"title": "机制与用途", "type": "text", "body": "用在哪：\n• FSDP/ZeRO-3：前向/反向前用 AllGather 把分片的参数临时拼回完整层参数，算完释放。\n• Tensor Parallel：列并行线性层各卡算出输出的一部分，用 AllGather 拼成完整激活给下一层。\n• 序列并行：在“序列切分”和“张量切分”之间转换时用到。"}, {"title": "公式与量级", "type": "formula", "body": "每卡通信量 ≈ (N-1)/N × M_full ≈ M_full   （N 较大时）\n  M_full = 拼接后完整数据的字节数\n对 FSDP：一层参数越大，这次 AllGather 越贵，所以要靠 prefetch 与计算重叠。"}, {"title": "能否 overlap", "type": "text", "body": "能。FSDP 用 forward_prefetch/backward_prefetch：算第 i 层时提前 AllGather 第 i+1 层参数，把通信藏进计算里。"}, {"title": "常见误区", "type": "text", "body": "误把 AllGather 当作带求和的操作：它只做数据搬运/拼接，不做任何规约。带求和的是 AllReduce/ReduceScatter。"}]}}, {"id": "ReduceScatter", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["规约散射"], "group": "communication", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "ReduceScatter（规约散射）：各卡数据先逐元素求和，然后按分片切开，每张卡只保留自己负责的那 1/N 段。= Reduce(求和) + Scatter(散开)。"}, {"title": "关键图：数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 220\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>ReduceScatter 数据流</title><desc>4 卡 ReduceScatter：求和后按分片切开，每卡只留一份。</desc>\n<defs><marker id=\"rs1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#0F6E56\">ReduceScatter：求和后按分片切 → 每卡只留 1/N</text>\n<rect x=\"20\" y=\"52\" width=\"160\" height=\"26\" rx=\"4\" fill=\"#5DCAA5\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"100\" y=\"69\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">各卡各有完整 a/b/c/d</text>\n<line x1=\"190\" y1=\"65\" x2=\"240\" y2=\"65\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#rs1)\"/><text x=\"215\" y=\"57\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">Σ+切</text>\n<rect x=\"250\" y=\"52\" width=\"90\" height=\"26\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"295\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">卡0: Σa</text>\n<rect x=\"344\" y=\"52\" width=\"90\" height=\"26\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"389\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">卡1: Σb</text>\n<rect x=\"438\" y=\"52\" width=\"90\" height=\"26\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"483\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">卡2: Σc</text>\n<rect x=\"532\" y=\"52\" width=\"90\" height=\"26\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"577\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">卡3: Σd</text>\n<rect x=\"20\" y=\"110\" width=\"630\" height=\"94\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"134\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"158\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• FSDP 用它规约梯度并分片：每卡只留自己负责的 1/N 梯度，配合分片优化器状态省显存</text>\n<text x=\"36\" y=\"182\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• = Reduce(求和) + Scatter(散开)；比 AllReduce 少留 (N-1)/N 的冗余</text>\n</svg>\n"}, {"title": "机制与用途", "type": "text", "body": "用在哪：FSDP/ZeRO-3 反向。算完完整梯度后用 ReduceScatter 求和并切片，每卡只留 1/N 梯度，配合分片的 fp32 参数副本和优化器状态，显存直接降到 1/N。\n\n对比 AllReduce：AllReduce 后每卡都拿完整梯度仍冗余；ReduceScatter 让每卡只拿 1/N，省掉 (N-1)/N 的冗余存储。"}, {"title": "公式与恒等式", "type": "formula", "body": "每卡通信量 ≈ (N-1)/N × M ≈ M\n\n核心恒等式：AllReduce = ReduceScatter + AllGather\n  → FSDP 就是把 DDP 的一次 AllReduce，拆成 ReduceScatter(省梯度显存) + 平时的 AllGather(省参数显存)。"}, {"title": "能否 overlap", "type": "text", "body": "能，可与反向计算重叠：某层完整梯度算完即可对它做 ReduceScatter，同时继续反向前面层。"}, {"title": "常见误区", "type": "text", "body": "误以为 ReduceScatter 比 AllReduce 通信更贵：单次约 M，是 AllReduce(2M) 的一半；FSDP 通信总量多是因为多了前向那次 AllGather，而非 ReduceScatter 本身贵。"}]}}, {"id": "Distributed Training Communication", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["大模型训练通信方式", "集合通信", "Collective Communication"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "大模型训练中的通信只有两大类：集合通信(Collective)和点对点通信(P2P)。集合通信是“一群 GPU 一起参与”(AllReduce/AllGather/ReduceScatter/All-to-All/Broadcast)，由 NCCL 实现；点对点是“一张卡发给另一张卡”(Send/Recv)，主要用于流水线并行传激活。\n\n判别口诀：哪种并行策略，决定用哪种通信。DP→AllReduce；FSDP→ReduceScatter+AllGather；TP→AllReduce/AllGather；PP→P2P；MoE→All-to-All。几乎所有通信都能且应与计算 overlap。"}, {"title": "地基：通信走哪条物理链路", "type": "formula", "body": "链路                  典型单向带宽        用途\nNVLink/NVSwitch(机内) ~450 GB/s (H100)   同机 8 卡，TP 命脉\nPCIe(机内)            ~64 GB/s (Gen5)    GPU-CPU、offload\nIB/RoCE(跨机 RDMA)    ~50 GB/s (400Gbps) 跨节点，PP/DP 通信\n以太网                 更低                一般不用于训练热路径\n\n核心认知：同一次 AllReduce，走 NVLink 和走跨机 IB 慢几个数量级。“哪种并行放机内、哪种跨机”是布局的头等大事。"}, {"title": "关键图：四大核心集合通信原语", "type": "svg", "body": "<svg viewBox=\"0 0 680 420\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>四大核心集合通信原语</title><desc>对照 AllReduce、ReduceScatter、AllGather、All-to-All 的输入输出。</desc>\n<defs><marker id=\"arrowc\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">四大核心原语（4 卡，左=输入，右=输出）</text>\n<text x=\"20\" y=\"54\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#185FA5\">AllReduce — 求和后每卡都拿全（DDP 梯度同步）</text>\n<rect x=\"20\" y=\"64\" width=\"150\" height=\"24\" rx=\"4\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"95\" y=\"76\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#042C53\" text-anchor=\"middle\">各卡各有 a/b/c/d</text>\n<line x1=\"180\" y1=\"76\" x2=\"230\" y2=\"76\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowc)\"/>\n<rect x=\"240\" y=\"64\" width=\"200\" height=\"24\" rx=\"4\" fill=\"#185FA5\" stroke=\"#0C447C\" stroke-width=\"0.5\"/><text x=\"340\" y=\"76\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">每卡都有 Σ(a+b+c+d)</text>\n<text x=\"20\" y=\"118\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0F6E56\">ReduceScatter — 求和后按分片切，每卡只留一份（FSDP 梯度）</text>\n<rect x=\"20\" y=\"128\" width=\"150\" height=\"24\" rx=\"4\" fill=\"#5DCAA5\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"95\" y=\"140\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">各卡各有 a/b/c/d</text>\n<line x1=\"180\" y1=\"140\" x2=\"230\" y2=\"140\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowc)\"/>\n<rect x=\"240\" y=\"128\" width=\"46\" height=\"24\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"263\" y=\"140\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Σa</text>\n<rect x=\"291\" y=\"128\" width=\"46\" height=\"24\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"314\" y=\"140\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Σb</text>\n<rect x=\"342\" y=\"128\" width=\"46\" height=\"24\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"365\" y=\"140\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Σc</text>\n<rect x=\"393\" y=\"128\" width=\"46\" height=\"24\" rx=\"4\" fill=\"#0F6E56\" stroke=\"#085041\" stroke-width=\"0.5\"/><text x=\"416\" y=\"140\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">Σd</text>\n<text x=\"20\" y=\"182\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#854F0B\">AllGather — 各卡分片拼成完整，每卡都拿全（FSDP 拼参数）</text>\n<rect x=\"20\" y=\"192\" width=\"34\" height=\"24\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"37\" y=\"204\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">a</text>\n<rect x=\"58\" y=\"192\" width=\"34\" height=\"24\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"75\" y=\"204\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">b</text>\n<rect x=\"96\" y=\"192\" width=\"34\" height=\"24\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"113\" y=\"204\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">c</text>\n<rect x=\"134\" y=\"192\" width=\"34\" height=\"24\" rx=\"4\" fill=\"#EF9F27\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"151\" y=\"204\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#412402\" text-anchor=\"middle\">d</text>\n<line x1=\"180\" y1=\"204\" x2=\"230\" y2=\"204\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowc)\"/>\n<rect x=\"240\" y=\"192\" width=\"200\" height=\"24\" rx=\"4\" fill=\"#BA7517\" stroke=\"#633806\" stroke-width=\"0.5\"/><text x=\"340\" y=\"204\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">每卡都有 [a b c d]</text>\n<text x=\"20\" y=\"246\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#993556\">All-to-All — 转置式重分布（MoE 路由）</text>\n<rect x=\"20\" y=\"256\" width=\"150\" height=\"24\" rx=\"4\" fill=\"#ED93B1\" stroke=\"#993556\" stroke-width=\"0.5\"/><text x=\"95\" y=\"268\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#4B1528\" text-anchor=\"middle\">卡i 持 [到0,到1,到2,到3]</text>\n<line x1=\"180\" y1=\"268\" x2=\"230\" y2=\"268\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowc)\"/>\n<rect x=\"240\" y=\"256\" width=\"200\" height=\"24\" rx=\"4\" fill=\"#993556\" stroke=\"#72243E\" stroke-width=\"0.5\"/><text x=\"340\" y=\"268\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">卡j 收 [来自0,1,2,3 的第j块]</text>\n<rect x=\"20\" y=\"302\" width=\"611\" height=\"96\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"326\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">关键恒等式（务必记住）</text>\n<text x=\"36\" y=\"352\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">AllReduce = ReduceScatter + AllGather（FSDP 拆开 DDP 的数学本质）</text>\n<text x=\"36\" y=\"378\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">Reduce = 求和到一张卡；Gather = 收集到一张卡（原语的“单点”版）</text>\n</svg>\n"}, {"title": "AllReduce —— 数据并行命脉", "type": "text", "body": "语义：每张卡有一份等长数据（通常是梯度），逐元素求和，结果每张卡都得到一份完整的和。\n\n用在哪：DDP 梯度同步。N 卡各自在不同 mini-batch 上算梯度，反向后 AllReduce 得全局平均梯度，各自更新出一致参数。\n\n例子：训练 Llama 用 DDP 起 128 卡，每卡吃不同数据，每 step 反向后对全部梯度(7B fp16=14GB)做一次 AllReduce。\n\n通信量：Ring AllReduce 每卡 ≈ 2M，几乎与卡数 N 无关（能 scale 千卡的原因）。\n\n能否 overlap：能，且是头等大事。反向逐层从后往前，某层梯度算完就能立刻 AllReduce，同时继续算前面层。PyTorch DDP 用 gradient bucketing 自动实现。"}, {"title": "ReduceScatter + AllGather —— FSDP/ZeRO 两把刀", "type": "text", "body": "核心恒等式：AllReduce = ReduceScatter + AllGather，这是理解 FSDP 的钥匙。\n\nReduceScatter：各卡数据求和后按分片切开，每卡只留 1/N。\nAllGather：每卡持一个分片，通信后每卡拿到拼接的完整数据。\n\n用在哪：FSDP/ZeRO-3。前向/反向前用 AllGather 拼回分片参数；反向算完梯度用 ReduceScatter 求和并切片，每卡留 1/N。\n\n为什么不用 AllReduce：AllReduce 后每卡都拿完整梯度仍冗余；ReduceScatter 让每卡只拿 1/N，配合分片优化器状态，显存降到 1/N。FSDP 就是把 DDP 的一次 AllReduce 拆成 ReduceScatter + 平时的 AllGather。\n\n能否 overlap：能，靠 prefetch。算第 i 层时提前 AllGather 第 i+1 层参数；forward_prefetch/backward_prefetch 控制。"}, {"title": "All-to-All —— MoE 专属", "type": "text", "body": "语义：最“拧巴”的一个。每张卡都持有要发给所有其他卡的不同数据块；通信后每张卡收到来自所有其他卡发给自己的块。本质是跨卡的“矩阵转置式重分布”。\n\n用在哪：MoE 的 Expert Parallel。不同专家在不同卡上，token 经 router 后要发往选中专家所在的卡（dispatch 一次 All-to-All），专家算完再送回（combine 一次 All-to-All）。\n\n例子：训练 Mixtral、DeepSeek-MoE，每个 MoE 层两次 All-to-All。专家跨机时走 IB，极易成瓶颈。\n\n能否 overlap：能但更难。依赖 router 输出（先知道每个 token 去哪），依赖链紧。先进实现(DualPipe/Tutel)会把 dispatch 与其他专家/dense 计算重叠，工程复杂度高于 AllReduce overlap。"}, {"title": "P2P Send/Recv —— 流水线并行接力棒", "type": "text", "body": "语义：点对点，rank i 把一块数据 Send 给 rank j，rank j Recv。只涉及两张卡。\n\n用在哪：PP 的 stage 间传激活。模型按层切成若干 stage 放不同卡，前向时 stage k 算完把激活 Send 给 stage k+1；反向把梯度 Send 回 stage k。\n\n例子：把 80 层切 8 个 stage，每 stage 10 层，激活沿流水线逐级 Send/Recv，配合 micro-batch 做 1F1B 调度。\n\n通信特点：量相对小(只传激活)，但存在流水线气泡(bubble)——stage 间有依赖，启动收尾阶段部分卡闲置。\n\n能否 overlap：能，这正是流水线调度核心。1F1B 让不同 micro-batch 的前向反向在不同 stage 交错，用一个 micro-batch 的计算掩盖另一个的 P2P 传输，压缩气泡。"}, {"title": "overlap 的统一判据", "type": "formula", "body": "能 overlap 的充要条件：\n  发起通信 C 后，存在不依赖 C 结果的独立计算 X 可立刻做 → C 与 X 并行\n反例（无法 overlap）：\n  下一步计算立刻要用这次通信的结果 → 只能干等（暴露在关键路径）\n\n对照：\n  DDP AllReduce  → 易（反向逐层有独立计算）\n  FSDP AllGather → 易（prefetch 下一层）\n  TP AllReduce   → 难（下一步立刻要用，依赖紧 → 必须放 NVLink）\n  PP P2P         → 靠 1F1B 调度\n  MoE All-to-All → 能但需精心编排\n\n物理下界：单步时间 ≥ max(总计算, 总通信)"}, {"title": "数值算例：感受通信量级", "type": "formula", "body": "DDP 训练 7B 模型，fp16 梯度，64 卡：\n  梯度总量 M = 7e9 × 2 Byte = 14 GB\n  Ring AllReduce 每卡通信量 ≈ 2M = 28 GB\n  跨机 IB 有效带宽 ≈ 40 GB/s：\n    T_comm ≈ 28 / 40 ≈ 0.7 s\n  若单步计算 T_comp ≈ 1.0 s：\n    无 overlap : 1.0 + 0.7 = 1.7 s\n    完美 overlap: max(1.0,0.7) = 1.0 s → 加速约 1.7×\n\n结论：通信占计算的比例(70%)决定 overlap 收益上限。"}, {"title": "五策略通信对照 + 布局原则", "type": "text", "body": "DDP     : AllReduce            | 每step一次(分bucket) | 能overlap(bucketing)\nFSDP    : AllGather+ReduceScatter| 每层多次            | 能overlap(prefetch)\nTP      : AllReduce/AllGather   | 每层多次(极重)       | 难overlap(在关键路径)\nPP      : P2P Send/Recv         | 每micro-batch一次    | 能overlap(1F1B)\nMoE(EP) : All-to-All            | 每MoE层两次          | 能但复杂\n\n布局原则：越重越频繁的通信放越快的链路。典型 3D 并行：\n  TP → 机内 8 卡走 NVLink（每层通信最重）\n  PP → 跨机（P2P 轻，IB 扛得住）\n  DP/FSDP → 最外层跨机（AllReduce/AllGather 频率较低）"}, {"title": "常见误区", "type": "text", "body": "1) 误以为 AllReduce 通信量随卡数线性增长：错，Ring 每卡趋近 2M，几乎与 N 无关。\n2) 误以为 FSDP 比 DDP 通信更省：反了，FSDP 约 1.5 倍，省的是显存不是通信。\n3) 把 TP 放跨机：严重错误，TP 每层通信、依赖紧、难 overlap，必须锁 NVLink 域内(≤8 卡)。\n4) 以为开了 overlap 就一定生效：若通信 kernel 与计算抢 SM，或忘用独立 stream/pinned memory，overlap 名存实亡，必须 profiler 验证。\n5) All-to-All 当廉价操作：MoE 跨机 All-to-All 常是瓶颈，专家负载不均会拥塞。"}]}}, {"id": "AllReduce", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["全规约"], "group": "communication", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "AllReduce（全规约）：每张卡各持一份等长数据（通常是梯度），逐元素求和（或求平均）后，结果每张卡都得到一份完整的和。它是数据并行的命脉。"}, {"title": "关键图：数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 250\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>AllReduce 数据流</title><desc>4 卡 AllReduce：各卡梯度求和后每卡都得到完整的和。</desc>\n<defs><marker id=\"ar1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">AllReduce：各卡求和 → 每卡都拿到完整的和</text>\n<text x=\"20\" y=\"52\" font-family=\"sans-serif\" font-size=\"12.5\" font-weight=\"500\" fill=\"#185FA5\">输入（4 卡各持一份梯度）</text>\n<rect x=\"20\" y=\"62\" width=\"130\" height=\"28\" rx=\"4\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"85\" y=\"80\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#042C53\" text-anchor=\"middle\">卡0: g0  卡1: g1</text>\n<rect x=\"160\" y=\"62\" width=\"130\" height=\"28\" rx=\"4\" fill=\"#85B7EB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"225\" y=\"80\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#042C53\" text-anchor=\"middle\">卡2: g2  卡3: g3</text>\n<line x1=\"300\" y1=\"76\" x2=\"350\" y2=\"76\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ar1)\"/><text x=\"325\" y=\"68\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">Σ 求和</text>\n<rect x=\"360\" y=\"62\" width=\"290\" height=\"28\" rx=\"4\" fill=\"#185FA5\" stroke=\"#0C447C\" stroke-width=\"0.5\"/><text x=\"505\" y=\"80\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#fff\" text-anchor=\"middle\">每卡都有 G = g0+g1+g2+g3</text>\n<rect x=\"20\" y=\"108\" width=\"630\" height=\"122\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"132\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"156\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 用于 DDP 梯度同步：N 卡在不同数据上算梯度，AllReduce 后各卡拿到全局平均梯度</text>\n<text x=\"36\" y=\"180\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• Ring AllReduce 每卡通信量 ≈ 2M，几乎与卡数 N 无关（能 scale 千卡）</text>\n<text x=\"36\" y=\"204\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 恒等式：AllReduce = ReduceScatter + AllGather</text>\n</svg>\n"}, {"title": "机制", "type": "text", "body": "N 张卡各自在不同 mini-batch 上算出本地梯度 g_i，反向结束后对梯度做 AllReduce，让每张卡都拿到全局和 G = Σ g_i（除以 N 即全局平均梯度），从而各自更新出完全一致的参数。\n\n高效实现是 Ring AllReduce：分成 reduce-scatter 阶段（沿环累加）+ all-gather 阶段（沿环传播结果），把带宽利用率做到接近最优。"}, {"title": "公式与量级", "type": "formula", "body": "Ring AllReduce 每卡通信量：\n  ≈ 2 × (N-1)/N × M ≈ 2M   （N 较大时）\n\n  M = 待规约数据总字节数（如梯度总大小）\n  N = 参与卡数\n\n关键：通信量几乎与卡数 N 无关（趋近 2M），这是能 scale 到数千卡的原因。\n例：7B 模型 fp16 梯度 M=14GB，每卡 AllReduce ≈ 28GB。"}, {"title": "最小 Sample", "type": "code", "body": "import torch, torch.distributed as dist\n# 每张卡持有本地梯度 grad（shape 相同）\ndist.all_reduce(grad, op=dist.ReduceOp.SUM)   # 原地求和，每卡都得到 G\ngrad /= dist.get_world_size()                 # 变成全局平均梯度\n# DDP 内部对每个 bucket 自动做上面这件事，并与反向计算重叠"}, {"title": "能否 overlap", "type": "text", "body": "能，且是训练优化头等大事。反向逐层从后往前算，第 L 层梯度一算完就能立刻 AllReduce，同时继续算前面层。PyTorch DDP 用 gradient bucketing 自动实现：梯度攒满一个 bucket 就异步触发 AllReduce。"}, {"title": "常见误区", "type": "text", "body": "1) 误以为通信量随卡数线性增长：错，Ring 每卡趋近 2M，几乎与 N 无关。\n2) 把 AllReduce 当成 FSDP 的省显存手段：AllReduce 后每卡都拿完整梯度仍冗余，FSDP 才用 ReduceScatter 把它降到 1/N。"}]}}, {"id": "All-to-All", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["全交换", "All2All"], "group": "communication", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "All-to-All（全交换）：每张卡都持有要发给所有其他卡的不同数据块；通信后每张卡收到来自所有其他卡发给自己的块。本质是跨卡的“矩阵转置式重分布”。"}, {"title": "关键图：数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 240\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>All-to-All 数据流</title><desc>4 卡 All-to-All：每卡把不同块发给不同卡，转置式重分布。</desc>\n<defs><marker id=\"a2a\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#993556\">All-to-All：转置式重分布（MoE token 路由）</text>\n<rect x=\"20\" y=\"52\" width=\"280\" height=\"26\" rx=\"4\" fill=\"#ED93B1\" stroke=\"#993556\" stroke-width=\"0.5\"/><text x=\"160\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#4B1528\" text-anchor=\"middle\">卡 i 持 [发给0, 发给1, 发给2, 发给3]</text>\n<line x1=\"310\" y1=\"65\" x2=\"360\" y2=\"65\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#a2a)\"/><text x=\"335\" y=\"57\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">转置</text>\n<rect x=\"370\" y=\"52\" width=\"280\" height=\"26\" rx=\"4\" fill=\"#993556\" stroke=\"#72243E\" stroke-width=\"0.5\"/><text x=\"510\" y=\"69\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#fff\" text-anchor=\"middle\">卡 j 收 [来自0,1,2,3 发给 j 的块]</text>\n<rect x=\"20\" y=\"102\" width=\"630\" height=\"122\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"126\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"150\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 用于 MoE 的 Expert Parallel：dispatch 把 token 发往选中专家所在卡，combine 送回结果</text>\n<text x=\"36\" y=\"174\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 每个 MoE 层两次 All-to-All；专家跨机时走 IB，极易成瓶颈</text>\n<text x=\"36\" y=\"198\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 依赖 router 输出（先知道 token 去哪），依赖链紧，overlap 较难</text>\n</svg>\n"}, {"title": "机制与用途", "type": "text", "body": "用在哪：MoE 的 Expert Parallel。不同专家分布在不同卡上，每个 token 经 router 后要被发往它选中的专家所在的卡——这是一次 All-to-All(dispatch)；专家算完再 All-to-All 送回(combine)。每个 MoE 层两次 All-to-All。"}, {"title": "能否 overlap", "type": "text", "body": "能但更难。依赖 router 输出（先知道每个 token 去哪），依赖链较紧。先进实现（DeepSeek DualPipe、Tutel）会把 dispatch 的 All-to-All 与其他专家的计算或 dense 部分计算重叠，工程复杂度显著高于 AllReduce overlap。"}, {"title": "常见误区", "type": "text", "body": "把 All-to-All 当廉价操作：MoE 跨机 All-to-All 常是训练瓶颈，且专家负载不均会让部分链路拥塞。走 IB 时尤其敏感。"}]}}, {"id": "Expert Parallel", "mastery": 1, "needs_review": false, "next_review": "2026-07-27", "aliases": ["EP", "专家并行"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Expert Parallel（EP，专家并行）：MoE 专用的并行维度，把不同的专家（expert）分布到不同卡上，每个 token 经 router 选择后被路由到它选中的专家所在卡计算。切的是“专家”。"}, {"title": "关键图：机制", "type": "svg", "body": "<svg viewBox=\"0 0 680 220\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Expert Parallel</title><desc>EP：不同专家放不同卡，token 经 router 用 All-to-All 路由到专家所在卡。</desc>\n<defs><marker id=\"ep1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\"/></marker></defs>\n<text x=\"20\" y=\"24\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Expert Parallel：切专家，All-to-All 路由 token</text>\n<rect x=\"20\" y=\"52\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"80\" y=\"71\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">tokens + router</text>\n<line x1=\"140\" y1=\"67\" x2=\"180\" y2=\"67\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ep1)\"/><text x=\"205\" y=\"60\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">All-to-All</text><text x=\"205\" y=\"74\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">dispatch</text>\n<rect x=\"240\" y=\"44\" width=\"120\" height=\"26\" rx=\"5\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"300\" y=\"61\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#26215C\" text-anchor=\"middle\">卡0: 专家 E0,E1</text>\n<rect x=\"240\" y=\"76\" width=\"120\" height=\"26\" rx=\"5\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"300\" y=\"93\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#26215C\" text-anchor=\"middle\">卡1: 专家 E2,E3</text>\n<line x1=\"360\" y1=\"67\" x2=\"400\" y2=\"67\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#ep1)\"/><text x=\"425\" y=\"60\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">All-to-All</text><text x=\"425\" y=\"74\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#5F5E5A\" text-anchor=\"middle\">combine</text>\n<rect x=\"460\" y=\"52\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"520\" y=\"71\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#412402\" text-anchor=\"middle\">输出</text>\n<rect x=\"20\" y=\"120\" width=\"620\" height=\"84\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/>\n<text x=\"36\" y=\"144\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">要点</text>\n<text x=\"36\" y=\"168\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• MoE 专用：不同专家分散到不同卡，靠两次 All-to-All(dispatch/combine)路由 token</text>\n<text x=\"36\" y=\"192\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">• 专家负载不均、跨机 All-to-All 是主要瓶颈；常与 FSDP(切dense) 组合</text>\n</svg>\n"}, {"title": "机制", "type": "text", "body": "每个 MoE 层：router 为每个 token 打分选 top-k 专家 → 一次 All-to-All(dispatch) 把 token 发往对应专家所在卡 → 专家前向 → 一次 All-to-All(combine) 把结果送回原位置。dense 部分通常仍用 FSDP/DP 分担。"}, {"title": "能否 overlap", "type": "text", "body": "能但复杂：dispatch 依赖 router 输出，依赖链紧。DualPipe/Tutel 等会把 All-to-All 与其他专家或 dense 计算重叠。"}, {"title": "常见误区", "type": "text", "body": "专家负载不均是核心难题：热门专家所在卡过载、冷门专家闲置，且跨机 All-to-All 昂贵，需要负载均衡损失和容量因子来缓解。"}]}}, {"id": "Virtual Pipeline Parallelism", "mastery": 1, "needs_review": false, "next_review": "2026-07-28", "aliases": ["VPP", "虚拟流水线并行", "Interleaved Pipeline Parallelism"], "group": "parallelism", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "VPP（Virtual Pipeline Parallelism，虚拟流水线并行）不是增加 GPU 数，而是把每个物理 pipeline stage 上的连续层再切成 v 个更小的 model chunks，让同一张 GPU 在调度上扮演多个逻辑 stage，并用 interleaved 1F1B 把这些 chunk 与不同 microbatch 的前后向交错执行。理想情况下，pipeline bubble 相对普通 1F1B 缩小约 v 倍；代价是 P2P 通信次数/总量约增加 v 倍、调度更复杂，并且收益依赖 stage 均衡和通信能被隐藏。"}, {"title": "系统位置：VPP 解决什么", "type": "text", "body": "普通 Pipeline Parallelism（PP）把模型按层切成 p 个物理 stage，每张 GPU 只负责一个连续层块。即使使用内存友好的 1F1B，流水线启动时仍要 warm-up、结束时仍要 cool-down，因此存在 bubble。VPP 不改变模型数学结果、不改变物理 GPU 数、不替代 TP/DP/FSDP；它是在 PP 内部进一步细化 stage 并优化调度，主要解决流水线粒度太粗导致的 bubble。"}, {"title": "关键图：普通 PP 与 VPP 的层映射", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>普通 PP 与 VPP 层映射对比</title><desc>以 16 层、4 个物理 stage、每卡 2 个 model chunks 为例，对比连续层切分与交错虚拟流水线切分。</desc><defs><marker id=\"arrowv1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">16 层模型、4 个物理 stage：普通 PP vs VPP(v=2)</text><text x=\"40\" y=\"62\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#185FA5\">普通 PP：每张 GPU 只持有一个连续层块</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"78\" width=\"130\" height=\"58\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"105\" y=\"99\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 0</text><text x=\"105\" y=\"119\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L0–L3</text><rect x=\"196\" y=\"78\" width=\"130\" height=\"58\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"261\" y=\"99\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 1</text><text x=\"261\" y=\"119\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L4–L7</text><rect x=\"352\" y=\"78\" width=\"130\" height=\"58\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"417\" y=\"99\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 2</text><text x=\"417\" y=\"119\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L8–L11</text><rect x=\"508\" y=\"78\" width=\"130\" height=\"58\" rx=\"8\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"573\" y=\"99\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 3</text><text x=\"573\" y=\"119\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L12–L15</text><line x1=\"170\" y1=\"107\" x2=\"194\" y2=\"107\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowv1)\"/><line x1=\"326\" y1=\"107\" x2=\"350\" y2=\"107\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowv1)\"/><line x1=\"482\" y1=\"107\" x2=\"506\" y2=\"107\" stroke=\"#888780\" stroke-width=\"1.5\" marker-end=\"url(#arrowv1)\"/></g><text x=\"40\" y=\"180\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">VPP：每张 GPU 持有 v=2 个不连续 model chunks</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"196\" width=\"130\" height=\"112\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"105\" y=\"218\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">GPU 0</text><rect x=\"54\" y=\"230\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"105\" y=\"248\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 0: L0–L1</text><rect x=\"54\" y=\"266\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"105\" y=\"284\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 4: L8–L9</text><rect x=\"196\" y=\"196\" width=\"130\" height=\"112\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"261\" y=\"218\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">GPU 1</text><rect x=\"210\" y=\"230\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"261\" y=\"248\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 1: L2–L3</text><rect x=\"210\" y=\"266\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"261\" y=\"284\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 5: L10–L11</text><rect x=\"352\" y=\"196\" width=\"130\" height=\"112\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"417\" y=\"218\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">GPU 2</text><rect x=\"366\" y=\"230\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"417\" y=\"248\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 2: L4–L5</text><rect x=\"366\" y=\"266\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"417\" y=\"284\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 6: L12–L13</text><rect x=\"508\" y=\"196\" width=\"130\" height=\"112\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"573\" y=\"218\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\" text-anchor=\"middle\">GPU 3</text><rect x=\"522\" y=\"230\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"573\" y=\"248\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 3: L6–L7</text><rect x=\"522\" y=\"266\" width=\"102\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"573\" y=\"284\" font-size=\"12\" fill=\"#04342C\" text-anchor=\"middle\">chunk 7: L14–L15</text></g><rect x=\"40\" y=\"334\" width=\"598\" height=\"76\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"58\" y=\"358\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">逻辑前向顺序仍然不变</text><text x=\"58\" y=\"382\" font-family=\"sans-serif\" font-size=\"12.5\" fill=\"#2C2C2A\">GPU0/chunk0 → GPU1/chunk1 → GPU2/chunk2 → GPU3/chunk3 → GPU0/chunk4 → … → GPU3/chunk7</text><text x=\"58\" y=\"402\" font-family=\"sans-serif\" font-size=\"11.5\" fill=\"#5F5E5A\">“virtual”指一张物理 GPU 扮演多个逻辑 stage；GPU 数没变，参数总量也没变。</text></svg>"}, {"title": "模型如何切分", "type": "text", "body": "统一例子：L=16 个 Transformer layers，p=4 个物理 pipeline stages，v=2 个 model chunks/GPU。普通 PP 每卡 4 层：GPU0=L0–L3，GPU1=L4–L7，GPU2=L8–L11，GPU3=L12–L15。VPP 把每卡 4 层再分成两个 2 层 chunk：GPU0 持 L0–L1 和 L8–L9；GPU1 持 L2–L3 和 L10–L11；GPU2 持 L4–L5 和 L12–L13；GPU3 持 L6–L7 和 L14–L15。逻辑网络顺序没有改变，只是物理 GPU 0 在逻辑上同时扮演 virtual stage 0 和 4。"}, {"title": "深度补充：结论与统一假设", "type": "text", "body": "普通 PP 把模型切成 p 个连续物理 stage；1F1B 通过 warm-up/steady/cool-down 交错前后向，主要减少 Activation 生命周期，经典理论 Bubble 与 GPipe 相同；VPP 把每个物理 stage 切成 v 个 chunks，使不可避免空档的粒度从完整 stage 时间缩小到 chunk 时间，Bubble 理想缩小 v 倍，但 Useful 不变。统一例子：p=4,m=8,v=2,t_f=t_b=1。"}, {"title": "普通 PP 结构与双向数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 410\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>普通 Pipeline Parallelism 的模型切分与数据流</title><desc>以16层Transformer、4个物理stage为例，展示每张GPU持有连续4层，前向激活从GPU0流向GPU3，反向激活梯度从GPU3返回GPU0。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">普通 PP：模型沿深度切成 4 个连续 stage</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"58\" width=\"130\" height=\"104\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"105\" y=\"80\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 0 / stage 0</text><text x=\"105\" y=\"103\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L0–L3</text><text x=\"105\" y=\"126\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">Embedding / early layers</text><rect x=\"197\" y=\"58\" width=\"130\" height=\"104\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"262\" y=\"80\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 1 / stage 1</text><text x=\"262\" y=\"103\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L4–L7</text><text x=\"262\" y=\"126\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">middle layers</text><rect x=\"354\" y=\"58\" width=\"130\" height=\"104\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"419\" y=\"80\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 2 / stage 2</text><text x=\"419\" y=\"103\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L8–L11</text><text x=\"419\" y=\"126\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">middle layers</text><rect x=\"511\" y=\"58\" width=\"129\" height=\"104\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"575\" y=\"80\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 3 / stage 3</text><text x=\"575\" y=\"103\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">L12–L15</text><text x=\"575\" y=\"126\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">LM head / loss</text></g><path d=\"M170 92 L193 92\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M327 92 L350 92\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M484 92 L507 92\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"340\" y=\"190\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">Forward：发送 activation [microbatch, sequence, hidden]</text><path d=\"M105 214 L575 214\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"340\" y=\"252\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#854F0B\" text-anchor=\"middle\">Backward：发送 activation gradient，方向相反</text><path d=\"M575 276 L105 276\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"310\" width=\"600\" height=\"68\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"60\" y=\"334\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">Microbatch 流水化</text><text x=\"60\" y=\"355\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">MB0 离开 stage 0 后，stage 0 可立刻处理 MB1；不同 stage 同时计算不同 microbatch。</text></svg>"}, {"title": "普通 PP、Microbatch 与 Bubble 来源", "type": "text", "body": "16层模型切为GPU0:L0-L3、GPU1:L4-L7、GPU2:L8-L11、GPU3:L12-L15。Forward 发送边界 Activation，Backward 反向发送 Activation Gradient。流水线开始时后级 stage 没有输入，结束时梯度还要逐级返回，因此分别产生 p-1 个 forward 和 p-1 个 backward 依赖间隔。"}, {"title": "1F1B 的三阶段运行", "type": "text", "body": "1F1B 分为 Warm-up、Steady State、Cool-down。Stage s 的 warm-up 数近似 w_s=p-s-1；p=4 时各 stage 分别为3/2/1/0。Steady State 中一个较新 microbatch 的 Forward 与一个较早 microbatch 的 Backward 交替；完成 Backward 后即可释放对应 Activation。"}, {"title": "普通 1F1B 精确时隙图：p=4,m=8", "type": "svg", "body": "<svg viewBox=\"0 0 680 330\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>p=4 m=8 的普通 1F1B 精确时隙图</title><desc>四个stage在22个单位时隙中的前向、反向和空闲分布。每个stage有16个有效计算时隙和6个bubble时隙。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"26\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">普通 1F1B：p=4，m=8，t_f=t_b=1 slot</text><g font-family=\"sans-serif\" font-size=\"11\" fill= \" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"227\" y=\"18\" fill=\"#633806\">B2</text><rect x=\"240\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"251\" y=\"18\" fill=\"#0C447C\">F4</text><rect x=\"264\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"275\" y=\"18\" fill=\"#633806\">B3</text><rect x=\"288\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"299\" y=\"18\" fill=\"#0C447C\">F5</text><rect x=\"312\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"323\" y=\"18\" fill=\"#633806\">B4</text><rect x=\"336\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"347\" y=\"18\" fill=\"#0C447C\">F6</text><rect x=\"360\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"371\" y=\"18\" fill=\"#633806\">B5</text><rect x=\"384\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"395\" y=\"18\" fill=\"#0C447C\">F7</text><rect x=\"408\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"419\" y=\"18\" fill=\"#633806\">B6</text><rect x=\"432\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\"/><rect x=\"456\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"467\" y=\"18\" fill=\"#633806\">B7</text><rect x=\"480\" y=\"0\" width=\"46\" height=\"28\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\"/></g><g transform=\"translate(95 182)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"28\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\"/><rect x=\"72\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"83\" y=\"18\" fill=\"#0C447C\">F0</text><rect x=\"96\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"107\" y=\"18\" fill=\"#633806\">B0</text><rect x=\"120\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"131\" y=\"18\" fill=\"#0C447C\">F1</text><rect x=\"144\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"155\" y=\"18\" fill=\"#633806\">B1</text><rect x=\"168\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"179\" y=\"18\" fill=\"#0C447C\">F2</text><rect x=\"192\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"203\" y=\"18\" fill=\"#633806\">B2</text><rect x=\"216\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"227\" y=\"18\" fill=\"#0C447C\">F3</text><rect x=\"240\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"251\" y=\"18\" fill=\"#633806\">B3</text><rect x=\"264\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"275\" y=\"18\" fill=\"#0C447C\">F4</text><rect x=\"288\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"299\" y=\"18\" fill=\"#633806\">B4</text><rect x=\"312\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"323\" y=\"18\" fill=\"#0C447C\">F5</text><rect x=\"336\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"347\" y=\"18\" fill=\"#633806\">B5</text><rect x=\"360\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"371\" y=\"18\" fill=\"#0C447C\">F6</text><rect x=\"384\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"395\" y=\"18\" fill=\"#633806\">B6</text><rect x=\"408\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\"/><text x=\"419\" y=\"18\" fill=\"#0C447C\">F7</text><rect x=\"432\" y=\"0\" width=\"22\" height=\"28\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\"/><text x=\"443\" y=\"18\" fill=\"#633806\">B7</text><rect x=\"456\" y=\"0\" width=\"70\" height=\"28\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\"/></g></g><rect x=\"40\" y=\"238\" width=\"600\" height=\"64\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"58\" y=\"260\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0C447C\">蓝色 F：前向</text><text x=\"158\" y=\"260\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">橙色 B：反向</text><text x=\"268\" y=\"260\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">灰色：bubble / idle</text><text x=\"58\" y=\"284\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">每个 stage：16 个有效槽 + 6 个空闲槽；总长度 22。利用率 = 16/22 = 72.73%。</text></svg>"}, {"title": "普通 PP Bubble 公式推导", "type": "formula", "body": "T_useful=m(t_f+t_b)。Forward Fill=(p-1)t_f，Backward Drain=(p-1)t_b，所以 T_bubble=(p-1)(t_f+t_b)，T_total=(m+p-1)(t_f+t_b)。Bubble/Useful=(p-1)/m；Bubble/Actual=(p-1)/(m+p-1)；Utilization=m/(m+p-1)。p=4,m=8,t_f=t_b=1 时 Useful=16、Bubble=6、Total=22、Bubble/Actual=27.27%、利用率=72.73%。"}, {"title": "为什么 GPipe 与普通 1F1B Bubble 相同", "type": "text", "body": "1F1B 提前开始 Backward，缩短 Activation 生命周期，使保存量从约 O(m) 降到 O(p)；但 Forward 仍要穿过 p-1 个 stage、Backward 仍要返回 p-1 个 stage，首尾依赖长度不变，所以经典理想 Bubble 与 GPipe 相同。"}, {"title": "VPP 分块映射与 Bubble 缩减", "type": "svg", "body": "<svg viewBox=\"0 0 680 500\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>VPP 的模型分块与 Bubble 缩减</title><desc>以p=4、m=8、v=2为例，展示每张GPU持有两个不连续model chunk，逻辑前向路径跨8个虚拟stage；有效计算仍为16个单位，bubble由6降到3，总时间由22降到19。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">VPP(v=2)：每张物理 GPU 扮演两个虚拟 stage</text><g font-family=\"sans-serif\"><rect x=\"40\" y=\"56\" width=\"130\" height=\"94\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"105\" y=\"78\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 0</text><text x=\"105\" y=\"101\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">chunk 0: L0–L1</text><text x=\"105\" y=\"123\" font-size=\"12\" fill=\"#534AB7\" text-anchor=\"middle\">chunk 4: L8–L9</text><rect x=\"197\" y=\"56\" width=\"130\" height=\"94\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"262\" y=\"78\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 1</text><text x=\"262\" y=\"101\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">chunk 1: L2–L3</text><text x=\"262\" y=\"123\" font-size=\"12\" fill=\"#534AB7\" text-anchor=\"middle\">chunk 5: L10–L11</text><rect x=\"354\" y=\"56\" width=\"130\" height=\"94\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"419\" y=\"78\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 2</text><text x=\"419\" y=\"101\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">chunk 2: L4–L5</text><text x=\"419\" y=\"123\" font-size=\"12\" fill=\"#534AB7\" text-anchor=\"middle\">chunk 6: L12–L13</text><rect x=\"511\" y=\"56\" width=\"129\" height=\"94\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"575\" y=\"78\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">GPU 3</text><text x=\"575\" y=\"101\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">chunk 3: L6–L7</text><text x=\"575\" y=\"123\" font-size=\"12\" fill=\"#534AB7\" text-anchor=\"middle\">chunk 7: L14–L15</text></g><text x=\"40\" y=\"184\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">一个 microbatch 的逻辑前向路径</text><g font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\"><g fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"><rect x=\"40\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/><rect x=\"116\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/><rect x=\"192\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/><rect x=\"268\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/></g><g fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"0.5\"><rect x=\"344\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/><rect x=\"420\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/><rect x=\"496\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/><rect x=\"572\" y=\"200\" width=\"58\" height=\"32\" rx=\"6\"/></g><g fill=\"#0C447C\"><text x=\"69\" y=\"220\">C0/G0</text><text x=\"145\" y=\"220\">C1/G1</text><text x=\"221\" y=\"220\">C2/G2</text><text x=\"297\" y=\"220\">C3/G3</text></g><g fill=\"#3C3489\"><text x=\"373\" y=\"220\">C4/G0</text><text x=\"449\" y=\"220\">C5/G1</text><text x=\"525\" y=\"220\">C6/G2</text><text x=\"601\" y=\"220\">C7/G3</text></g></g><g stroke=\"#5F5E5A\" stroke-width=\"1.2\"><path d=\"M98 216 L112 216\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M174 216 L188 216\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M250 216 L264 216\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M326 216 L340 216\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M402 216 L416 216\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M478 216 L492 216\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M554 216 L568 216\" fill=\"none\" marker-end=\"url(#arrow)\"/></g><text x=\"40\" y=\"274\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#26215C\">相同有效工作，不同 bubble</text><text x=\"40\" y=\"304\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">普通 1F1B</text><rect x=\"130\" y=\"288\" width=\"352\" height=\"28\" rx=\"6\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"306\" y=\"307\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0C447C\" text-anchor=\"middle\">useful = 16</text><rect x=\"482\" y=\"288\" width=\"132\" height=\"28\" rx=\"6\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"548\" y=\"307\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\" text-anchor=\"middle\">bubble = 6</text><text x=\"40\" y=\"348\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#534AB7\">VPP v=2</text><rect x=\"130\" y=\"332\" width=\"352\" height=\"28\" rx=\"6\" fill=\"#CECBF6\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"306\" y=\"351\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#3C3489\" text-anchor=\"middle\">useful = 16（不变）</text><rect x=\"482\" y=\"332\" width=\"66\" height=\"28\" rx=\"6\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"515\" y=\"351\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\" text-anchor=\"middle\">3</text><rect x=\"40\" y=\"390\" width=\"600\" height=\"76\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"58\" y=\"414\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">每个 chunk 时间：t_f/v、t_b/v；物理 GPU 仍做 v 个 chunks，总有效计算不变。</text><text x=\"58\" y=\"436\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">Bubble：6 → 3；总时间：22 → 19；理想加速：22/19 ≈ 1.158，而不是 2×。</text><text x=\"58\" y=\"458\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">代价：逻辑 stage 边界增多，P2P 通信量约增 v 倍；真实收益低于理想值。</text></svg>"}, {"title": "为什么 VPP Useful 不变", "type": "formula", "body": "每个 chunk 的 Forward/Backward 时间约为 t_f/v、t_b/v；每张物理 GPU 仍执行 v 个 chunks，所以每 microbatch 的物理 GPU 有效计算=v(t_f/v+t_b/v)=t_f+t_b。对 m 个 microbatches：T_useful_vpp=m(t_f+t_b)，不变。"}, {"title": "为什么 VPP Bubble 约缩小 v 倍", "type": "formula", "body": "Interleaved 1F1B 用其他 chunk/microbatch 的 ready task 填充大空档，剩余边缘空档以 chunk 时间计：T_bubble_vpp=(p-1)(t_f+t_b)/v。Bubble/Useful=(p-1)/(mv)；Bubble/Actual=(p-1)/(mv+p-1)；Utilization=mv/(mv+p-1)。p=4,m=8,v=2 时 Us
