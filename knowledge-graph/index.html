ll=\"#854F0B\">DDP：相同(tp,pp,cp,ep)分片在dp0..3间AllReduce梯度。</text><text x=\"60\" y=\"535\" font-size=\"11\" fill=\"#854F0B\">FSDP：ReduceScatter梯度、分片Optimizer更新；下一次用参数前AllGather。</text></g><g stroke=\"#888780\" stroke-width=\"1.5\"><path d=\"M340 110 L340 128\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M340 186 L340 204\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M340 280 L340 298\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M340 374 L340 392\" fill=\"none\" marker-end=\"url(#arrow)\"/><path d=\"M340 450 L340 468\" fill=\"none\" marker-end=\"url(#arrow)\"/></g><text x=\"40\" y=\"580\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">同一时刻并非所有通信都串行：TP/CP/EP/DP通信可在不同依赖窗口与计算重叠，但会争用SM、HBM和互联。</text></svg>"}, {"title": "DP/FSDP", "type": "text", "body": "DDP复制模型并切Batch，Backward后同模型Shard在DP组AllReduce；FSDP分片参数/梯度/优化器状态，计算前参数AllGather，Backward后梯度ReduceScatter。DDP适合状态能放单卡；FSDP适合训练状态超单卡。"}, {"title": "TP", "type": "text", "body": "TP使用Column/Row Parallel切Linear、Heads和Hidden，单层参数与计算约降1/TP，但每层高频通信且下一算子依赖紧；适合单层放不下和大Hidden，优先机内NVLink。"}, {"title": "PP/VPP", "type": "text", "body": "PP把Layers分Stage，以Microbatch和1F1B流水，边界P2P传Activation/Gradient；VPP再切Chunks减少Bubble但增加P2P。适合深模型和跨节点模型扩展。"}, {"title": "CP", "type": "text", "body": "CP把输入和全部Activation沿Sequence切分，非Attention模块本地执行；Attention本地Q需要完整KV，通过Ring/AllGather交换，Backward归约dKV。适合长上下文Activation OOM，与只切部分非Attention激活的SP不同。"}, {"title": "EP", "type": "text", "body": "EP把MoE Experts分到不同Rank；Router后Token通过Dispatch All-to-All到Expert Owner，Grouped GEMM后Combine All-to-All返回。适合MoE Expert参数扩展，主要风险是动态负载和跨节点A2A。"}, {"title": "选择原则", "type": "text", "body": "先判断单层→TP、总深度→PP、长序列→CP、MoE专家→EP、训练状态→FSDP；满足显存后尽量最小化模型并行并增加DP。结合拓扑与Profiler调整，避免小GEMM和暴露通信。"}, {"title": "配置示例", "type": "code", "body": "--tensor-model-parallel-size 2\n--pipeline-model-parallel-size 2\n--context-parallel-size 2\n--expert-model-parallel-size 2\n--num-experts 4\n--moe-router-topk 2\n--sequence-parallel\n--moe-grouped-gemm\n--moe-token-dispatcher-type alltoall\n--use-megatron-fsdp\n--data-parallel-sharding-strategy optim_grads_params"}]}}, {"id": "Numerical Precision", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["数值精度", "大模型精度"], "group": "precision", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "低精度减少张量字节数、HBM流量和通信量，并可提高Tensor Core吞吐；代价是范围或精度下降。现代LLM使用混合精度：低精度做大GEMM，高精度做累加、敏感算子和优化器状态。"}, {"title": "BF32术语澄清", "type": "text", "body": "BF32不是主流PyTorch/CUDA统一标准；通常应区分FP32、TF32、BF16、FP16、FP8。"}, {"title": "位布局与范围精度", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>常见浮点格式的符号位、指数位和尾数位对比</title><desc>展示FP32、TF32、BF16、FP16、FP8 E4M3和E5M2的位布局，并说明指数位主导动态范围，尾数位主导相对精度。</desc><text x=\"40\" y=\"30\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">位数怎么分，决定“装得多大”和“刻得多细”</text><text x=\"40\" y=\"53\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">指数位 → 动态范围；尾数位 → 相对精度；符号位 → 正负</text><g font-family=\"sans-serif\"><text x=\"40\" y=\"91\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">格式</text><text x=\"118\" y=\"91\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">位布局</text><text x=\"485\" y=\"91\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">工程直觉</text><g transform=\"translate(0,106)\"><text x=\"40\" y=\"18\" font-size=\"13\" fill=\"#2C2C2A\">FP32</text><rect x=\"118\" y=\"0\" width=\"18\" height=\"26\" rx=\"4\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#501313\">S</text><rect x=\"140\" y=\"0\" width=\"112\" height=\"26\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"196\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">Exponent 8</text><rect x=\"256\" y=\"0\" width=\"205\" height=\"26\" rx=\"4\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"358\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#04342C\">Mantissa 23</text><text x=\"485\" y=\"18\" font-size=\"12\" fill=\"#5F5E5A\">范围大，精度高，4 B</text></g><g transform=\"translate(0,151)\"><text x=\"40\" y=\"18\" font-size=\"13\" fill=\"#2C2C2A\">TF32</text><rect x=\"118\" y=\"0\" width=\"18\" height=\"26\" rx=\"4\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#501313\">S</text><rect x=\"140\" y=\"0\" width=\"112\" height=\"26\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"196\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">Exponent 8</text><rect x=\"256\" y=\"0\" width=\"90\" height=\"26\" rx=\"4\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"301\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#04342C\">Mantissa 10</text><rect x=\"350\" y=\"0\" width=\"111\" height=\"26\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"405\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5F5E5A\">计算模式</text><text x=\"485\" y=\"18\" font-size=\"12\" fill=\"#5F5E5A\">FP32存储，GEMM截尾</text></g><g transform=\"translate(0,196)\"><text x=\"40\" y=\"18\" font-size=\"13\" fill=\"#2C2C2A\">BF16</text><rect x=\"118\" y=\"0\" width=\"18\" height=\"26\" rx=\"4\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#501313\">S</text><rect x=\"140\" y=\"0\" width=\"112\" height=\"26\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"196\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">Exponent 8</text><rect x=\"256\" y=\"0\" width=\"63\" height=\"26\" rx=\"4\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"287\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#04342C\">Mantissa 7</text><rect x=\"323\" y=\"0\" width=\"138\" height=\"26\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"392\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5F5E5A\">总计16 bit</text><text x=\"485\" y=\"18\" font-size=\"12\" fill=\"#5F5E5A\">FP32范围，精度较粗</text></g><g transform=\"translate(0,241)\"><text x=\"40\" y=\"18\" font-size=\"13\" fill=\"#2C2C2A\">FP16</text><rect x=\"118\" y=\"0\" width=\"18\" height=\"26\" rx=\"4\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#501313\">S</text><rect x=\"140\" y=\"0\" width=\"70\" height=\"26\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"175\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">Exp 5</text><rect x=\"214\" y=\"0\" width=\"90\" height=\"26\" rx=\"4\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"259\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#04342C\">Mantissa 10</text><rect x=\"308\" y=\"0\" width=\"153\" height=\"26\" rx=\"4\" fill=\"#F1EFE8\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"384\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#5F5E5A\">总计16 bit</text><text x=\"485\" y=\"18\" font-size=\"12\" fill=\"#5F5E5A\">更细，但范围窄</text></g><g transform=\"translate(0,286)\"><text x=\"40\" y=\"18\" font-size=\"13\" fill=\"#2C2C2A\">FP8 E4M3</text><rect x=\"118\" y=\"0\" width=\"18\" height=\"26\" rx=\"4\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#501313\">S</text><rect x=\"140\" y=\"0\" width=\"58\" height=\"26\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"169\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">E4</text><rect x=\"202\" y=\"0\" width=\"46\" height=\"26\" rx=\"4\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"225\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#04342C\">M3</text><rect x=\"252\" y=\"0\" width=\"209\" height=\"26\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"356\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">需scale，通常前向</text><text x=\"485\" y=\"18\" font-size=\"12\" fill=\"#5F5E5A\">更精细，最大约448</text></g><g transform=\"translate(0,331)\"><text x=\"40\" y=\"18\" font-size=\"13\" fill=\"#2C2C2A\">FP8 E5M2</text><rect x=\"118\" y=\"0\" width=\"18\" height=\"26\" rx=\"4\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#501313\">S</text><rect x=\"140\" y=\"0\" width=\"70\" height=\"26\" rx=\"4\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"175\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">E5</text><rect x=\"214\" y=\"0\" width=\"34\" height=\"26\" rx=\"4\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"231\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#04342C\">M2</text><rect x=\"252\" y=\"0\" width=\"209\" height=\"26\" rx=\"4\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"356\" y=\"17\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">需scale，常用于梯度</text><text x=\"485\" y=\"18\" font-size=\"12\" fill=\"#5F5E5A\">范围更大，最大57344</text></g></g><rect x=\"40\" y=\"386\" width=\"600\" height=\"28\" rx=\"8\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"404\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2C2C2A\">BF16与FP16：同为2 Byte；BF16保范围，FP16保更多有效数字</text></svg>"}, {"title": "格式总表", "type": "text", "body": "FP32=1/8/23；TF32保8位指数、约10位尾数用于矩阵计算；BF16=1/8/7；FP16=1/5/10；FP8分E4M3与E5M2；INT8/INT4需要Scale；FP4训练依赖微块Scaling与专用Recipe。"}, {"title": "混合精度训练数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 450\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>大模型混合精度训练的数据与状态流</title><desc>展示FP32或BF16权重如何进入低精度前向，损失缩放如何保护FP16梯度，以及FP32累加和优化器状态如何保持稳定。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">低精度负责大吞吐，较高精度负责长期稳定</text><rect x=\"40\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"127\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">模型状态</text><text x=\"127\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">BF16/FP16参数</text><text x=\"127\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">FP32优化器状态</text><line x1=\"215\" y1=\"81\" x2=\"252\" y2=\"81\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"50\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">前向计算</text><text x=\"340\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">BF16 / FP16 / FP8 GEMM</text><text x=\"340\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加或安全归约</text><line x1=\"425\" y1=\"81\" x2=\"462\" y2=\"81\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"465\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"552\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">敏感算子</text><text x=\"552\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">Softmax / Norm / Loss</text><text x=\"552\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#854F0B\">通常提升到FP32</text><path d=\"M552 112V151H426\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"135\" width=\"170\" height=\"58\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"156\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">Loss Scaling</text><text x=\"340\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">FP16常用；BF16通常可省</text><path d=\"M340 193V227\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"230\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">反向计算</text><text x=\"340\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">低精度梯度计算</text><text x=\"340\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加/归约</text><line x1=\"255\" y1=\"261\" x2=\"218\" y2=\"261\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"230\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#501313\">Unscale与检查</text><text x=\"127\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">检测Inf/NaN</text><text x=\"127\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\">溢出则跳过更新</text><path d=\"M127 292V331H255\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"315\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"340\" y=\"335\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Optimizer Step</text><text x=\"340\" y=\"356\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">FP32 Adam m/v</text><text x=\"340\" y=\"372\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">更新参数或Master Weight</text><path d=\"M255 346H146V113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"405\" width=\"600\" height=\"28\" rx=\"8\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"423\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">“训练用BF16”不等于参数、梯度、优化器、累加器、所有算子都只用BF16</text></svg>"}, {"title": "显存与状态口径", "type": "svg", "body": "<svg viewBox=\"0 0 680 405\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>不同精度对存储带宽和训练状态的影响</title><desc>比较FP32、16位、FP8和4位的每元素字节数，并说明混合精度Adam训练中优化器状态通常仍为FP32，因此总显存不会按计算精度同比下降。</desc><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">降低位宽，首先减少张量字节数</text><text x=\"40\" y=\"52\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">相对FP32的原始存储与理想带宽压力；不等于端到端训练加速比</text><g font-family=\"sans-serif\"><text x=\"40\" y=\"87\" font-size=\"13\" fill=\"#2C2C2A\">FP32</text><rect x=\"105\" y=\"71\" width=\"480\" height=\"24\" rx=\"6\" fill=\"#185FA5\"/><text x=\"595\" y=\"87\" font-size=\"12\" fill=\"#0C447C\">4 B · 100%</text><text x=\"40\" y=\"127\" font-size=\"13\" fill=\"#2C2C2A\">BF16/FP16</text><rect x=\"105\" y=\"111\" width=\"240\" height=\"24\" rx=\"6\" fill=\"#378ADD\"/><text x=\"355\" y=\"127\" font-size=\"12\" fill=\"#0C447C\">2 B · 50%</text><text x=\"40\" y=\"167\" font-size=\"13\" fill=\"#2C2C2A\">FP8/INT8</text><rect x=\"105\" y=\"151\" width=\"120\" height=\"24\" rx=\"6\" fill=\"#85B7EB\"/><text x=\"235\" y=\"167\" font-size=\"12\" fill=\"#0C447C\">1 B · 25%</text><text x=\"40\" y=\"207\" font-size=\"13\" fill=\"#2C2C2A\">FP4/INT4</text><rect x=\"105\" y=\"191\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#B5D4F4\"/><text x=\"175\" y=\"207\" font-size=\"12\" fill=\"#0C447C\">0.5 B · 12.5%</text></g><text x=\"40\" y=\"250\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#26215C\">但混合精度Adam仍有较高精度状态</text><rect x=\"40\" y=\"270\" width=\"600\" height=\"64\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><rect x=\"52\" y=\"283\" width=\"72\" height=\"38\" rx=\"6\" fill=\"#B5D4F4\"/><text x=\"88\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">参数</text><text x=\"88\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">2 B</text><rect x=\"128\" y=\"283\" width=\"72\" height=\"38\" rx=\"6\" fill=\"#85B7EB\"/><text x=\"164\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">梯度</text><text x=\"164\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">2 B</text><rect x=\"204\" y=\"283\" width=\"112\" height=\"38\" rx=\"6\" fill=\"#FAC775\"/><text x=\"260\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">Master weight</text><text x=\"260\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">4 B（可选）</text><rect x=\"320\" y=\"283\" width=\"142\" height=\"38\" rx=\"6\" fill=\"#EF9F27\"/><text x=\"391\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">Adam first moment</text><text x=\"391\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">4 B</text><rect x=\"466\" y=\"283\" width=\"162\" height=\"38\" rx=\"6\" fill=\"#BA7517\"/><text x=\"547\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">Adam second moment</text><text x=\"547\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">4 B</text><rect x=\"40\" y=\"354\" width=\"600\" height=\"32\" rx=\"8\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"374\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"#412402\">经典口径：2+2+4+4+4 = 16 Byte/参数；仅把GEMM降到FP8，不会自动变成8 Byte/参数</text></svg>"}, {"title": "7B权重手算", "type": "formula", "body": "FP32=28GB；BF16/FP16=14GB；FP8/INT8=7GB；4bit=3.5GB。经典混合精度Adam按16Byte/参数约112GB，仅指参数相关训练状态。"}, {"title": "Activation手算", "type": "formula", "body": "[B=2,S=4096,H=8192]共67,108,864元素：FP32=256MiB，16bit=128MiB，FP8=64MiB。"}, {"title": "性能影响", "type": "text", "body": "低位宽减少HBM与通信payload，并提高支持格式的Tensor Core吞吐；端到端收益受Amdahl定律、非GEMM算子、Cast/Scale、通信和Shape约束限制。"}, {"title": "稳定性风险", "type": "text", "body": "主要风险是Overflow、Underflow、Rounding、Accumulation Error。需监控Loss、Grad Norm、Inf/NaN、Loss Scale、Amax、Saturation与逐层误差。"}, {"title": "训练与推理选型", "type": "text", "body": "预训练默认BF16；FP16需GradScaler；Hopper/Blackwell可评估FP8；推理常用BF16/FP16、FP8/INT8或INT4 Weight-Only；FP4依赖新硬件与Recipe。"}, {"title": "关键误区", "type": "text", "body": "BF16不是全面比FP16精确；TF32不节省FP32存储；FP8不自动让总训练显存减半；INT4不保证端到端快4倍；FP32累加也不能恢复输入量化丢失的信息。"}]}}, {"id": "Mixed Precision Training", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["混合精度训练", "AMP"], "group": "precision", "content": {"sections": [{"title": "核心机制", "type": "text", "body": "混合精度按算子和状态分配dtype，不是把模型整体cast到一种低精度。"}, {"title": "训练数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 450\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>大模型混合精度训练的数据与状态流</title><desc>展示FP32或BF16权重如何进入低精度前向，损失缩放如何保护FP16梯度，以及FP32累加和优化器状态如何保持稳定。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">低精度负责大吞吐，较高精度负责长期稳定</text><rect x=\"40\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"127\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">模型状态</text><text x=\"127\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">BF16/FP16参数</text><text x=\"127\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">FP32优化器状态</text><line x1=\"215\" y1=\"81\" x2=\"252\" y2=\"81\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"50\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">前向计算</text><text x=\"340\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">BF16 / FP16 / FP8 GEMM</text><text x=\"340\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加或安全归约</text><line x1=\"425\" y1=\"81\" x2=\"462\" y2=\"81\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"465\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"552\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">敏感算子</text><text x=\"552\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">Softmax / Norm / Loss</text><text x=\"552\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#854F0B\">通常提升到FP32</text><path d=\"M552 112V151H426\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"135\" width=\"170\" height=\"58\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"156\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">Loss Scaling</text><text x=\"340\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">FP16常用；BF16通常可省</text><path d=\"M340 193V227\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"230\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">反向计算</text><text x=\"340\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">低精度梯度计算</text><text x=\"340\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加/归约</text><line x1=\"255\" y1=\"261\" x2=\"218\" y2=\"261\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"230\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#501313\">Unscale与检查</text><text x=\"127\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">检测Inf/NaN</text><text x=\"127\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\">溢出则跳过更新</text><path d=\"M127 292V331H255\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"315\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"340\" y=\"335\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Optimizer Step</text><text x=\"340\" y=\"356\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">FP32 Adam m/v</text><text x=\"340\" y=\"372\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">更新参数或Master Weight</text><path d=\"M255 346H146V113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"405\" width=\"600\" height=\"28\" rx=\"8\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"423\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">“训练用BF16”不等于参数、梯度、优化器、累加器、所有算子都只用BF16</text></svg>"}, {"title": "Loss Scaling", "type": "formula", "body": "L_scaled=L×S；g_scaled=S×g；更新前g=g_scaled÷S。FP16常用动态Loss Scaling，BF16通常可省。"}, {"title": "精度角色", "type": "text", "body": "GEMM输入常为BF16/FP16/FP8；Accumulator、Softmax、Norm、Loss和Adam m/v常为FP32。"}, {"title": "PyTorch接口", "type": "code", "body": "with torch.autocast(device_type='cuda', dtype=torch.bfloat16):\n    loss = loss_fn(model(x), target)\nloss.backward()\noptimizer.step()"}, {"title": "边界", "type": "text", "body": "内部累加精度取决于Kernel和后端；dtype标签不足以描述整个计算路径。"}]}}, {"id": "BF16", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["bfloat16", "Brain Floating Point 16"], "group": "precision", "content": {"sections": [{"title": "格式", "type": "formula", "body": "1 sign + 8 exponent + 7 mantissa；2Byte；最大值约3.39e38；1附近间隔约0.0078125。"}, {"title": "为什么适合LLM", "type": "text", "body": "动态范围接近FP32，不易发生FP16式大范围溢出或小梯度下溢，通常无需Loss Scaling。"}, {"title": "代价", "type": "text", "body": "尾数少，小更新和局部差异更容易舍入；累加、Norm、Softmax和Optimizer仍常保留FP32。"}, {"title": "与FP16", "type": "text", "body": "BF16范围更大；FP16在1附近更精细。二者同为2Byte。"}, {"title": "适用", "type": "text", "body": "现代Ampere及以后GPU的大模型预训练、微调与Serving基线。"}]}}, {"id": "FP16", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["Half Precision"], "group": "precision", "content": {"sections": [{"title": "格式", "type": "formula", "body": "1 sign + 5 exponent + 10 mantissa；2Byte；最大65504；最小正规数约6.10e-5。"}, {"title": "主要风险", "type": "text", "body": "大Activation/Gradient易Overflow，小Gradient易Underflow为0。"}, {"title": "Loss Scaling", "type": "formula", "body": "先放大Loss和Gradient，再在更新前Unscale；遇到Inf/NaN降低Scale并跳过更新。"}, {"title": "优势", "type": "text", "body": "2Byte、Tensor Core成熟、在1附近尾数精度优于BF16。"}, {"title": "边界", "type": "text", "body": "BF16预训练模型不应无脑转FP16微调；数值范围可能不兼容。"}]}}, {"id": "FP8 Training", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["FP8混合精度训练", "E4M3/E5M2 Training"], "group": "precision", "content": {"sections": [{"title": "双格式", "type": "text", "body": "E4M3精度相对高、范围小，常用于前向；E5M2范围更大、精度低，常用于梯度。"}, {"title": "Scaling", "type": "formula", "body": "x_fp8=cast(x×scale)；恢复值约为cast_high(x_fp8)÷scale。单一全局Scale无法覆盖各层不同分布。"}, {"title": "Delayed与Current", "type": "text", "body": "Delayed Scaling用历史Amax降低当前遍历开销；Current Scaling更及时；Microscaling用更小块减少Outlier影响。"}, {"title": "性能", "type": "text", "body": "1Byte输入降低HBM与Tensor Core输入带宽，并提高支持硬件的GEMM吞吐；Cast/Scale、同步和回退算子会侵蚀收益。"}, {"title": "监控", "type": "text", "body": "Amax、Saturation、Scale、Inf/NaN、逐层误差、Cast/Scale时间、Kernel覆盖率。"}, {"title": "硬件边界", "type": "text", "body": "常依赖Hopper/Blackwell及Transformer Engine等软件栈；Accumulator精度需按具体Kernel确认。"}]}}, {"id": "Low-Bit Quantization", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["低比特量化", "INT8/INT4 Quantization"], "group": "precision", "content": {"sections": [{"title": "量化公式", "type": "formula", "body": "q=clip(round(x÷scale)+zero_point)；x_hat≈scale×(q−zero_point)。"}, {"title": "粒度", "type": "text", "body": "Per-Tensor、Per-Channel、Per-Group、Per-Token与Per-Block在元数据开销、Outlier适应和Kernel复杂度之间权衡。"}, {"title": "INT8", "type": "text", "body": "常用于Weight+Activation推理、PTQ/QAT、KV Cache和部分通信。"}, {"title": "INT4", "type": "text", "body": "常用于Weight-Only LLM推理，权重约0.5Byte/参数，但需要反量化与Scale。"}, {"title": "FP4", "type": "text", "body": "裸E2M1极粗；NVFP4依赖16值微块Scaling、E4M3 Scale、FP32全局Scale、随机舍入与Hadamard等Recipe。"}, {"title": "性能边界", "type": "text", "body": "压缩比不等于速度比；Decode可能受反量化、GEMV、KV Cache、调度和Kernel覆盖限制。"}]}}, {"id": "CPU-GPU Communication", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["CPU–GPU通信", "Host-Device Data Movement"], "group": "communication", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "CPU适合控制、分支、IO和小任务；GPU适合大规模规则并行。H2D/D2H是两套内存之间的数据搬运，优化顺序是少传、合并、Pinned、异步、Overlap和拓扑绑定。"}, {"title": "CPU-GPU数据路径", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU与GPU的计算、内存和H2D D2H数据路径</title><desc>CPU连接系统DRAM，GPU连接HBM，二者通过PCIe或NVLink C2C等链路通信；H2D和D2H由DMA Copy Engine执行。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">CPU负责控制与复杂逻辑，GPU负责高吞吐并行计算</text><rect x=\"40\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Host / CPU域</text><rect x=\"60\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">CPU Cores</text><text x=\"160\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">低延迟 · 分支 · OS · 调度</text><text x=\"160\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">DataLoader · Python · IO</text><rect x=\"60\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">System DRAM</text><text x=\"160\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">Pageable / Pinned</text><text x=\"160\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">容量大 · NUMA相关</text><text x=\"160\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU直接Load/Store</text><rect x=\"400\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#04342C\">Device / GPU域</text><rect x=\"420\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">SM / Tensor Cores</text><text x=\"520\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高吞吐 · SIMT · GEMM</text><text x=\"520\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">大量线程隐藏延迟</text><rect x=\"420\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">HBM / Device Memory</text><text x=\"520\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">参数 · 激活 · 梯度</text><text x=\"520\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高带宽 · 容量有限</text><text x=\"520\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">GPU Kernel直接访问</text><line x1=\"280\" y1=\"121\" x2=\"397\" y2=\"121\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"339\" y=\"108\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">H2D</text><line x1=\"400\" y1=\"156\" x2=\"283\" y2=\"156\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"341\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">D2H</text><rect x=\"290\" y=\"205\" width=\"100\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"340\" y=\"226\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\">Copy Engine</text><text x=\"340\" y=\"246\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><text x=\"340\" y=\"263\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">异步搬运</text><path d=\"M260 239H288\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M392 239H420\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"329\" width=\"600\" height=\"78\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"351\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">互联链路决定传输上限</text><text x=\"340\" y=\"374\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">独立GPU常走PCIe；Grace Hopper等可走NVLink-C2C；数据中心还可能经NIC/Storage直达GPU</text><text x=\"340\" y=\"394\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">控制路径仍由CPU提交，数据路径可由DMA Engine执行</text></svg>"}, {"title": "CPU与GPU对比", "type": "text", "body": "CPU强调低延迟、复杂控制和系统IO；GPU强调吞吐、SIMT、Tensor Core与HBM。GPU是否值得取决于计算收益能否覆盖H2D+D2H+Launch+Sync。"}, {"title": "Pageable与Pinned", "type": "svg", "body": "<svg viewBox=\"0 0 680 440\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Pageable与Pinned主机内存的H2D路径区别</title><desc>Pageable内存通常先由CPU复制到驱动的Pinned staging缓冲区，再由DMA传到GPU；Pinned内存可以直接作为DMA源，实现更可预测的异步传输。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Pageable多一次Staging；Pinned允许直接DMA</text><text x=\"40\" y=\"67\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Pageable H2D</text><rect x=\"40\" y=\"83\" width=\"150\" height=\"66\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"115\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pageable内存</text><text x=\"115\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">OS可迁移/换页</text><line x1=\"190\" y1=\"116\" x2=\"246\" y2=\"116\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"218\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU Copy</text><rect x=\"250\" y=\"83\" width=\"170\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"335\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">内部Pinned Staging</text><text x=\"335\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#534AB7\">驱动管理 · 行为不透明</text><line x1=\"420\" y1=\"116\" x2=\"476\" y2=\"116\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"448\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><rect x=\"480\" y=\"83\" width=\"160\" height=\"66\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"560\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"560\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">Device Tensor</text><rect x=\"40\" y=\"169\" width=\"600\" height=\"42\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"195\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">代价：额外CPU内存复制、CPU/DRAM带宽、不可控Staging、Overlap可能退化</text><text x=\"40\" y=\"252\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">Pinned H2D</text><rect x=\"40\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"140\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pinned内存</text><text x=\"140\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">物理页锁定 · 地址稳定</text><text x=\"140\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">cudaHostAlloc/Register</text><line x1=\"240\" y1=\"304\" x2=\"436\" y2=\"304\" stroke=\"#0F6E56\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"338\" y=\"289\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#085041\">Copy Engine直接DMA</text><rect x=\"440\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"540\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"540\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">可真正异步入队</text><text x=\"540\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">配合独立Stream重叠</text><rect x=\"40\" y=\"364\" width=\"600\" height=\"54\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"385\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#412402\">Pinned不是越多越好</text><text x=\"340\" y=\"405\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">锁页会减少OS可分页内存；分配/注册昂贵，应使用有限Buffer Pool长期复用</text></svg>"}, {"title": "双缓冲Overlap", "type": "svg", "body": "<svg viewBox=\"0 0 680 420\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU GPU串行执行与双缓冲Copy Compute Overlap时间线</title><desc>对比每批先H2D再计算的串行时间线，以及使用Pinned Memory、独立Copy Stream和双缓冲后，下一批H2D与当前批Compute重叠的流水线。</desc><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">双缓冲把“相加”变成稳态下接近“取最大值”</text><text x=\"40\" y=\"60\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#501313\">串行：每批H2D后才能Compute</text><text x=\"40\" y=\"91\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"197\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 0 · 11.2 ms</text><rect x=\"385\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"447\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 1 · 11.2 ms</text><text x=\"40\" y=\"132\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"115\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"322\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0 · 8 ms</text><rect x=\"510\" y=\"115\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><line x1=\"135\" y1=\"157\" x2=\"600\" y2=\"157\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"135\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">0</text><text x=\"260\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">11.2</text><text x=\"385\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">19.2</text><text x=\"510\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">30.4 ms</text><rect x=\"40\" y=\"192\" width=\"600\" height=\"38\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"216\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">串行周期 ≈ T_H2D + T_compute = 11.2 + 8 = 19.2 ms / batch</text><text x=\"40\" y=\"269\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">双缓冲：H2D(batch i+1) 与 Compute(batch i) 重叠</text><text x=\"40\" y=\"300\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"197\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 0</text><rect x=\"260\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"322\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 1</text><rect x=\"385\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"447\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 2</text><text x=\"40\" y=\"341\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"305\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0</text><rect x=\"385\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"430\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><rect x=\"510\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 2</text><rect x=\"40\" y=\"371\" width=\"600\" height=\"32\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"391\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\">稳态周期理想接近 max(T_H2D, T_compute) = 11.2 ms；首尾仍有Fill/Drain</text></svg>"}, {"title": "256MiB算例", "type": "formula", "body": "[B=8,S=4096,H=4096] BF16为256MiB；有效H2D带宽24GB/s时约11.18ms。若计算8ms，串行19.18ms，理想流水稳态11.18ms，吞吐约提升1.72倍。"}, {"title": "训练流水线", "type": "text", "body": "CPU准备Batch i+2、H2D复制Batch i+1、GPU计算Batch i并行；稳态周期约max(T_cpu_prepare,T_H2D,T_gpu_compute)。"}, {"title": "优化目标", "type": "text", "body": "可改善Latency、Throughput、GPU利用率、CPU占用、PCIe带宽与尾延迟；通常不直接减少GPU常驻显存，除非结合Offload。"}, {"title": "高级路径", "type": "text", "body": "Unified Memory统一寻址但仍可能迁移；Mapped Pinned适合稀疏一次性访问；GPUDirect RDMA/GDS让NIC或Storage直接DMA到GPU。"}, {"title": "失败模式", "type": "text", "body": "大量小拷贝、热路径临时Pin、non_blocking后立即同步、Pinned源提前复用、D2H后CPU过早读取、忽略NUMA和误把Unified Memory当零成本。"}]}}, {"id": "H2D", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Host-to-Device", "CPU到GPU传输"], "group": "communication", "content": {"sections": [{"title": "定义", "type": "text", "body": "Host Memory→Device Memory。训练Batch、推理输入、Checkpoint恢复和Offload回载是主要场景。"}, {"title": "执行路径", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU与GPU的计算、内存和H2D D2H数据路径</title><desc>CPU连接系统DRAM，GPU连接HBM，二者通过PCIe或NVLink C2C等链路通信；H2D和D2H由DMA Copy Engine执行。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">CPU负责控制与复杂逻辑，GPU负责高吞吐并行计算</text><rect x=\"40\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Host / CPU域</text><rect x=\"60\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">CPU Cores</text><text x=\"160\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">低延迟 · 分支 · OS · 调度</text><text x=\"160\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">DataLoader · Python · IO</text><rect x=\"60\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">System DRAM</text><text x=\"160\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">Pageable / Pinned</text><text x=\"160\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">容量大 · NUMA相关</text><text x=\"160\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU直接Load/Store</text><rect x=\"400\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#04342C\">Device / GPU域</text><rect x=\"420\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">SM / Tensor Cores</text><text x=\"520\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高吞吐 · SIMT · GEMM</text><text x=\"520\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">大量线程隐藏延迟</text><rect x=\"420\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">HBM / Device Memory</text><text x=\"520\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">参数 · 激活 · 梯度</text><text x=\"520\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高带宽 · 容量有限</text><text x=\"520\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">GPU Kernel直接访问</text><line x1=\"280\" y1=\"121\" x2=\"397\" y2=\"121\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"339\" y=\"108\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">H2D</text><line x1=\"400\" y1=\"156\" x2=\"283\" y2=\"156\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"341\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">D2H</text><rect x=\"290\" y=\"205\" width=\"100\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"340\" y=\"226\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\">Copy Engine</text><text x=\"340\" y=\"246\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><text x=\"340\" y=\"263\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">异步搬运</text><path d=\"M260 239H288\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M392 239H420\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"329\" width=\"600\" height=\"78\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"351\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">互联链路决定传输上限</text><text x=\"340\" y=\"374\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">独立GPU常走PCIe；Grace Hopper等可走NVLink-C2C；数据中心还可能经NIC/Storage直达GPU</text><text x=\"340\" y=\"394\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">控制路径仍由CPU提交，数据路径可由DMA Engine执行</text></svg>"}, {"title": "时间模型", "type": "formula", "body": "T_H2D≈T_latency+Bytes÷BW_effective。大块传输受带宽主导，小块传输受固定延迟主导。"}, {"title": "异步条件", "type": "text", "body": "Pinned Host Buffer + cudaMemcpyAsync/non_blocking + 非默认Copy Stream + Copy Engine + 正确Event依赖。"}, {"title": "PyTorch", "type": "code", "body": "loader=DataLoader(dataset,pin_memory=True)\nfor x in loader:\n    x=x.to('cuda',non_blocking=True)"}, {"title": "关键风险", "type": "text", "body": "Pinned源在DMA完成前不能被CPU修改或复用；Pageable路径可能经过内部Staging。"}]}}, {"id": "D2H", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Device-to-Host", "GPU到CPU传输"], "group": "communication", "content": {"sections": [{"title": "定义", "type": "text", "body": "Device Memory→Host Memory。用于业务结果、Checkpoint、CPU后处理、日志、调试和Offload。"}, {"title": "优化原则", "type": "text", "body": "先在GPU做Reduction、Top-k、Sampling或压缩，只返回CPU真正需要的小结果。"}, {"title": "同步边界", "type": "text", "body": "non_blocking D2H返回不代表CPU结果可读；CPU执行numpy、打印、序列化前必须等待Copy Event/Stream。"}, {"title": "异步模式", "type": "code", "body": "cpu_out=torch.empty(y.shape,dtype=y.dtype,pin_memory=True)\ncpu_out.copy_(y,non_blocking=True)\ndone=torch.cuda.current_stream().record_event()\ndone.synchronize()\nconsume(cpu_out)"}, {"title": "Serving例子", "type": "formula", "body": "Batch128、Vocab128K的FP16 Logits约32MiB；GPU采样后只返回128个int32约512Byte，Payload减少约65536倍。"}]}}, {"id": "Pinned Memory", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Page-Locked Memory", "锁页内存"], "group": "memory", "content": {"sections": [{"title": "Pageable对比", "type": "svg", "body": "<svg viewBox=\"0 0 680 440\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Pageable与Pinned主机内存的H2D路径区别</title><desc>Pageable内存通常先由CPU复制到驱动的Pinned staging缓冲区，再由DMA传到GPU；Pinned内存可以直接作为DMA源，实现更可预测的异步传输。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Pageable多一次Staging；Pinned允许直接DMA</text><text x=\"40\" y=\"67\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Pageable H2D</text><rect x=\"40\" y=\"83\" width=\"150\" height=\"66\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"115\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pageable内存</text><text x=\"115\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">OS可迁移/换页</text><line x1=\"190\" y1=\"116\" x2=\"246\" y2=\"116\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"218\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU Copy</text><rect x=\"250\" y=\"83\" width=\"170\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"335\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">内部Pinned Staging</text><text x=\"335\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#534AB7\">驱动管理 · 行为不透明</text><line x1=\"420\" y1=\"116\" x2=\"476\" y2=\"116\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"448\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><rect x=\"480\" y=\"83\" width=\"160\" height=\"66\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"560\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"560\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">Device Tensor</text><rect x=\"40\" y=\"169\" width=\"600\" height=\"42\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"195\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">代价：额外CPU内存复制、CPU/DRAM带宽、不可控Staging、Overlap可能退化</text><text x=\"40\" y=\"252\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">Pinned H2D</text><rect x=\"40\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"140\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pinned内存</text><text x=\"140\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">物理页锁定 · 地址稳定</text><text x=\"140\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">cudaHostAlloc/Register</text><line x1=\"240\" y1=\"304\" x2=\"436\" y2=\"304\" stroke=\"#0F6E56\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"338\" y=\"289\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#085041\">Copy Engine直接DMA</text><rect x=\"440\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"540\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"540\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">可真正异步入队</text><text x=\"540\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">配合独立Stream重叠</text><rect x=\"40\" y=\"364\" width=\"600\" height=\"54\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"385\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#412402\">Pinned不是越多越好</text><text x=\"340\" y=\"405\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">锁页会减少OS可分页内存；分配/注册昂贵，应使用有限Buffer Pool长期复用</text></svg>"}, {"title": "机制", "type": "text", "body": "Page-locked保证物理页稳定，避免Pageable→内部Pinned Staging，为真正异步传输和Overlap提供基础。"}, {"title": "API", "type": "code", "body": "cudaHostAlloc(&p,bytes,cudaHostAllocDefault);\ncudaHostRegister(existing,bytes,0);\n# PyTorch\nx=torch.empty(shape,pin_memory=True)"}, {"title": "代价", "type": "text", "body": "占用不可分页RAM；分配/注册昂贵；过多会损害系统。推荐有限Pinned Buffer Pool长期复用。"}, {"title": "DataLoader", "type": "text", "body": "DataLoader(pin_memory=True)在后台Pin线程准备Batch，优于训练主线程每批调用pin_memory()。"}, {"title": "生命周期", "type": "text", "body": "异步H2D未完成时CPU不能改写或复用Pinned源；取消注册/释放前必须确认相关Stream完成。"}]}}, {"id": "CUDA Streams", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["CUDA Stream and Event", "CUDA流与事件"], "group": "compute", "content": {"sections": [{"title": "核心语义", "type": "text", "body": "同一Stream按提交顺序执行；不同Stream无默认相对顺序，具备并发可能但不保证。"}, {"title": "Overlap时间线", "type": "svg", "body": "<svg viewBox=\"0 0 680 420\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU GPU串行执行与双缓冲Copy Compute Overlap时间线</title><desc>对比每批先H2D再计算的串行时间线，以及使用Pinned Memory、独立Copy Stream和双缓冲后，下一批H2D与当前批Compute重叠的流水线。</desc><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">双缓冲把“相加”变成稳态下接近“取最大值”</text><text x=\"40\" y=\"60\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#501313\">串行：每批H2D后才能Compute</text><text x=\"40\" y=\"91\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"197\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 0 · 11.2 ms</text><rect x=\"385\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"447\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 1 · 11.2 ms</text><text x=\"40\" y=\"132\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"115\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"322\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0 · 8 ms</text><rect x=\"510\" y=\"115\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><line x1=\"135\" y1=\"157\" x2=\"600\" y2=\"157\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"135\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">0</text><text x=\"260\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">11.2</text><text x=\"385\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">19.2</text><text x=\"510\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">30.4 ms</text><rect x=\"40\" y=\"192\" width=\"600\" height=\"38\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"216\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">串行周期 ≈ T_H2D + T_compute = 11.2 + 8 = 19.2 ms / batch</text><text x=\"40\" y=\"269\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">双缓冲：H2D(batch i+1) 与 Compute(batch i) 重叠</text><text x=\"40\" y=\"300\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"197\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 0</text><rect x=\"260\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"322\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 1</text><rect x=\"385\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"447\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 2</text><text x=\"40\" y=\"341\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"305\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0</text><rect x=\"385\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"430\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><rect x=\"510\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 2</text><rect x=\"40\" y=\"371\" width=\"600\" height=\"32\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"391\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\">稳态周期理想接近 max(T_H2D, T_compute) = 11.2 ms；首尾仍有Fill/Drain</text></svg>"}, {"title": "Event依赖", "type": "code", "body": "with torch.cuda.stream(copy_stream):\n    y=x.to('cuda',non_blocking=True)\n    done=copy_stream.record_event()\ntorch.cuda.current_stream().wait_event(done)"}, {"title": "wait与record", "type": "text", "body": "wait_stream/wait_event解决执行依赖；Tensor.record_stream解决Caching Allocator的内存生命周期。"}, {"title": "性能边界", "type": "text", "body": "Copy Engine、SM、PCIe、HBM可能共享资源；时间线重叠不等于传输完全被隐藏。"}, {"title": "计时", "type": "text", "body": "异步操作应用CUDA Event计时；普通CPU时钟若不在边界同步，常只测到提交时间。"}]}}, {"id": "NUMA", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Non-Uniform Memory Access"], "group": "compute", "content": {"sections": [{"title": "机制", "type": "text", "body": "多Socket系统中每个GPU通常靠近特定PCIe Root Complex与NUMA Node；远端DRAM需经过UPI/Infinity Fabric。"}, {"title": "优化", "type": "text", "body": "将CPU Worker、Pinned Buffer和GPU绑定到相近NUMA节点；绑定后First-Touch分配，再注册Pinned。"}, {"title": "工具", "type": "code", "body": "nvidia-smi topo -m\nnumactl --cpunodebind=0 --membind=0 python train.py"}, {"title": "指标", "type": "text", "body": "H2D/D2H带宽、NUMA Miss、UPI流量、DataLoader等待和尾延迟。"}]}}, {"id": "Unified Memory", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["CUDA Managed Memory", "统一内存"], "group": "memory", "content": {"sections": [{"title": "定义", "type": "text", "body": "cudaMallocManaged分配CPU和GPU均可寻址的内存；统一寻址不等于物理传输消失。"}, {"title": "迁移", "type": "text", "body": "GPU访问CPU驻留页面可触发Page Fault和迁移；CPU/GPU反复写同一页面可能Thrashing。"}, {"title": "Prefetch", "type": "code", "body": "cudaMemPrefetchAsync(ptr,bytes,gpu_id,stream);\ncudaMemPrefetchAsync(ptr,bytes,cudaCpuDeviceId,stream);"}, {"title": "适合", "type": "text", "body": "编程便利、不规则数据、超额使用GPU内存、CPU-GPU一致性平台。"}, {"title": "不适合", "type": "text", "body": "可预测高吞吐热路径若访问模式清楚，显式批量H2D/D2H通常更可控。"}]}}, {"id": "GPUDirect", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["GPUDirect RDMA", "GPUDirect Storage"], "group": "communication", "content": {"sections": [{"title": "GPUDirect RDMA", "type": "text", "body": "NIC或PCIe Peer Device直接读写GPU Memory，常用于跨节点NCCL与GPU Serving。"}, {"title": "GPUDirect Storage", "type": "text", "body": "NVMe/远程存储经DMA直接读写GPU Memory，避免CPU DRAM Bounce Buffer。"}, {"title": "收益", "type": "text", "body": "减少CPU Memory Copy、CPU占用和数据路径长度，提高系统带宽并降低延迟。"}, {"title": "边界", "type": "text", "body": "需要支持的GPU、NIC/Storage、驱动、内核、文件系统和PCIe拓扑；不满足可能回退到兼容路径。"}, {"title": "控制面", "type": "text", "body": "绕过CPU数据Bounce不等于没有CPU控制；驱动/API仍由CPU设置与提交。"}]}}, {"id": "Optimizer", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["优化器", "Training Optimizer", "大模型优化器"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "优化器不负责计算梯度，而是把反向传播得到的瞬时梯度变成稳定、尺度合适、带历史信息和正则化约束的参数更新。AdamW 是 Transformer/LLM 最稳妥的默认基线；状态显存、样本效率、每步成本和分布式实现必须一起评估。"}, {"title": "训练 Step 中的位置", "type": "svg", "body": "<svg viewBox=\"0 0 680 420\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>优化器在大模型训练 Step 中的位置</title><desc>展示前向、反向、梯度处理、优化器状态更新、参数更新和分布式同步之间的数据流。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">一个训练 Step：优化器位于梯度产生之后、参数生效之前</text><rect x=\"40\" y=\"58\" width=\"124\" height=\"58\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"102\" y=\"80\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">Forward</text><text x=\"102\" y=\"100\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">θ_t → Loss</text><rect x=\"202\" y=\"58\" width=\"124\" height=\"58\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"264\" y=\"80\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">Backward</text><text x=\"264\" y=\"100\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">g_t = ∇L</text><rect x=\"364\" y=\"58\" width=\"124\" height=\"58\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"426\" y=\"80\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">Gradient prep</text><text x=\"426\" y=\"100\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">unscale / clip</text><rect x=\"526\" y=\"58\" width=\"114\" height=\"58\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"583\" y=\"80\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\" text-anchor=\"middle\">Sync</text><text x=\"583\" y=\"100\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\" text-anchor=\"middle\">all-reduce/shard</text><path d=\"M164 87 L198 87\" fill=\"none\" stroke=\"#5F5E5A\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M326 87 L360 87\" fill=\"none\" stroke=\"#5F5E5A\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M488 87 L522 87\" fill=\"none\" stroke=\"#5F5E5A\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"90\" y=\"174\" width=\"500\" height=\"112\" rx=\"16\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"112\" y=\"202\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#04342C\">Optimizer step</text><text x=\"112\" y=\"228\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">1. 读取梯度 g_t 与历史状态 s_{t−1}</text><text x=\"112\" y=\"250\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">2. 平滑 / 自适应缩放 / 矩阵预条件，得到 u_t</text><text x=\"112\" y=\"272\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">3. 施加 decoupled weight decay，按 η_t 更新参数</text><path d=\"M583 116 C583 146 548 154 530 170\" fill=\"none\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"202\" y=\"334\" width=\"276\" height=\"54\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"340\" y=\"355\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\" text-anchor=\"middle\">θ_{t+1} 写回模型</text><text x=\"340\" y=\"375\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">下一 Step 使用新参数；grad 清零</text><path d=\"M340 286 L340 330\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/></svg>"}, {"title": "统一状态机", "type": "formula", "body": "g_t=∇L_t(θ_t)；s_t=update_state(s_{t−1},g_t)；u_t=transform(g_t,s_t,θ_t)；θ_{t+1}=θ_t−η_tu_t。Backward 产生梯度，Optimizer 变换梯度，LR Scheduler 决定全局步长。"}, {"title": "SGD、Momentum 与 Adam", "type": "formula", "body": "SGD: θ←θ−ηg。Momentum: v←μv+g, θ←θ−ηv。Adam: m←β1m+(1−β1)g；v←β2v+(1−β2)g²；偏差修正后用m_hat/(√v_hat+ε)更新。Adam用一阶方向与逐坐标二阶尺度处理噪声和参数尺度差异。"}, {"title": "AdamW 与解耦权重衰减", "type": "formula", "body": "Adam中把λθ加进梯度会让正则项也经过1/√v预条件。AdamW执行θ_{t+1}=(1−η_tλ)θ_t−η_tm_hat/(√v_hat+ε)，使Weight Decay不经过自适应预条件。Bias和Norm Scale通常不衰减，但这是Recipe而非数学定律。"}, {"title": "状态显存量级", "type": "formula", "body": "BF16参数2B + BF16梯度2B + FP32 Master4B + FP32 Adam m/v各4B = 16 Byte/参数。7B模型静态状态约112GB十进制=104.3GiB；仅m/v约52.2GiB。8个Ranks理想全分片约13.0GiB/Rank，未含Activation与临时Buffer。"}, {"title": "优化器更新几何分类", "type": "svg", "body": "<svg viewBox=\"0 0 680 500\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>主流优化器按更新几何和状态成本分类</title><desc>将SGD、AdamW、Adafactor、LAMB、Lion、Shampoo和Muon按是否使用历史、一阶或二阶状态、逐元素或矩阵级预条件进行分类。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">优化器差异的三条轴：历史状态、缩放粒度、结构信息</text><rect x=\"40\" y=\"56\" width=\"600\" height=\"62\" rx=\"14\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"340\" y=\"80\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\" text-anchor=\"middle\">输入都来自同一个 g_t；最终都产生参数更新 θ_{t+1}</text><text x=\"340\" y=\"101\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\" text-anchor=\"middle\">差别在于如何过滤噪声、归一化尺度，以及是否利用 Layer/Matrix 结构</text><rect x=\"40\" y=\"154\" width=\"184\" height=\"118\" rx=\"12\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"58\" y=\"178\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">梯度与一阶历史</text><text x=\"58\" y=\"202\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">SGD：raw gradient</text><text x=\"58\" y=\"224\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">Momentum：EMA direction</text><text x=\"58\" y=\"246\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">Lion：sign(momentum)</text><rect x=\"248\" y=\"154\" width=\"184\" height=\"118\" rx=\"12\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"266\" y=\"178\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">逐元素自适应</text><text x=\"266\" y=\"202\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">AdaGrad / RMSProp</text><text x=\"266\" y=\"224\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">AdamW：m / √v</text><text x=\"266\" y=\"246\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">Adafactor：factored v</text><rect x=\"456\" y=\"154\" width=\"184\" height=\"118\" rx=\"12\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"474\" y=\"178\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">Layer / Matrix 结构</text><text x=\"474\" y=\"202\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">LARS/LAMB：trust ratio</text><text x=\"474\" y=\"224\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">Shampoo：matrix roots</text><text x=\"474\" y=\"246\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">Muon：orthogonalization</text><rect x=\"40\" y=\"316\" width=\"600\" height=\"140\" rx=\"14\" fill=\"#F1EFE8\" stroke=\"#5F5E5A\" stroke-width=\"0.5\"/><text x=\"58\" y=\"342\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">选型不是只看收敛曲线</text><text x=\"58\" y=\"370\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">算法轴：样本效率、稳定性、超参数敏感度、正则化行为</text><text x=\"58\" y=\"396\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">系统轴：状态显存、HBM 流量、额外 FLOP、通信、Checkpoint 体积</text><text x=\"58\" y=\"422\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">运营轴：实现成熟度、失败恢复、可观测性、Recipe 可迁移性</text><text x=\"58\" y=\"448\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">公平比较必须分别调 LR / WD / Warmup / Betas，不能照搬 AdamW 参数。</text></svg>"}, {"title": "系统实现边界", "type": "text", "body": "8-bit AdamW是量化状态实现；Fused/Foreach AdamW是Kernel融合；ZeRO/FSDP是状态、梯度和参数分片。它们主要改变显存、HBM流量和通信，不是新的基础优化公式。"}, {"title": "最小 PyTorch 结构", "type": "code", "body": "decay,no_decay=[],[]\nfor name,p in model.named_parameters():\n    (decay if p.ndim>=2 else no_decay).append(p)\nopt=torch.optim.AdamW([{'params':decay,'weight_decay':0.1},{'params':no_decay,'weight_decay':0.0}],lr=3e-4,betas=(0.9,0.95))\nloss.backward(); clip_grad_norm_(model.parameters(),1.0); opt.step(); opt.zero_grad(set_to_none=True)"}, {"title": "选型原则与误区", "type": "text", "body": "新LLM先建立可信AdamW基线。OOM先评估状态分片，再考虑8-bit AdamW；之后才是Adafactor/Lion等算法变化。极大Batch评估LAMB/LARS；研究样本效率再评估Shampoo/Muon。不能直接复用AdamW学习率，也不能只看训练Loss或Step数。"}]}}, {"id": "SGD and Momentum", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["SGD", "Momentum SGD", "Nesterov"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "SGD直接沿梯度下降；Momentum用一阶历史平滑噪声并累积长期一致方向。状态最省，但缺少逐参数自适应。"}, {"title": "更新公式", "type": "formula", "body": "SGD: θ_{t+1}=θ_t−η_tg_t。Momentum: v_t=μv_{t−1}+g_t；θ_{t+1}=θ_t−η_tv_t。不同框架可能在g前乘1−μ。"}, {"title": "状态与显存", "type": "formula", "body": "SGD无额外状态；Momentum若FP32保存v，约4 Byte/参数。"}, {"title": "适用场景", "type": "text", "body": "成熟视觉Recipe、低状态显存、需要透明基线；从零LLM通常不作为默认。"}, {"title": "工程风险", "type": "text", "body": "对学习率、曲率和参数尺度敏感；Mini-batch噪声更直接进入更新。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "AdamW", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["Adam with Decoupled Weight Decay"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "AdamW维护一阶矩m和二阶矩v做逐坐标自适应，并把Weight Decay从梯度预条件中解耦，是Transformer/LLM默认基线。"}, {"title": "更新公式", "type": "formula", "body": "m←β1m+(1−β1)g；v←β2v+(1−β2)g²；偏差修正后θ←(1−ηλ)θ−ηm_hat/(√v_hat+ε)。"}, {"title": "状态与显存", "type": "formula", "body": "FP32 m/v约8 Byte/参数；含FP32 Master时再加4 Byte/参数。"}, {"title": "适用场景", "type": "text", "body": "新Transformer/LLM预训练和全参数微调的首选基线。"}, {"title": "工程风险", "type": "text", "body": "状态和HBM流量大；β2、ε、LR、WD与Schedule相互耦合。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "Adafactor", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["Factored Second Moment Optimizer"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Adafactor用行列统计近似大矩阵的完整二阶矩，把该状态从O(nm)降至O(n+m)，并配合Update Clipping和Relative Step。"}, {"title": "更新公式", "type": "formula", "body": "W[n,m]只存R[n]、C[m]；V_hat[i,j]≈R[i]C[j]/mean(R)；U=G/(√V_hat+ε)。"}, {"title": "状态与显存", "type": "formula", "body": "4096×16384矩阵的FP32完整v为256MiB；行列状态约80KiB，未含可选Momentum。"}, {"title": "适用场景", "type": "text", "body": "优化器状态硬受限、模型以大矩阵为主，并愿意重新调参。"}, {"title": "工程风险", "type": "text", "body": "因式分解是近似；不同库Relative Step/Scale Parameter默认差异大。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "LAMB", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["Layer-wise Adaptive Moments optimizer for Batch training", "LARS"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "LAMB在Adam逐参数自适应方向外增加Layer-wise Trust Ratio，控制极大Batch下每层更新相对参数范数。LARS是对应的SGD系思路。"}, {"title": "更新公式", "type": "formula", "body": "r_l=m_hat/(√v_hat+ε)+λθ_l；trust_l=||θ_l||/(||r_l||+ε)；θ_l←θ_l−η trust_l r_l。"}, {"title": "状态与显存", "type": "formula", "body": "与Adam类相近，主要m/v约8 Byte/参数，另有临时Layer Norm统计。"}, {"title": "适用场景", "type": "text", "body": "极大Global Batch的BERT/Transformer且已有验证Recipe；LARS更常见于大Batch视觉。"}, {"title": "工程风险", "type": "text", "body": "普通Batch收益不确定；Layer规则、Norm/Bias排除和LR Scaling需专门调试。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "Lion", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["EvoLved Sign Momentum"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Lion只保存一阶Momentum，更新使用Momentum组合的sign，牺牲连续逐坐标幅度换取更低状态显存和简单更新。"}, {"title": "更新公式", "type": "formula", "body": "c=β1m+(1−β1)g；θ←θ−η(sign(c)+λθ)；m←β2m+(1−β2)g。"}, {"title": "状态与显存", "type": "formula", "body": "FP32 Momentum约4 Byte/参数，约为AdamW两份Moment的一半。"}, {"title": "适用场景", "type": "text", "body": "状态显存重要、能为Lion独立搜索LR/WD/Beta并有目标模型验证。"}, {"title": "工程风险", "type": "text", "body": "LR直接控制坐标步长；丢弃幅度信息，AdamW超参数不可照搬。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "Shampoo", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["Preconditioned Stochastic Tensor Optimization"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Shampoo为Tensor每个维度维护矩阵Preconditioner，用矩阵逆根捕获参数行列相关性，比Adam的对角预条件更丰富。"}, {"title": "更新公式", "type": "formula", "body": "对G[n,m]：L←L+GG^T，R←R+G^TG；G_pre=L^(−1/4)GR^(−1/4)。"}, {"title": "状态与显存", "type": "formula", "body": "二维状态约O(n²+m²)，常用Block Partition、低频逆根更新控制成本。"}, {"title": "适用场景", "type": "text", "body": "愿意以单步额外计算和工程复杂度换更少训练Steps/更高样本效率。"}, {"title": "工程风险", "type": "text", "body": "逆矩阵根、状态、Checkpoint和分布式Preconditioner复杂，墙钟收益不保证。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "Muon", "mastery": 1, "needs_review": false, "next_review": "2026-08-08", "aliases": ["Momentum Orthogonalized by Newton-Schulz"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "Muon对二维权重的梯度Momentum做近似正交化，按矩阵结构调整奇异方向；通常与AdamW组成Hybrid Optimizer。"}, {"title": "更新公式", "type": "formula", "body": "M_t=μM_{t−1}+G_t；O_t=NewtonSchulz(M_t)近似正交化；W_t=W_{t−1}−η_tO_t。"}, {"title": "状态与显存", "type": "formula", "body": "二维矩阵通常一份Momentum约4 Byte/参数；Embedding/Norm等AdamW部分另算。"}, {"title": "适用场景", "type": "text", "body": "有研究工程预算、追求样本效率、可严格对照AdamW的大规模预训练。"}, {"title": "工程风险", "type": "text", "body": "额外矩阵计算；FSDP/ZeRO下完整矩阵语义和通信复杂；生态成熟度较低。"}, {"title": "共同选型原则", "type": "text", "body": "切换优化器时必须独立调Learning Rate、Weight Decay、Warmup与内部系数；同时报告Validation Loss vs Tokens、Wall-clock、FLOPs、状态显存和稳定性。"}]}}, {"id": "Backpropagation", "mastery": 1, "needs_review": false, "next_review": "2026-08-14", "aliases": ["反向传播", "Backward Pass", "Backprop"], "group": "core", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "反向传播是在前向计算图上从标量Loss出发，按反向拓扑顺序执行VJP：每个算子把上游梯度乘局部导数，分叉处累加，最终得到每个参数的梯度。Optimizer只消费梯度，不负责计算梯度。"}, {"title": "训练迭代中的位置", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>一次训练迭代中的前向传播和反向传播</title><desc>前向从输入经过两层网络到Loss，反向从Loss沿相反方向计算各张量和参数的梯度，再由优化器更新参数。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\
