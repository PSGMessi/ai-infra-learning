 fill=\"#0C447C\">模型状态</text><text x=\"127\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">BF16/FP16参数</text><text x=\"127\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">FP32优化器状态</text><line x1=\"215\" y1=\"81\" x2=\"252\" y2=\"81\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"50\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">前向计算</text><text x=\"340\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">BF16 / FP16 / FP8 GEMM</text><text x=\"340\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加或安全归约</text><line x1=\"425\" y1=\"81\" x2=\"462\" y2=\"81\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"465\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"552\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">敏感算子</text><text x=\"552\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">Softmax / Norm / Loss</text><text x=\"552\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#854F0B\">通常提升到FP32</text><path d=\"M552 112V151H426\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"135\" width=\"170\" height=\"58\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"156\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">Loss Scaling</text><text x=\"340\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">FP16常用；BF16通常可省</text><path d=\"M340 193V227\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"230\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">反向计算</text><text x=\"340\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">低精度梯度计算</text><text x=\"340\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加/归约</text><line x1=\"255\" y1=\"261\" x2=\"218\" y2=\"261\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"230\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#501313\">Unscale与检查</text><text x=\"127\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">检测Inf/NaN</text><text x=\"127\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\">溢出则跳过更新</text><path d=\"M127 292V331H255\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"315\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"340\" y=\"335\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Optimizer Step</text><text x=\"340\" y=\"356\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">FP32 Adam m/v</text><text x=\"340\" y=\"372\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">更新参数或Master Weight</text><path d=\"M255 346H146V113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"405\" width=\"600\" height=\"28\" rx=\"8\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"423\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">“训练用BF16”不等于参数、梯度、优化器、累加器、所有算子都只用BF16</text></svg>"}, {"title": "显存与状态口径", "type": "svg", "body": "<svg viewBox=\"0 0 680 405\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>不同精度对存储带宽和训练状态的影响</title><desc>比较FP32、16位、FP8和4位的每元素字节数，并说明混合精度Adam训练中优化器状态通常仍为FP32，因此总显存不会按计算精度同比下降。</desc><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">降低位宽，首先减少张量字节数</text><text x=\"40\" y=\"52\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">相对FP32的原始存储与理想带宽压力；不等于端到端训练加速比</text><g font-family=\"sans-serif\"><text x=\"40\" y=\"87\" font-size=\"13\" fill=\"#2C2C2A\">FP32</text><rect x=\"105\" y=\"71\" width=\"480\" height=\"24\" rx=\"6\" fill=\"#185FA5\"/><text x=\"595\" y=\"87\" font-size=\"12\" fill=\"#0C447C\">4 B · 100%</text><text x=\"40\" y=\"127\" font-size=\"13\" fill=\"#2C2C2A\">BF16/FP16</text><rect x=\"105\" y=\"111\" width=\"240\" height=\"24\" rx=\"6\" fill=\"#378ADD\"/><text x=\"355\" y=\"127\" font-size=\"12\" fill=\"#0C447C\">2 B · 50%</text><text x=\"40\" y=\"167\" font-size=\"13\" fill=\"#2C2C2A\">FP8/INT8</text><rect x=\"105\" y=\"151\" width=\"120\" height=\"24\" rx=\"6\" fill=\"#85B7EB\"/><text x=\"235\" y=\"167\" font-size=\"12\" fill=\"#0C447C\">1 B · 25%</text><text x=\"40\" y=\"207\" font-size=\"13\" fill=\"#2C2C2A\">FP4/INT4</text><rect x=\"105\" y=\"191\" width=\"60\" height=\"24\" rx=\"6\" fill=\"#B5D4F4\"/><text x=\"175\" y=\"207\" font-size=\"12\" fill=\"#0C447C\">0.5 B · 12.5%</text></g><text x=\"40\" y=\"250\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#26215C\">但混合精度Adam仍有较高精度状态</text><rect x=\"40\" y=\"270\" width=\"600\" height=\"64\" rx=\"10\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><rect x=\"52\" y=\"283\" width=\"72\" height=\"38\" rx=\"6\" fill=\"#B5D4F4\"/><text x=\"88\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">参数</text><text x=\"88\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">2 B</text><rect x=\"128\" y=\"283\" width=\"72\" height=\"38\" rx=\"6\" fill=\"#85B7EB\"/><text x=\"164\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">梯度</text><text x=\"164\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#0C447C\">2 B</text><rect x=\"204\" y=\"283\" width=\"112\" height=\"38\" rx=\"6\" fill=\"#FAC775\"/><text x=\"260\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">Master weight</text><text x=\"260\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">4 B（可选）</text><rect x=\"320\" y=\"283\" width=\"142\" height=\"38\" rx=\"6\" fill=\"#EF9F27\"/><text x=\"391\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">Adam first moment</text><text x=\"391\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">4 B</text><rect x=\"466\" y=\"283\" width=\"162\" height=\"38\" rx=\"6\" fill=\"#BA7517\"/><text x=\"547\" y=\"299\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">Adam second moment</text><text x=\"547\" y=\"315\" font-family=\"sans-serif\" font-size=\"11\" text-anchor=\"middle\" fill=\"#412402\">4 B</text><rect x=\"40\" y=\"354\" width=\"600\" height=\"32\" rx=\"8\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"374\" font-family=\"sans-serif\" font-size=\"12\" text-anchor=\"middle\" fill=\"#412402\">经典口径：2+2+4+4+4 = 16 Byte/参数；仅把GEMM降到FP8，不会自动变成8 Byte/参数</text></svg>"}, {"title": "7B权重手算", "type": "formula", "body": "FP32=28GB；BF16/FP16=14GB；FP8/INT8=7GB；4bit=3.5GB。经典混合精度Adam按16Byte/参数约112GB，仅指参数相关训练状态。"}, {"title": "Activation手算", "type": "formula", "body": "[B=2,S=4096,H=8192]共67,108,864元素：FP32=256MiB，16bit=128MiB，FP8=64MiB。"}, {"title": "性能影响", "type": "text", "body": "低位宽减少HBM与通信payload，并提高支持格式的Tensor Core吞吐；端到端收益受Amdahl定律、非GEMM算子、Cast/Scale、通信和Shape约束限制。"}, {"title": "稳定性风险", "type": "text", "body": "主要风险是Overflow、Underflow、Rounding、Accumulation Error。需监控Loss、Grad Norm、Inf/NaN、Loss Scale、Amax、Saturation与逐层误差。"}, {"title": "训练与推理选型", "type": "text", "body": "预训练默认BF16；FP16需GradScaler；Hopper/Blackwell可评估FP8；推理常用BF16/FP16、FP8/INT8或INT4 Weight-Only；FP4依赖新硬件与Recipe。"}, {"title": "关键误区", "type": "text", "body": "BF16不是全面比FP16精确；TF32不节省FP32存储；FP8不自动让总训练显存减半；INT4不保证端到端快4倍；FP32累加也不能恢复输入量化丢失的信息。"}]}}, {"id": "Mixed Precision Training", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["混合精度训练", "AMP"], "group": "precision", "content": {"sections": [{"title": "核心机制", "type": "text", "body": "混合精度按算子和状态分配dtype，不是把模型整体cast到一种低精度。"}, {"title": "训练数据流", "type": "svg", "body": "<svg viewBox=\"0 0 680 450\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>大模型混合精度训练的数据与状态流</title><desc>展示FP32或BF16权重如何进入低精度前向，损失缩放如何保护FP16梯度，以及FP32累加和优化器状态如何保持稳定。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"28\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">低精度负责大吞吐，较高精度负责长期稳定</text><rect x=\"40\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"127\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">模型状态</text><text x=\"127\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">BF16/FP16参数</text><text x=\"127\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">FP32优化器状态</text><line x1=\"215\" y1=\"81\" x2=\"252\" y2=\"81\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"50\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">前向计算</text><text x=\"340\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">BF16 / FP16 / FP8 GEMM</text><text x=\"340\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加或安全归约</text><line x1=\"425\" y1=\"81\" x2=\"462\" y2=\"81\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"465\" y=\"50\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"552\" y=\"70\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">敏感算子</text><text x=\"552\" y=\"91\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">Softmax / Norm / Loss</text><text x=\"552\" y=\"107\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#854F0B\">通常提升到FP32</text><path d=\"M552 112V151H426\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"135\" width=\"170\" height=\"58\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"156\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#412402\">Loss Scaling</text><text x=\"340\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">FP16常用；BF16通常可省</text><path d=\"M340 193V227\" fill=\"none\" stroke=\"#854F0B\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"230\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">反向计算</text><text x=\"340\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">低精度梯度计算</text><text x=\"340\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">FP32累加/归约</text><line x1=\"255\" y1=\"261\" x2=\"218\" y2=\"261\" stroke=\"#0F6E56\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"230\" width=\"175\" height=\"62\" rx=\"10\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"127\" y=\"250\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#501313\">Unscale与检查</text><text x=\"127\" y=\"271\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#A32D2D\">检测Inf/NaN</text><text x=\"127\" y=\"287\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#A32D2D\">溢出则跳过更新</text><path d=\"M127 292V331H255\" fill=\"none\" stroke=\"#A32D2D\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"255\" y=\"315\" width=\"170\" height=\"62\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"340\" y=\"335\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">Optimizer Step</text><text x=\"340\" y=\"356\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">FP32 Adam m/v</text><text x=\"340\" y=\"372\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">更新参数或Master Weight</text><path d=\"M255 346H146V113\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"405\" width=\"600\" height=\"28\" rx=\"8\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"423\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#2C2C2A\">“训练用BF16”不等于参数、梯度、优化器、累加器、所有算子都只用BF16</text></svg>"}, {"title": "Loss Scaling", "type": "formula", "body": "L_scaled=L×S；g_scaled=S×g；更新前g=g_scaled÷S。FP16常用动态Loss Scaling，BF16通常可省。"}, {"title": "精度角色", "type": "text", "body": "GEMM输入常为BF16/FP16/FP8；Accumulator、Softmax、Norm、Loss和Adam m/v常为FP32。"}, {"title": "PyTorch接口", "type": "code", "body": "with torch.autocast(device_type='cuda', dtype=torch.bfloat16):\n    loss = loss_fn(model(x), target)\nloss.backward()\noptimizer.step()"}, {"title": "边界", "type": "text", "body": "内部累加精度取决于Kernel和后端；dtype标签不足以描述整个计算路径。"}]}}, {"id": "BF16", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["bfloat16", "Brain Floating Point 16"], "group": "precision", "content": {"sections": [{"title": "格式", "type": "formula", "body": "1 sign + 8 exponent + 7 mantissa；2Byte；最大值约3.39e38；1附近间隔约0.0078125。"}, {"title": "为什么适合LLM", "type": "text", "body": "动态范围接近FP32，不易发生FP16式大范围溢出或小梯度下溢，通常无需Loss Scaling。"}, {"title": "代价", "type": "text", "body": "尾数少，小更新和局部差异更容易舍入；累加、Norm、Softmax和Optimizer仍常保留FP32。"}, {"title": "与FP16", "type": "text", "body": "BF16范围更大；FP16在1附近更精细。二者同为2Byte。"}, {"title": "适用", "type": "text", "body": "现代Ampere及以后GPU的大模型预训练、微调与Serving基线。"}]}}, {"id": "FP16", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["Half Precision"], "group": "precision", "content": {"sections": [{"title": "格式", "type": "formula", "body": "1 sign + 5 exponent + 10 mantissa；2Byte；最大65504；最小正规数约6.10e-5。"}, {"title": "主要风险", "type": "text", "body": "大Activation/Gradient易Overflow，小Gradient易Underflow为0。"}, {"title": "Loss Scaling", "type": "formula", "body": "先放大Loss和Gradient，再在更新前Unscale；遇到Inf/NaN降低Scale并跳过更新。"}, {"title": "优势", "type": "text", "body": "2Byte、Tensor Core成熟、在1附近尾数精度优于BF16。"}, {"title": "边界", "type": "text", "body": "BF16预训练模型不应无脑转FP16微调；数值范围可能不兼容。"}]}}, {"id": "FP8 Training", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["FP8混合精度训练", "E4M3/E5M2 Training"], "group": "precision", "content": {"sections": [{"title": "双格式", "type": "text", "body": "E4M3精度相对高、范围小，常用于前向；E5M2范围更大、精度低，常用于梯度。"}, {"title": "Scaling", "type": "formula", "body": "x_fp8=cast(x×scale)；恢复值约为cast_high(x_fp8)÷scale。单一全局Scale无法覆盖各层不同分布。"}, {"title": "Delayed与Current", "type": "text", "body": "Delayed Scaling用历史Amax降低当前遍历开销；Current Scaling更及时；Microscaling用更小块减少Outlier影响。"}, {"title": "性能", "type": "text", "body": "1Byte输入降低HBM与Tensor Core输入带宽，并提高支持硬件的GEMM吞吐；Cast/Scale、同步和回退算子会侵蚀收益。"}, {"title": "监控", "type": "text", "body": "Amax、Saturation、Scale、Inf/NaN、逐层误差、Cast/Scale时间、Kernel覆盖率。"}, {"title": "硬件边界", "type": "text", "body": "常依赖Hopper/Blackwell及Transformer Engine等软件栈；Accumulator精度需按具体Kernel确认。"}]}}, {"id": "Low-Bit Quantization", "mastery": 1, "needs_review": false, "next_review": "2026-08-03", "aliases": ["低比特量化", "INT8/INT4 Quantization"], "group": "precision", "content": {"sections": [{"title": "量化公式", "type": "formula", "body": "q=clip(round(x÷scale)+zero_point)；x_hat≈scale×(q−zero_point)。"}, {"title": "粒度", "type": "text", "body": "Per-Tensor、Per-Channel、Per-Group、Per-Token与Per-Block在元数据开销、Outlier适应和Kernel复杂度之间权衡。"}, {"title": "INT8", "type": "text", "body": "常用于Weight+Activation推理、PTQ/QAT、KV Cache和部分通信。"}, {"title": "INT4", "type": "text", "body": "常用于Weight-Only LLM推理，权重约0.5Byte/参数，但需要反量化与Scale。"}, {"title": "FP4", "type": "text", "body": "裸E2M1极粗；NVFP4依赖16值微块Scaling、E4M3 Scale、FP32全局Scale、随机舍入与Hadamard等Recipe。"}, {"title": "性能边界", "type": "text", "body": "压缩比不等于速度比；Decode可能受反量化、GEMV、KV Cache、调度和Kernel覆盖限制。"}]}}, {"id": "CPU-GPU Communication", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["CPU–GPU通信", "Host-Device Data Movement"], "group": "communication", "content": {"sections": [{"title": "一句话结论", "type": "text", "body": "CPU适合控制、分支、IO和小任务；GPU适合大规模规则并行。H2D/D2H是两套内存之间的数据搬运，优化顺序是少传、合并、Pinned、异步、Overlap和拓扑绑定。"}, {"title": "CPU-GPU数据路径", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU与GPU的计算、内存和H2D D2H数据路径</title><desc>CPU连接系统DRAM，GPU连接HBM，二者通过PCIe或NVLink C2C等链路通信；H2D和D2H由DMA Copy Engine执行。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">CPU负责控制与复杂逻辑，GPU负责高吞吐并行计算</text><rect x=\"40\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Host / CPU域</text><rect x=\"60\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">CPU Cores</text><text x=\"160\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">低延迟 · 分支 · OS · 调度</text><text x=\"160\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">DataLoader · Python · IO</text><rect x=\"60\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">System DRAM</text><text x=\"160\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">Pageable / Pinned</text><text x=\"160\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">容量大 · NUMA相关</text><text x=\"160\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU直接Load/Store</text><rect x=\"400\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#04342C\">Device / GPU域</text><rect x=\"420\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">SM / Tensor Cores</text><text x=\"520\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高吞吐 · SIMT · GEMM</text><text x=\"520\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">大量线程隐藏延迟</text><rect x=\"420\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">HBM / Device Memory</text><text x=\"520\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">参数 · 激活 · 梯度</text><text x=\"520\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高带宽 · 容量有限</text><text x=\"520\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">GPU Kernel直接访问</text><line x1=\"280\" y1=\"121\" x2=\"397\" y2=\"121\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"339\" y=\"108\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">H2D</text><line x1=\"400\" y1=\"156\" x2=\"283\" y2=\"156\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"341\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">D2H</text><rect x=\"290\" y=\"205\" width=\"100\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"340\" y=\"226\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\">Copy Engine</text><text x=\"340\" y=\"246\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><text x=\"340\" y=\"263\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">异步搬运</text><path d=\"M260 239H288\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M392 239H420\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"329\" width=\"600\" height=\"78\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"351\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">互联链路决定传输上限</text><text x=\"340\" y=\"374\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">独立GPU常走PCIe；Grace Hopper等可走NVLink-C2C；数据中心还可能经NIC/Storage直达GPU</text><text x=\"340\" y=\"394\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">控制路径仍由CPU提交，数据路径可由DMA Engine执行</text></svg>"}, {"title": "CPU与GPU对比", "type": "text", "body": "CPU强调低延迟、复杂控制和系统IO；GPU强调吞吐、SIMT、Tensor Core与HBM。GPU是否值得取决于计算收益能否覆盖H2D+D2H+Launch+Sync。"}, {"title": "Pageable与Pinned", "type": "svg", "body": "<svg viewBox=\"0 0 680 440\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Pageable与Pinned主机内存的H2D路径区别</title><desc>Pageable内存通常先由CPU复制到驱动的Pinned staging缓冲区，再由DMA传到GPU；Pinned内存可以直接作为DMA源，实现更可预测的异步传输。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Pageable多一次Staging；Pinned允许直接DMA</text><text x=\"40\" y=\"67\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Pageable H2D</text><rect x=\"40\" y=\"83\" width=\"150\" height=\"66\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"115\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pageable内存</text><text x=\"115\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">OS可迁移/换页</text><line x1=\"190\" y1=\"116\" x2=\"246\" y2=\"116\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"218\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU Copy</text><rect x=\"250\" y=\"83\" width=\"170\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"335\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">内部Pinned Staging</text><text x=\"335\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#534AB7\">驱动管理 · 行为不透明</text><line x1=\"420\" y1=\"116\" x2=\"476\" y2=\"116\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"448\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><rect x=\"480\" y=\"83\" width=\"160\" height=\"66\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"560\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"560\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">Device Tensor</text><rect x=\"40\" y=\"169\" width=\"600\" height=\"42\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"195\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">代价：额外CPU内存复制、CPU/DRAM带宽、不可控Staging、Overlap可能退化</text><text x=\"40\" y=\"252\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">Pinned H2D</text><rect x=\"40\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"140\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pinned内存</text><text x=\"140\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">物理页锁定 · 地址稳定</text><text x=\"140\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">cudaHostAlloc/Register</text><line x1=\"240\" y1=\"304\" x2=\"436\" y2=\"304\" stroke=\"#0F6E56\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"338\" y=\"289\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#085041\">Copy Engine直接DMA</text><rect x=\"440\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"540\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"540\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">可真正异步入队</text><text x=\"540\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">配合独立Stream重叠</text><rect x=\"40\" y=\"364\" width=\"600\" height=\"54\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"385\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#412402\">Pinned不是越多越好</text><text x=\"340\" y=\"405\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">锁页会减少OS可分页内存；分配/注册昂贵，应使用有限Buffer Pool长期复用</text></svg>"}, {"title": "双缓冲Overlap", "type": "svg", "body": "<svg viewBox=\"0 0 680 420\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU GPU串行执行与双缓冲Copy Compute Overlap时间线</title><desc>对比每批先H2D再计算的串行时间线，以及使用Pinned Memory、独立Copy Stream和双缓冲后，下一批H2D与当前批Compute重叠的流水线。</desc><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">双缓冲把“相加”变成稳态下接近“取最大值”</text><text x=\"40\" y=\"60\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#501313\">串行：每批H2D后才能Compute</text><text x=\"40\" y=\"91\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"197\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 0 · 11.2 ms</text><rect x=\"385\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"447\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 1 · 11.2 ms</text><text x=\"40\" y=\"132\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"115\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"322\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0 · 8 ms</text><rect x=\"510\" y=\"115\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><line x1=\"135\" y1=\"157\" x2=\"600\" y2=\"157\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"135\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">0</text><text x=\"260\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">11.2</text><text x=\"385\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">19.2</text><text x=\"510\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">30.4 ms</text><rect x=\"40\" y=\"192\" width=\"600\" height=\"38\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"216\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">串行周期 ≈ T_H2D + T_compute = 11.2 + 8 = 19.2 ms / batch</text><text x=\"40\" y=\"269\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">双缓冲：H2D(batch i+1) 与 Compute(batch i) 重叠</text><text x=\"40\" y=\"300\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"197\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 0</text><rect x=\"260\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"322\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 1</text><rect x=\"385\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"447\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 2</text><text x=\"40\" y=\"341\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"305\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0</text><rect x=\"385\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"430\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><rect x=\"510\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 2</text><rect x=\"40\" y=\"371\" width=\"600\" height=\"32\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"391\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\">稳态周期理想接近 max(T_H2D, T_compute) = 11.2 ms；首尾仍有Fill/Drain</text></svg>"}, {"title": "256MiB算例", "type": "formula", "body": "[B=8,S=4096,H=4096] BF16为256MiB；有效H2D带宽24GB/s时约11.18ms。若计算8ms，串行19.18ms，理想流水稳态11.18ms，吞吐约提升1.72倍。"}, {"title": "训练流水线", "type": "text", "body": "CPU准备Batch i+2、H2D复制Batch i+1、GPU计算Batch i并行；稳态周期约max(T_cpu_prepare,T_H2D,T_gpu_compute)。"}, {"title": "优化目标", "type": "text", "body": "可改善Latency、Throughput、GPU利用率、CPU占用、PCIe带宽与尾延迟；通常不直接减少GPU常驻显存，除非结合Offload。"}, {"title": "高级路径", "type": "text", "body": "Unified Memory统一寻址但仍可能迁移；Mapped Pinned适合稀疏一次性访问；GPUDirect RDMA/GDS让NIC或Storage直接DMA到GPU。"}, {"title": "失败模式", "type": "text", "body": "大量小拷贝、热路径临时Pin、non_blocking后立即同步、Pinned源提前复用、D2H后CPU过早读取、忽略NUMA和误把Unified Memory当零成本。"}]}}, {"id": "H2D", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Host-to-Device", "CPU到GPU传输"], "group": "communication", "content": {"sections": [{"title": "定义", "type": "text", "body": "Host Memory→Device Memory。训练Batch、推理输入、Checkpoint恢复和Offload回载是主要场景。"}, {"title": "执行路径", "type": "svg", "body": "<svg viewBox=\"0 0 680 430\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU与GPU的计算、内存和H2D D2H数据路径</title><desc>CPU连接系统DRAM，GPU连接HBM，二者通过PCIe或NVLink C2C等链路通信；H2D和D2H由DMA Copy Engine执行。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">CPU负责控制与复杂逻辑，GPU负责高吞吐并行计算</text><rect x=\"40\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Host / CPU域</text><rect x=\"60\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">CPU Cores</text><text x=\"160\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">低延迟 · 分支 · OS · 调度</text><text x=\"160\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">DataLoader · Python · IO</text><rect x=\"60\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#B5D4F4\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"160\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">System DRAM</text><text x=\"160\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">Pageable / Pinned</text><text x=\"160\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">容量大 · NUMA相关</text><text x=\"160\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU直接Load/Store</text><rect x=\"400\" y=\"55\" width=\"240\" height=\"250\" rx=\"18\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"81\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#04342C\">Device / GPU域</text><rect x=\"420\" y=\"99\" width=\"200\" height=\"76\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"121\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">SM / Tensor Cores</text><text x=\"520\" y=\"144\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高吞吐 · SIMT · GEMM</text><text x=\"520\" y=\"162\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">大量线程隐藏延迟</text><rect x=\"420\" y=\"195\" width=\"200\" height=\"88\" rx=\"10\" fill=\"#9FE1CB\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"520\" y=\"218\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">HBM / Device Memory</text><text x=\"520\" y=\"240\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">参数 · 激活 · 梯度</text><text x=\"520\" y=\"258\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">高带宽 · 容量有限</text><text x=\"520\" y=\"276\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">GPU Kernel直接访问</text><line x1=\"280\" y1=\"121\" x2=\"397\" y2=\"121\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"339\" y=\"108\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">H2D</text><line x1=\"400\" y1=\"156\" x2=\"283\" y2=\"156\" stroke=\"#534AB7\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"341\" y=\"177\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#3C3489\">D2H</text><rect x=\"290\" y=\"205\" width=\"100\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"340\" y=\"226\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#26215C\">Copy Engine</text><text x=\"340\" y=\"246\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><text x=\"340\" y=\"263\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">异步搬运</text><path d=\"M260 239H288\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><path d=\"M392 239H420\" fill=\"none\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><rect x=\"40\" y=\"329\" width=\"600\" height=\"78\" rx=\"12\" fill=\"#F1EFE8\" stroke=\"#B4B2A9\" stroke-width=\"0.5\"/><text x=\"340\" y=\"351\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#2C2C2A\">互联链路决定传输上限</text><text x=\"340\" y=\"374\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">独立GPU常走PCIe；Grace Hopper等可走NVLink-C2C；数据中心还可能经NIC/Storage直达GPU</text><text x=\"340\" y=\"394\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">控制路径仍由CPU提交，数据路径可由DMA Engine执行</text></svg>"}, {"title": "时间模型", "type": "formula", "body": "T_H2D≈T_latency+Bytes÷BW_effective。大块传输受带宽主导，小块传输受固定延迟主导。"}, {"title": "异步条件", "type": "text", "body": "Pinned Host Buffer + cudaMemcpyAsync/non_blocking + 非默认Copy Stream + Copy Engine + 正确Event依赖。"}, {"title": "PyTorch", "type": "code", "body": "loader=DataLoader(dataset,pin_memory=True)\nfor x in loader:\n    x=x.to('cuda',non_blocking=True)"}, {"title": "关键风险", "type": "text", "body": "Pinned源在DMA完成前不能被CPU修改或复用；Pageable路径可能经过内部Staging。"}]}}, {"id": "D2H", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Device-to-Host", "GPU到CPU传输"], "group": "communication", "content": {"sections": [{"title": "定义", "type": "text", "body": "Device Memory→Host Memory。用于业务结果、Checkpoint、CPU后处理、日志、调试和Offload。"}, {"title": "优化原则", "type": "text", "body": "先在GPU做Reduction、Top-k、Sampling或压缩，只返回CPU真正需要的小结果。"}, {"title": "同步边界", "type": "text", "body": "non_blocking D2H返回不代表CPU结果可读；CPU执行numpy、打印、序列化前必须等待Copy Event/Stream。"}, {"title": "异步模式", "type": "code", "body": "cpu_out=torch.empty(y.shape,dtype=y.dtype,pin_memory=True)\ncpu_out.copy_(y,non_blocking=True)\ndone=torch.cuda.current_stream().record_event()\ndone.synchronize()\nconsume(cpu_out)"}, {"title": "Serving例子", "type": "formula", "body": "Batch128、Vocab128K的FP16 Logits约32MiB；GPU采样后只返回128个int32约512Byte，Payload减少约65536倍。"}]}}, {"id": "Pinned Memory", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Page-Locked Memory", "锁页内存"], "group": "memory", "content": {"sections": [{"title": "Pageable对比", "type": "svg", "body": "<svg viewBox=\"0 0 680 440\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>Pageable与Pinned主机内存的H2D路径区别</title><desc>Pageable内存通常先由CPU复制到驱动的Pinned staging缓冲区，再由DMA传到GPU；Pinned内存可以直接作为DMA源，实现更可预测的异步传输。</desc><defs><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></marker></defs><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">Pageable多一次Staging；Pinned允许直接DMA</text><text x=\"40\" y=\"67\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0C447C\">Pageable H2D</text><rect x=\"40\" y=\"83\" width=\"150\" height=\"66\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"115\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pageable内存</text><text x=\"115\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">OS可迁移/换页</text><line x1=\"190\" y1=\"116\" x2=\"246\" y2=\"116\" stroke=\"#185FA5\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"218\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">CPU Copy</text><rect x=\"250\" y=\"83\" width=\"170\" height=\"66\" rx=\"10\" fill=\"#EEEDFE\" stroke=\"#534AB7\" stroke-width=\"0.5\"/><text x=\"335\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#26215C\">内部Pinned Staging</text><text x=\"335\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#534AB7\">驱动管理 · 行为不透明</text><line x1=\"420\" y1=\"116\" x2=\"476\" y2=\"116\" stroke=\"#534AB7\" stroke-width=\"1.5\" marker-end=\"url(#arrow)\"/><text x=\"448\" y=\"101\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#534AB7\">DMA</text><rect x=\"480\" y=\"83\" width=\"160\" height=\"66\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"560\" y=\"105\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"560\" y=\"128\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">Device Tensor</text><rect x=\"40\" y=\"169\" width=\"600\" height=\"42\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"195\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">代价：额外CPU内存复制、CPU/DRAM带宽、不可控Staging、Overlap可能退化</text><text x=\"40\" y=\"252\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">Pinned H2D</text><rect x=\"40\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E6F1FB\" stroke=\"#185FA5\" stroke-width=\"0.5\"/><text x=\"140\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#0C447C\">用户Pinned内存</text><text x=\"140\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#185FA5\">物理页锁定 · 地址稳定</text><text x=\"140\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#185FA5\">cudaHostAlloc/Register</text><line x1=\"240\" y1=\"304\" x2=\"436\" y2=\"304\" stroke=\"#0F6E56\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><text x=\"338\" y=\"289\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#085041\">Copy Engine直接DMA</text><rect x=\"440\" y=\"268\" width=\"200\" height=\"72\" rx=\"10\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"540\" y=\"290\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"500\" fill=\"#04342C\">GPU HBM</text><text x=\"540\" y=\"312\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#0F6E56\">可真正异步入队</text><text x=\"540\" y=\"328\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0F6E56\">配合独立Stream重叠</text><rect x=\"40\" y=\"364\" width=\"600\" height=\"54\" rx=\"10\" fill=\"#FAEEDA\" stroke=\"#854F0B\" stroke-width=\"0.5\"/><text x=\"340\" y=\"385\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" font-weight=\"500\" fill=\"#412402\">Pinned不是越多越好</text><text x=\"340\" y=\"405\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#854F0B\">锁页会减少OS可分页内存；分配/注册昂贵，应使用有限Buffer Pool长期复用</text></svg>"}, {"title": "机制", "type": "text", "body": "Page-locked保证物理页稳定，避免Pageable→内部Pinned Staging，为真正异步传输和Overlap提供基础。"}, {"title": "API", "type": "code", "body": "cudaHostAlloc(&p,bytes,cudaHostAllocDefault);\ncudaHostRegister(existing,bytes,0);\n# PyTorch\nx=torch.empty(shape,pin_memory=True)"}, {"title": "代价", "type": "text", "body": "占用不可分页RAM；分配/注册昂贵；过多会损害系统。推荐有限Pinned Buffer Pool长期复用。"}, {"title": "DataLoader", "type": "text", "body": "DataLoader(pin_memory=True)在后台Pin线程准备Batch，优于训练主线程每批调用pin_memory()。"}, {"title": "生命周期", "type": "text", "body": "异步H2D未完成时CPU不能改写或复用Pinned源；取消注册/释放前必须确认相关Stream完成。"}]}}, {"id": "CUDA Streams", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["CUDA Stream and Event", "CUDA流与事件"], "group": "compute", "content": {"sections": [{"title": "核心语义", "type": "text", "body": "同一Stream按提交顺序执行；不同Stream无默认相对顺序，具备并发可能但不保证。"}, {"title": "Overlap时间线", "type": "svg", "body": "<svg viewBox=\"0 0 680 420\" width=\"100%\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\"><title>CPU GPU串行执行与双缓冲Copy Compute Overlap时间线</title><desc>对比每批先H2D再计算的串行时间线，以及使用Pinned Memory、独立Copy Stream和双缓冲后，下一批H2D与当前批Compute重叠的流水线。</desc><text x=\"40\" y=\"29\" font-family=\"sans-serif\" font-size=\"15\" font-weight=\"500\" fill=\"#26215C\">双缓冲把“相加”变成稳态下接近“取最大值”</text><text x=\"40\" y=\"60\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#501313\">串行：每批H2D后才能Compute</text><text x=\"40\" y=\"91\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"197\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 0 · 11.2 ms</text><rect x=\"385\" y=\"74\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#F09595\"/><text x=\"447\" y=\"92\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#501313\">H2D batch 1 · 11.2 ms</text><text x=\"40\" y=\"132\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"115\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"322\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0 · 8 ms</text><rect x=\"510\" y=\"115\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"133\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><line x1=\"135\" y1=\"157\" x2=\"600\" y2=\"157\" stroke=\"#888780\" stroke-width=\"0.5\"/><text x=\"135\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">0</text><text x=\"260\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">11.2</text><text x=\"385\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">19.2</text><text x=\"510\" y=\"175\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#5F5E5A\">30.4 ms</text><rect x=\"40\" y=\"192\" width=\"600\" height=\"38\" rx=\"8\" fill=\"#FCEBEB\" stroke=\"#A32D2D\" stroke-width=\"0.5\"/><text x=\"340\" y=\"216\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#501313\">串行周期 ≈ T_H2D + T_compute = 11.2 + 8 = 19.2 ms / batch</text><text x=\"40\" y=\"269\" font-family=\"sans-serif\" font-size=\"14\" font-weight=\"500\" fill=\"#0F6E56\">双缓冲：H2D(batch i+1) 与 Compute(batch i) 重叠</text><text x=\"40\" y=\"300\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Copy stream</text><rect x=\"135\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"197\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 0</text><rect x=\"260\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"322\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 1</text><rect x=\"385\" y=\"283\" width=\"125\" height=\"28\" rx=\"5\" fill=\"#5DCAA5\"/><text x=\"447\" y=\"301\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#04342C\">H2D batch 2</text><text x=\"40\" y=\"341\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#5F5E5A\">Compute stream</text><rect x=\"260\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"305\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 0</text><rect x=\"385\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"430\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 1</text><rect x=\"510\" y=\"324\" width=\"90\" height=\"28\" rx=\"5\" fill=\"#85B7EB\"/><text x=\"555\" y=\"342\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#0C447C\">Compute 2</text><rect x=\"40\" y=\"371\" width=\"600\" height=\"32\" rx=\"8\" fill=\"#E1F5EE\" stroke=\"#0F6E56\" stroke-width=\"0.5\"/><text x=\"340\" y=\"391\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"12\" fill=\"#04342C\">稳态周期理想接近 max(T_H2D, T_compute) = 11.2 ms；首尾仍有Fill/Drain</text></svg>"}, {"title": "Event依赖", "type": "code", "body": "with torch.cuda.stream(copy_stream):\n    y=x.to('cuda',non_blocking=True)\n    done=copy_stream.record_event()\ntorch.cuda.current_stream().wait_event(done)"}, {"title": "wait与record", "type": "text", "body": "wait_stream/wait_event解决执行依赖；Tensor.record_stream解决Caching Allocator的内存生命周期。"}, {"title": "性能边界", "type": "text", "body": "Copy Engine、SM、PCIe、HBM可能共享资源；时间线重叠不等于传输完全被隐藏。"}, {"title": "计时", "type": "text", "body": "异步操作应用CUDA Event计时；普通CPU时钟若不在边界同步，常只测到提交时间。"}]}}, {"id": "NUMA", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["Non-Uniform Memory Access"], "group": "compute", "content": {"sections": [{"title": "机制", "type": "text", "body": "多Socket系统中每个GPU通常靠近特定PCIe Root Complex与NUMA Node；远端DRAM需经过UPI/Infinity Fabric。"}, {"title": "优化", "type": "text", "body": "将CPU Worker、Pinned Buffer和GPU绑定到相近NUMA节点；绑定后First-Touch分配，再注册Pinned。"}, {"title": "工具", "type": "code", "body": "nvidia-smi topo -m\nnumactl --cpunodebind=0 --membind=0 python train.py"}, {"title": "指标", "type": "text", "body": "H2D/D2H带宽、NUMA Miss、UPI流量、DataLoader等待和尾延迟。"}]}}, {"id": "Unified Memory", "mastery": 1, "needs_review": false, "next_review": "2026-08-04", "aliases": ["CUDA Managed Memory", "统一内存"], "group": "memory", "content": {"sections": {"source": "CUDA Streams", "target": "D2H", "type": "related"}, {"source": "NUMA", "target": "CPU-GPU Communication", "type": "related"}, {"source": "NUMA", "target": "Pinned Memory", "type": "related"}, {"source": "Unified Memory", "target": "CPU-GPU Communication", "type": "contrasts"}, {"source": "Unified Memory", "target": "H2D", "type": "related"}, {"source": "Unified Memory", "target": "D2H", "type": "related"}, {"source": "GPUDirect", "target": "CPU-GPU Communication", "type": "related"}, {"source": "GPUDirect", "target": "D2H", "type": "related"}, {"source": "GPUDirect", "target": "H2D", "type": "related"}], "groupLabel": {"architecture": "模型架构", "communication": "通信方式", "parallelism": "并行策略", "core": "核心概念", "memory": "显存与优化", "precision": "数值精度与量化", "compute": "GPU 与计算", "compiler": "编译与算子", "framework": "框架与运行时", "kernel": "算子与 Kernel", "inference": "推理与 Serving", "": "未分组"}};
const COLORS = {1:"#94a3b8",2:"#60a5fa",3:"#34d399",4:"#fbbf24",5:"#f87171"};
const GROUP_COLOR = {architecture:"#993C1D", communication:"#534AB7", parallelism:"#0F6E56", core:"#185FA5", memory:"#854F0B", precision:"#7F77DD", compute:"#A32D2D", compiler:"#3B6D11", framework:"#378ADD", kernel:"#BA7517", inference:"#993556", "":"#888780"};
const byId = Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
document.getElementById("metatxt").textContent =
  "概念 "+DATA.nodes.length+" 个 · 关系 "+DATA.edges.length+" 条 · 分" +
  new Set(DATA.nodes.map(n=>n.group||"")).size + " 大类";

let ForceGraph3D;
try {
  const mod = await import("https://esm.sh/3d-force-graph@1.73.4");
  ForceGraph3D = mod.default;
} catch(e){
  document.getElementById("fallback").style.display="flex";
}

function groups(){
  const gs = {};
  for(const n of DATA.nodes){ const k=n.group||""; (gs[k]=gs[k]||[]).push(n); }
  return gs;
}
// 组视图：每个 group 一个大节点；组间边 = 跨组的真实边聚合
function buildGrouped(){
  const gs = groups();
  const nodes = Object.keys(gs).map(k=>({
    id:"grp:"+k, isGroup:true, group:k,
    label:(DATA.groupLabel[k]||k||"未分组")+" ("+gs[k].length+")",
    count:gs[k].length
  }));
  const seen={}, links=[];
  for(const e of DATA.edges){
    const a=byId[e.source], b=byId[e.target]; if(!a||!b) continue;
    const ga=a.group||"", gb=b.group||""; if(ga===gb) continue;
    const key=ga<gb?ga+"|"+gb:gb+"|"+ga;
    if(seen[key]) continue; seen[key]=1;
    links.push({source:"grp:"+ga, target:"grp:"+gb});
  }
  return {nodes, links};
}
// 展开视图：所有真实知识点 + 真实关系边
function buildAll(){
  const nodes = DATA.nodes.map(n=>({id:n.id, isGroup:false, group:n.group||"", mastery:n.mastery, label:n.id}));
  const links = DATA.edges.filter(e=>byId[e.source]&&byId[e.target])
                          .map(e=>({source:e.source, target:e.target, type:e.type}));
  return {nodes, links};
}
// 展开单个组：该组子节点 + 组内边
function buildOneGroup(gk){
  const ids = new Set(DATA.nodes.filter(n=>(n.group||"")===gk).map(n=>n.id));
  const nodes = DATA.nodes.filter(n=>ids.has(n.id)).map(n=>({id:n.id, isGroup:false, group:gk, mastery:n.mastery, label:n.id}));
  const links = DATA.edges.filter(e=>ids.has(e.source)&&ids.has(e.target)).map(e=>({source:e.source,target:e.target,type:e.type}));
  return {nodes, links};
}

let Graph, mode="group", openedGroup=null;
function nodeColor(n){ return n.isGroup ? (GROUP_COLOR[n.group]||"#888780") : (COLORS[n.mastery]||"#94a3b8"); }
function nodeVal(n){ return n.isGroup ? Math.max(6, n.count*3) : 4; }

function makeSprite(n){
  // 用 CSS2D 风格文字：3d-force-graph 支持 nodeThreeObject
  return null;
}

function setData(gd){
  Graph.graphData(gd);
}

function init(){
  if(!ForceGraph3D) return;
  Graph = ForceGraph3D()(document.getElementById("graph"))
    .backgroundColor("#f7f8fa")
    .nodeColor(nodeColor)
    .nodeVal(nodeVal)
    .nodeOpacity(0.95)
    .nodeLabel(n=> n.isGroup ? n.label : (n.id+"（L"+(n.mastery||1)+"）"))
    .linkColor(()=> "#c4c9d0")
    .linkOpacity(0.5)
    .linkWidth(0.5)
    .linkDirectionalParticles(0)
    .onNodeClick(handleClick);
  // 文字标签
  Graph.nodeThreeObject(makeLabel).nodeThreeObjectExtend(true);
  setData(buildGrouped());
}

let SpriteText;
try { const m = await import("https://esm.sh/three-spritetext@1.8.2"); SpriteText = m.default; } catch(e){}
function makeLabel(n){
  if(!SpriteText) return null;
  const t = new SpriteText(n.isGroup ? n.label : n.id);
  t.color = "#1f2328";
  t.textHeight = n.isGroup ? 8 : 5;
  t.position.y = (n.isGroup?1:1) * (nodeVal(n)+6);
  return t;
}

function handleClick(n){
  if(n.isGroup){
    const gk = n.group;
    if(openedGroup===gk){ openedGroup=null; setData(buildGrouped()); }
    else { openedGroup=gk; setData(buildOneGroup(gk)); }
    return;
  }
  openDetail(n.id);
}

document.getElementById("btnGroup").onclick=()=>{
  mode="group"; openedGroup=null;
  document.getElementById("btnGroup").classList.add("on");
  document.getElementById("btnAll").classList.remove("on");
  if(Graph) setData(buildGrouped());
};
document.getElementById("btnAll").onclick=()=>{
  mode="all"; openedGroup=null;
  document.getElementById("btnAll").classList.add("on");
  document.getElementById("btnGroup").classList.remove("on");
  if(Graph) setData(buildAll());
};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const CKEYS=[["conclusion","一句话结论"],["mechanism","机制"],["formula","公式与量级"],["example","例子"],["overlap","能否 overlap"],["usage","应用场景"],["pitfall","常见误区"]];
function openDetail(id){
  const n=byId[id]; if(!n) return;
  const c=n.content||{};
  let html='<div class="dwrap"><span class="back" onclick="window.__closeDetail()">← 返回三维图谱</span>';
  html+='<div class="dtitle">'+esc(n.id)+'<span class="tag">L'+n.mastery+'</span>'+(n.group?'<span class="tag">'+esc(DATA.groupLabel[n.group]||n.group)+'</span>':'')+'</div>';
  if(n.aliases&&n.aliases.length) html+='<div class="dsub">别名：'+esc(n.aliases.join(" / "))+'</div>';
  html+='<div class="dsub">下次复习 '+n.next_review+(n.needs_review?' · 需复习':'')+'</div>';
  const secs=(c.sections&&Array.isArray(c.sections))?c.sections:[];
  if(secs.length){
    for(const s of secs){
      html+='<div class="sec"><div class="sech">'+esc(s.title||"")+'</div>';
      if(s.type==="svg") html+=s.body;
      else if(s.type==="code"||s.type==="formula") html+='<pre>'+esc(s.body)+'</pre>';
      else html+='<p>'+esc(s.body)+'</p>';
      html+='</div>';
    }
  } else {
    let any=false;
    for(const [k,label] of CKEYS){ if(c[k]){any=true; html+='<div class="sec"><div class="sech">'+label+'</div><p>'+esc(c[k])+'</p></div>';}}
    if(!any) html+='<div class="sec"><p>（该节点暂无详细内容）</p></div>';
  }
  const outs=DATA.edges.filter(e=>e.source===n.id), ins=DATA.edges.filter(e=>e.target===n.id);
  if(outs.length||ins.length){
    html+='<div class="sec"><div class="sech">关联关系</div>';
    outs.forEach(e=>{html+='<div class="rel">'+esc(n.id)+' <b>'+esc(e.type)+'</b> → <span class="relbtn" onclick="window.__open(\''+esc(e.target)+'\')">'+esc(e.target)+'</span></div>';});
    ins.forEach(e=>{html+='<div class="rel"><span class="relbtn" onclick="window.__open(\''+esc(e.source)+'\')">'+esc(e.source)+'</span> <b>'+esc(e.type)+'</b> → '+esc(n.id)+'</div>';});
    html+='</div>';
  }
  html+='</div>';
  const dt=document.getElementById("detail"); dt.innerHTML=html; dt.style.display="block"; dt.scrollTop=0;
}
window.__open=openDetail;
window.__closeDetail=()=>{ document.getElementById("detail").style.display="none"; };
window.__openGroup=(group)=>handleClick({isGroup:true,group});
window.__graphState=()=>{
  const gd=Graph?Graph.graphData():{nodes:[],links:[]};
  return {mode,openedGroup,nodes:gd.nodes.map(n=>n.id),links:gd.links.length,ready:!!Graph};
};

init();
</script>
