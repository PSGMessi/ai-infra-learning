<style>
:root{--paper:#fbfaf6;--page:#fffefa;--canvas:#f3efe5;--ink:#1f2933;--muted:#6b7280;--line:#ded8ca;--navy:#19324d;--blue:#315f84;--red:#9d3b35;--gold:#a67835;--shadow:0 12px 36px rgba(41,35,25,.10);--serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"SFMono-Regular",Menlo,Consolas,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:hidden}body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);line-height:1.75}a{color:inherit}.progress{position:fixed;left:0;top:0;height:3px;width:0;background:var(--red);z-index:100}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 5vw;background:rgba(251,250,246,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font-family:var(--serif);font-weight:600;color:var(--navy);letter-spacing:.04em}.topbar nav{display:flex;gap:16px;font-size:13px;color:var(--muted)}.topbar a{text-decoration:none}.shell{width:min(1120px,92vw);margin:0 auto}.cover{min-height:calc(100vh - 49px);display:grid;place-items:center;padding:50px 0}.book-cover{position:relative;width:min(660px,90vw);min-height:480px;padding:74px 72px 60px;background:#17324d;color:#f9f5e9;border-radius:4px 14px 14px 4px;box-shadow:22px 22px 0 #d7cfbe,var(--shadow);overflow:hidden}.book-cover:before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.18)}.book-cover:after{content:"";position:absolute;inset:18px;border:1px solid rgba(232,218,185,.38);border-radius:2px 10px 10px 2px;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#d9c99f}.book-cover h1{font-family:var(--serif);font-size:clamp(42px,7vw,72px);line-height:1.12;margin:34px 0 18px;font-weight:600;letter-spacing:.02em}.subtitle{max-width:470px;color:#d7dfdf;font-size:16px}.cover-meta{display:flex;gap:30px;margin-top:62px;padding-top:20px;border-top:1px solid rgba(255,255,255,.22);font-size:12px;color:#d7dfdf}.open-btn{margin-top:30px;border:1px solid #d9c99f;background:transparent;color:#f9f5e9;border-radius:999px;padding:10px 18px;font-size:13px;cursor:pointer}.section{padding:80px 0}.section-title{font-family:var(--serif);font-size:34px;line-height:1.2;margin:0;color:var(--navy)}.section-kicker{font-size:12px;letter-spacing:.16em;color:var(--red);margin-bottom:10px}.toc-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.section-title-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.controls{display:flex;flex-wrap:wrap;gap:10px}.controls input,.controls select{height:38px;border:1px solid var(--line);background:var(--page);border-radius:8px;padding:0 12px;color:var(--ink);font:13px var(--sans);outline:none}.controls input{width:240px}.download-btn,.download-all{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cdbd9d;background:#fffaf0;color:#7f5a20;border-radius:999px;padding:7px 12px;font:500 12px var(--sans);line-height:1;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}.download-btn:hover,.download-all:hover{background:#f2e8d2;border-color:#a67835;color:#654415}.download-all{padding:9px 14px}.download-btn:before,.download-all:before{content:"↓";font-size:14px;line-height:1}.toc-page{background:var(--page);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:22px 30px}.toc-row{display:grid;grid-template-columns:44px minmax(0,1fr) 132px;gap:14px;align-items:start;padding:18px 2px;border-bottom:1px solid #ebe6dc}.toc-row:last-child{border-bottom:0}.toc-link{text-decoration:none;min-width:0}.toc-link:hover .toc-title{color:var(--red)}.toc-num{font:14px var(--serif);color:var(--gold);padding-top:2px}.toc-title{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--navy);transition:.2s}.toc-question{font-size:13px;color:var(--muted);margin-top:3px}.toc-actions{display:flex;flex-direction:column;align-items:flex-end;gap:9px}.toc-meta{text-align:right;font-size:11px;color:var(--muted);white-space:nowrap}.badge{display:inline-block;border:1px solid #d8cbb0;border-radius:999px;padding:1px 8px;color:#7f5a20;margin-bottom:5px}.articles{padding-bottom:120px}.article{scroll-margin-top:74px;background:var(--page);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;margin:0 0 38px;padding:58px 64px;position:relative}.article:before{content:attr(data-index);position:absolute;right:36px;top:28px;font:64px/1 var(--serif);color:#eee8dc}.article-head{position:relative;z-index:1;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:30px}.article .label{font-size:11px;letter-spacing:.15em;color:var(--red)}.article h2{font:600 clamp(30px,5vw,46px)/1.25 var(--serif);color:var(--navy);margin:8px 0 12px}.original-question{border-left:3px solid var(--gold);padding:10px 14px;background:#f8f4e9;color:#4b5563;font-size:14px}.article-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--muted)}.content{font-size:15px}.content h1,.content h2,.content h3,.content h4{font-family:var(--serif);color:var(--navy);line-height:1.35;scroll-margin-top:72px}.content h2{font-size:27px;margin:44px 0 16px;border-bottom:1px solid #ece6da;padding-bottom:8px}.content h3{font-size:21px;margin:32px 0 10px}.content p{margin:12px 0}.content ul,.content ol{padding-left:1.5em}.content li{margin:6px 0}.content blockquote{margin:20px 0;padding:12px 18px;border-left:3px solid var(--blue);background:#f2f6f8;color:#41505d}.content pre{padding:16px 18px;overflow:auto;background:#17232d;color:#e8eef3;border-radius:9px;font:13px/1.65 var(--mono);white-space:pre-wrap}.content code{font-family:var(--mono);font-size:.9em}.content :not(pre)>code{background:#f0ece3;border:1px solid #e1dbcf;padding:1px 5px;border-radius:4px;color:#7d3330}.content table{width:100%;border-collapse:separate;border-spacing:0;margin:24px 0;font-size:14px;display:block;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 5px 18px rgba(41,35,25,.05)}.content th,.content td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 16px;text-align:left;min-width:140px;vertical-align:top}.content th:last-child,.content td:last-child{border-right:0}.content tbody tr:last-child td{border-bottom:0}.content tbody tr:nth-child(even) td{background:#fbfaf6}.content th{background:#f0ece2;color:var(--navy);font-weight:700;white-space:nowrap}.content svg{display:block;max-width:100%;height:auto;margin:22px auto;border:1px solid #eee8dd;border-radius:10px;background:#fff;padding:8px}.content .callout{padding:15px 18px;background:#eef4f7;border:1px solid #d7e2e8;border-radius:9px;margin:20px 0}.article-foot{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding-top:18px;margin-top:36px;font-size:12px;color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.footer{text-align:center;padding:20px 0 60px;color:var(--muted);font-size:12px}.mobile-toc{display:none}
@media(max-width:760px){.topbar{padding:10px 16px}.topbar nav a:nth-child(2){display:none}.shell{width:min(94vw,680px)}.cover{min-height:calc(100vh - 48px);padding:20px 0 38px}.book-cover{min-height:72vh;padding:58px 34px 40px;box-shadow:10px 12px 0 #d7cfbe}.cover-meta{margin-top:44px;gap:14px;flex-direction:column}.section{padding:55px 0}.toc-head{align-items:flex-start;flex-direction:column}.section-title-line{width:100%;justify-content:space-between}.controls{width:100%}.controls input{width:100%}.controls select{flex:1}.toc-page{padding:10px 18px}.toc-row{grid-template-columns:32px minmax(0,1fr);gap:10px}.toc-actions{grid-column:2;align-items:flex-start;flex-direction:row;justify-content:space-between;width:100%}.toc-meta{text-align:left}.toc-title{font-size:18px}.download-btn{padding:7px 10px}.article{padding:38px 22px;margin-bottom:24px}.article:before{right:15px;top:18px;font-size:46px}.article h2{font-size:32px}.content{font-size:14px}.content h2{font-size:23px}.article-foot{flex-direction:column}.mobile-toc{display:inline}}
@media print{.topbar,.cover,.controls,.progress,.article-foot,.download-btn,.download-all{display:none!important}body{background:#fff}.section{padding:0}.toc-page,.article{box-shadow:none;border:0;break-inside:avoid}.article{page-break-before:always;padding:20mm 14mm}.shell{width:100%}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="topbar"><div class="brand">AI Infra Learning Book</div><nav><a href="#cover">封面</a><a href="#contents">目录</a><a href="#reading">连续阅读</a><a href="knowledge-graph/">三维知识图谱</a></nav></header>
<main>
<section class="cover" id="cover"><div class="book-cover"><div class="eyebrow">Personal technical notebook</div><h1>AI Infra<br>Learning Book</h1><p class="subtitle">记录每一次提问与完整教学回答。知识图谱负责连接结构，这本书负责保留上下文、推导、图示与例子。</p><div class="cover-meta"><span id="coverCount">0 个知识点</span><span id="coverUpdated">持续更新</span><span>完整正文 · 图文并茂</span></div><button class="open-btn" onclick="document.getElementById('contents').scrollIntoView()">翻开学习笔记</button></div></section>
<section class="section shell" id="contents"><div class="toc-head"><div><div class="section-kicker">Contents</div><div class="section-title-line"><h2 class="section-title">目录</h2><a class="download-all" href="pdf/ai-infra-learning-book-complete.pdf?v=63b858437cad6493" download="AI-Infra-Learning-Book-Complete.pdf" aria-label="下载完整AI Infra Learning Book PDF">Download complete PDF</a></div></div><div class="controls"><input id="search" type="search" placeholder="搜索知识点或问题"><select id="sort"><option value="time-asc">按提问时间：从早到晚</option><option value="time-desc">按提问时间：从晚到早</option><option value="importance">按重要程度</option></select></div></div><div class="toc-page" id="toc"></div></section>
<section class="articles shell" id="reading"></section>
</main>
<footer class="footer">AI Infra Learning Book · 本地内容自动维护，在线版本按更新发布</footer>
<script src="entries.js?v=2b59f9397728aa94"></script>
<script>
const state={sort:'time-asc',query:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ordered(){let arr=[...(window.AI_INFRA_BOOK_ENTRIES||[])];const pinned=arr.filter(x=>x.pinned);let rest=arr.filter(x=>!x.pinned);if(state.sort==='time-desc')rest.sort((a,b)=>new Date(b.askedAt)-new Date(a.askedAt));else if(state.sort==='importance')rest.sort((a,b)=>(b.importance||0)-(a.importance||0)||new Date(a.askedAt)-new Date(b.askedAt));else rest.sort((a,b)=>new Date(a.askedAt)-new Date(b.askedAt));arr=[...pinned,...rest];if(state.query){const q=state.query.toLowerCase();arr=arr.filter(x=>(x.title+' '+x.question+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q));}return arr;}
function formatDate(v){try{return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}
function render(){const arr=ordered();document.getElementById('coverCount').textContent=(window.AI_INFRA_BOOK_ENTRIES||[]).length+' 个知识点';const dates=(window.AI_INFRA_BOOK_ENTRIES||[]).map(x=>new Date(x.updatedAt||x.askedAt));if(dates.length)document.getElementById('coverUpdated').textContent='更新于 '+formatDate(new Date(Math.max(...dates)));const toc=document.getElementById('toc');const reading=document.getElementById('reading');if(!arr.length){toc.innerHTML='<div class="empty">没有匹配的知识点</div>';reading.innerHTML='';return}toc.innerHTML=arr.map((x,i)=>`<div class="toc-row"><span class="toc-num">${String(x.chapterNumber||i+1).padStart(2,'0')}</span><a class="toc-link" href="#note-${esc(x.id)}"><div class="toc-title">${esc(x.title)}</div><div class="toc-question">${esc(x.question)}</div></a><span class="toc-actions"><span class="toc-meta">${x.pinned?'<span class="badge">使用指南</span><br>':''}${formatDate(x.askedAt)}<br>重要度 ${x.importance||3}/5</span><a class="download-btn" href="${esc(x.pdfPath||'')}" download aria-label="下载 Chapter ${String(x.chapterNumber||i+1).padStart(2,'0')} PDF">Download PDF</a></span></div>`).join('');reading.innerHTML=arr.map((x,i)=>`<article class="article" id="note-${esc(x.id)}" data-index="${String(x.chapterNumber||i+1).padStart(2,'0')}"><header class="article-head"><div class="label">${esc((x.tags||[]).join(' · '))}</div><h2>${esc(x.title)}</h2><div class="original-question"><strong>原始问题：</strong>${esc(x.question)}</div><div class="article-meta"><span>提问：${formatDate(x.askedAt)}</span><span>更新：${formatDate(x.updatedAt||x.askedAt)}</span><span>重要度：${x.importance||3}/5</span></div></header><div class="content">${x.answerHtml}</div><footer class="article-foot"><span>本文保留完整教学正文；省略执行状态与工具通知。</span><a href="#contents">返回目录</a></footer></article>`).join('');}
document.getElementById('sort').addEventListener('change',e=>{state.sort=e.target.value;render()});document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value.trim();render()});addEventListener('scroll',()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight);document.getElementById('progress').style.width=(Math.max(0,Math.min(1,p))*100)+'%'});render();
</script>
</body>
</html>
